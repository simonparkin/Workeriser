<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Workeriser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef2f4;
    --surface:#ffffff;
    --ink:#10202f;
    --ink-soft:#516b7a;
    --navy:#123a5e;
    --navy-deep:#0a2540;
    --amber:#f0a202;
    --amber-deep:#c98600;
    --green:#1f8a54;
    --green-bg:#e5f4ec;
    --red:#c23b3b;
    --red-bg:#fbe9e9;
    --slate:#8fa1ac;
    --slate-bg:#eef1f2;
    --line:#dbe3e7;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,h3,.display{font-family:'Space Grotesk',system-ui,sans-serif;}
  button{font-family:inherit;}
  #app{max-width:560px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;}

  /* ---------- header ---------- */
  .topbar{
    background:linear-gradient(160deg,var(--navy-deep),var(--navy));
    color:#fff;
    padding:18px 20px 16px;
    position:sticky;top:0;z-index:20;
  }
  .topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{
    width:34px;height:34px;border-radius:9px;
    background:var(--amber);
    display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk';font-weight:700;color:var(--navy-deep);font-size:15px;
    flex:none;
  }
  .brand-text .t1{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#b9cbd8;font-weight:600;}
  .brand-text .t2{font-size:18px;font-weight:700;line-height:1.1;}
  .topbar-btn{
    background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);color:#fff;
    padding:7px 12px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;
  }
  .topbar-btn:active{background:rgba(255,255,255,.22);}
  .topbar-sub{margin-top:12px;display:flex;justify-content:space-between;align-items:baseline;color:#cfdce5;font-size:13px;}
  .topbar-sub b{color:#fff;font-weight:700;}

  /* ---------- generic ---------- */
  .main{flex:1;padding:18px 16px 100px;}
  .card{background:var(--surface);border-radius:var(--radius);box-shadow:0 1px 2px rgba(10,37,64,.06), 0 6px 18px rgba(10,37,64,.05);}
  .center-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;text-align:center;}
  .muted{color:var(--ink-soft);}
  .stack{display:flex;flex-direction:column;gap:12px;}

  /* ---------- login screen ---------- */
  .login-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;padding:32px 24px;}
  .login-hero{text-align:center;margin-bottom:34px;}
  .login-hero .glyph{
    width:64px;height:64px;border-radius:16px;margin:0 auto 16px;
    background:linear-gradient(160deg,var(--navy),var(--navy-deep));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 20px rgba(10,37,64,.25);
  }
  .login-hero h1{font-size:24px;margin:0 0 6px;color:var(--navy-deep);}
  .login-hero p{margin:0;color:var(--ink-soft);font-size:14px;}
  .worker-btn{
    display:flex;align-items:center;gap:14px;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 18px;cursor:pointer;text-align:left;width:100%;
    box-shadow:0 1px 2px rgba(10,37,64,.05);
  }
  .worker-btn:active{background:#f4f7f8;}
  .worker-avatar{
    width:42px;height:42px;border-radius:50%;flex:none;
    background:var(--amber);color:var(--navy-deep);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-family:'Space Grotesk';font-size:16px;
  }
  .worker-btn .name{font-weight:700;font-size:16px;}
  .worker-btn .sub{font-size:12.5px;color:var(--ink-soft);margin-top:1px;}
  .worker-btn .chev{margin-left:auto;color:var(--slate);}
  .admin-link{
    margin-top:26px;text-align:center;font-size:13px;color:var(--ink-soft);
    text-decoration:underline;cursor:pointer;
  }

  /* ---------- job list ---------- */
  .round-label{
    font-family:'Space Grotesk';font-size:12.5px;font-weight:700;letter-spacing:.04em;
    color:var(--navy);text-transform:uppercase;margin:22px 0 8px 2px;
    display:flex;align-items:center;gap:8px;
  }
  .round-label:first-child{margin-top:2px;}
  .round-label::after{content:"";flex:1;height:1px;background:var(--line);}

  .completed-divider{
    display:flex;align-items:center;gap:10px;
    margin:26px 0 14px;color:var(--slate);
  }
  .completed-divider::before,.completed-divider::after{content:"";flex:1;height:1px;background:var(--line);}
  .completed-divider span{

  .job-card.status-done{border-color:#bfe3cd;background:var(--green-bg);}
  .job-card.status-skipped{border-color:#e6dab8;background:#fbf3e0;}
  .job-card.status-cancelled{border-color:#f0c9c9;background:var(--red-bg);opacity:.75;}

  .job-top{display:flex;justify-content:space-between;gap:10px;}
  .job-info .addr{font-weight:700;font-size:15.5px;line-height:1.3;color:var(--ink);}
  .cust-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:3px;}

  .phone-btn{

  .nav-btn{

    background:var(--navy);color:#fff;text-decoration:none;

  .job-info .notes{font-size:12.5px;color:var(--amber-deep);margin-top:6px;font-weight:600;}

  .price-block{text-align:right;flex:none;}
  .price-edit{display:flex;align-items:center;justify-content:flex-end;gap:2px;}
  .price-edit .pfx{font-family:'Space Grotesk';font-weight:700;font-size:19px;color:var(--navy-deep);}
  .price-input{

  .price-block .front{

  .status-btn{

  .status-btn .ic{font-size:15px;}

  .pay-row{display:flex;gap:10px;margin-top:12px;}
  .pay-field{flex:1;}
  .pay-field label{font-size:12.5px;color:var(--ink-soft);font-weight:600;display:block;margin-bottom:5px;}
  .pay-input-wrap{

    border:1.5px solid var(--line);border-radius:9px;padding:8px 8px 8px 10px;background:#fbfcfd;

  .pay-input-wrap .pfx{color:var(--ink-soft);}
  .pay-input-wrap:focus-within{outline:2px solid var(--navy);border-color:var(--navy);}
  .pay-input-wrap input{
    width:100%;border:none;background:transparent;font-size:15px;font-weight:600;font-family:'Inter';padding:0;

  .pay-input-wrap input:focus{outline:none;}
  .balance-value{
    border:1.5px solid var(--line);border-radius:9px;padding:9px 10px;background:#fbfcfd;

  .note-field{margin-top:10px;}

  .note-field textarea{

  /* squeegee wipe */
  .wipe{
    position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(100deg,transparent 0%,rgba(255,255,255,.85) 45%,rgba(255,255,255,0) 60%);
    transform:translateX(-120%);
  }
  .wipe.play{animation:squeegee .55s ease-out;}
  @keyframes squeegee{ to{transform:translateX(120%);} }
  @media (prefers-reduced-motion: reduce){ .wipe.play{animation:none;} }

  /* ---------- summary bar / footer ---------- */
  .summary-bar{
    position:sticky;bottom:0;left:0;right:0;
    background:rgba(255,255,255,.92);backdrop-filter:blur(6px);
    border-top:1px solid var(--line);
    padding:10px 16px;display:flex;gap:10px;
  }
  .sum-pill{
    flex:1;text-align:center;padding:6px 4px;border-radius:9px;background:var(--slate-bg);
  }
  .sum-pill .n{font-family:'Space Grotesk';font-weight:700;font-size:16px;color:var(--navy-deep);}
  .sum-pill .l{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);}
  .finish-btn{
    flex:none;background:var(--amber);color:var(--navy-deep);border:none;border-radius:9px;

  /* ---------- forms / admin ---------- */
  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:13px;font-weight:600;color:var(--ink-soft);}
  .field input,.field select{
    border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;font-size:15px;font-family:inherit;background:#fff;
  }
  .field input:focus,.field select:focus{outline:2px solid var(--navy);border-color:var(--navy);}
  .btn{
    border:none;border-radius:10px;padding:12px 16px;font-weight:700;font-size:14.5px;cursor:pointer;

  .btn-primary{background:var(--navy);color:#fff;}
  .btn-primary:active{background:var(--navy-deep);}
  .btn-amber{background:var(--amber);color:var(--navy-deep);}
  .btn-ghost{background:transparent;color:var(--navy);border:1.5px solid var(--line);}
  .btn-block{width:100%;}
  .tab-row{display:flex;gap:6px;margin-bottom:16px;background:var(--slate-bg);padding:4px;border-radius:11px;}
  .tab-btn{flex:1;border:none;background:transparent;padding:9px 4px;border-radius:8px;font-weight:700;font-size:12.5px;color:var(--ink-soft);cursor:pointer;}
  .tab-btn.active{background:#fff;color:var(--navy-deep);box-shadow:0 1px 3px rgba(10,37,64,.12);}
  .section-title{font-family:'Space Grotesk';font-weight:700;font-size:15px;margin:0 0 10px;color:var(--navy-deep);}
  .pad{padding:16px;}
  .note-box{background:var(--slate-bg);border-radius:10px;padding:12px 14px;font-size:12.5px;color:var(--ink-soft);line-height:1.5;}

  table.report{width:100%;border-collapse:collapse;font-size:12.5px;}
  table.report th,table.report td{padding:7px 6px;text-align:left;border-bottom:1px solid var(--line);}
  table.report th{font-size:10.5px;text-transform:uppercase;color:var(--ink-soft);letter-spacing:.03em;}
  table.report td.num{text-align:right;font-weight:600;}
  .badge{display:inline-block;padding:2px 7px;border-radius:6px;font-size:11px;font-weight:700;}
  .badge-done{background:var(--green-bg);color:var(--green);}
  .badge-skipped{background:#fbf3e0;color:var(--amber-deep);}
  .badge-cancelled{background:var(--red-bg);color:var(--red);}
  .badge-todo{background:var(--slate-bg);color:var(--ink-soft);}

  .toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
    background:var(--navy-deep);color:#fff;padding:11px 18px;border-radius:10px;font-size:13.5px;font-weight:600;
    box-shadow:0 8px 20px rgba(10,37,64,.3);z-index:100;opacity:0;transition:opacity .2s;pointer-events:none;
    max-width:90%;text-align:center;
  }
  .toast.show{opacity:1;}
  .back-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
  .back-row .back{cursor:pointer;color:var(--navy);font-weight:700;font-size:13px;}
  .empty-state{padding:40px 20px;text-align:center;color:var(--ink-soft);}
</style>

<div id="app"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* =========================================================================
   FIREBASE SETUP — fill this in so every phone shares the same data.
   1. Go to https://console.firebase.google.com, create a free project.
   2. In the project, click the </> (web app) icon to register a web app —
      it will show you a firebaseConfig object. Copy those values in below.
   3. In the left menu go to Databases & Storage > Firestore > Create database
      (choose the open/permissive starting rules option, not "Restrictive").
   4. Later, tighten the rules in Firestore > Rules to something like:
        rules_version = '2';
        service cloud.firestore {
          match /databases/{database}/documents {
            match /workeriser/{docId} { allow read, write: if true; }
          }
        }
      (This keeps it simple, no logins — same "not high security, just
      keeps casual browsers out" level as the office password.)
   ========================================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyABEfdCUcjsaHwpu78luEE25R9__jgg0Q4",
  authDomain: "workeriser.firebaseapp.com",
  projectId: "workeriser",
  storageBucket: "workeriser.firebasestorage.app",
  messagingSenderId: "5012320559",
  appId: "1:5012320559:web:047bc3931048a27cd171da"
};

const configOk = !!firebaseConfig.apiKey && !firebaseConfig.apiKey.startsWith('PASTE_');
let db = null;
if(configOk){
  try{
    const fbApp = initializeApp(firebaseConfig);
    db = getFirestore(fbApp);
  }catch(err){ console.error('Firebase init failed', err); }
}

async function fsGet(key){
  if(!db) return null;
  try{
    const snap = await getDoc(doc(db,'workeriser',key));
    return snap.exists() ? snap.data().value : null;
  }catch(err){
    console.error('fsGet failed', key, err);
    toast('Connection problem loading data');
    return null;
  }
}
async function fsSet(key, value){
  if(!db) return false;
  try{
    await setDoc(doc(db,'workeriser',key), { value, updatedAt: Date.now() });
    return true;
  }catch(err){
    console.error('fsSet failed', key, err);
    toast('Connection problem saving — try again');
    return false;
  }
}

/* ================= CONFIG / STORAGE ================= */
const WORKERS = ['Jim','Vlado','Shane'];
// Required whenever the office area hasn't had a custom password set for this
// shared database. Visible to anyone who views the page source — this is a
// "keep casual browsers out" lock, not real security.
const DEFAULT_ADMIN_PW = 'squeegee2026';

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

async function getPassword(){ const v = await fsGet('admin_pw'); return v || DEFAULT_ADMIN_PW; }
async function setPassword(p){ await fsSet('admin_pw', p); }

async function getMeta(){
  const m = await fsGet('meta');
  return m || { lastDate:{}, rounds:[] };
}
async function saveMeta(meta){ await fsSet('meta', meta); }

async function loadJobs(worker,date){ return await fsGet(`jobs_${worker}_${date}`); }
async function saveJobs(worker,date,jobs){
  await fsSet(`jobs_${worker}_${date}`, jobs);
  const meta = await getMeta();
  meta.lastDate[worker] = date;
  const key = `${worker}|${date}`;
  if(!meta.rounds.includes(key)) meta.rounds.push(key);
  await saveMeta(meta);
}
async function loadProgress(worker,date){ return (await fsGet(`progress_${worker}_${date}`)) || {}; }
async function saveProgress(worker,date,prog){ await fsSet(`progress_${worker}_${date}`, prog); }

async function findAnyDateForWorker(worker){
  const meta = await getMeta();
  return meta.lastDate[worker] || null;
}

/* ================= CSV PARSING ================= */
function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c === '\r'){ /* skip */ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  if(!rows.length) return [];
  const headers = rows[0].map(h=>h.trim());
  return rows.slice(1).filter(r=>r.length>1 || r[0] !== '').map(r=>{
    const obj = {};
    headers.forEach((h,idx)=>{ obj[h] = (r[idx] !== undefined ? r[idx] : '').trim(); });
    return obj;
  });
}

function pick(row, candidates){
  for(const c of candidates){
    if(row[c] !== undefined && String(row[c]).trim() !== '') return row[c];
  }
  return '';
}

function rowsToJobs(rows){
  return rows.map((r,idx)=>{
    const price = parseFloat(pick(r,['Price'])) || 0;
    const balance = parseFloat(pick(r,['Balance'])) || 0;
    const frontPrice = Math.round((price/2 + 1) * 100) / 100;
    const lat = parseFloat(pick(r,['Job Latitude','Customer Latitude']));
    const lon = parseFloat(pick(r,['Job Longitude','Customer Longitude']));
    const address = pick(r,['Job Address','Customer Address','Address']);
    const postcode = pick(r,['Job Postcode','Customer Postcode']);
    const phone = pick(r,['Job Phone 1','Customer Phone 1','Phone 1']);
    return {
      id: pick(r,['Aworka Job ID','Aworka ID','Job Ref']) || ('row'+idx),
      order: idx,
      customer: (pick(r,['Customer Name','Customer']) || '').trim() || '(no name on file)',
      address: address,
      postcode: postcode,
      phone: phone,
      lat: isFinite(lat) ? lat : null,
      lon: isFinite(lon) ? lon : null,
      round: pick(r,['Round']) || '',
      price: price,
      frontPrice: frontPrice,
      balance: balance,
      notes: pick(r,['Job Day Notes','Notes','Description','Job Notes']),
      timeRequired: pick(r,['Time Required']),
      frequency: pick(r,['Frequency'])
    };
  });
}

function navUrl(job){
  if(job.lat != null && job.lon != null){
    return `https://www.google.com/maps/dir/?api=1&destination=${job.lat},${job.lon}`;
  }
  const q = [job.address, job.postcode].filter(Boolean).join(', ');
  return `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(q)}`;
}

/* ---- coordinate reference lookup (address -> lat/lon), updated occasionally ---- */
async function loadCoordLookup(){ return (await fsGet('coord_lookup')) || { updatedAt:null, addresses:{} }; }
async function saveCoordLookup(lookup){ await fsSet('coord_lookup', lookup); }

function normAddr(a){
  return (a||'').toLowerCase().replace(/[^a-z0-9, ]/g,'').replace(/\s+/g,' ').trim();
}

function buildCoordAddresses(rows){
  const addresses = {};
  rows.forEach(r=>{
    const addr = pick(r,['Job Address','Customer Address','Address']);
    const lat = parseFloat(pick(r,['Job Latitude','Customer Latitude']));
    const lon = parseFloat(pick(r,['Job Longitude','Customer Longitude']));
    const n = normAddr(addr);
    if(n && isFinite(lat) && isFinite(lon)){
      addresses[n] = { lat, lon, raw: addr };
    }
  });
  return addresses;
}

function findCoordsForAddress(address, lookup){
  const n = normAddr(address);
  if(!n) return null;
  if(lookup.addresses[n]) return lookup.addresses[n];
  let best = null, bestLen = 0;
  for(const key in lookup.addresses){
    if((key.includes(n) || n.includes(key)) && key.length > bestLen){
      best = lookup.addresses[key];
      bestLen = key.length;
    }
  }
  return best;
}

// fills in missing coordinates on a set of jobs from the stored lookup; returns list of addresses still missing
async function resolveCoordinates(jobs){
  const lookup = await loadCoordLookup();
  const missing = [];
  jobs.forEach(job=>{
    if(job.lat == null || job.lon == null){
      const found = findCoordsForAddress(job.address, lookup);
      if(found){ job.lat = found.lat; job.lon = found.lon; }
    }
    if(job.lat == null || job.lon == null){
      missing.push(job.address || job.customer);
    }
  });
  return missing;
}

// after a fresh coordinate reference is uploaded, retroactively fill in any already-loaded rounds
async function rescanAllRoundsForCoords(){
  const lookup = await loadCoordLookup();
  const meta = await getMeta();
  let fixed = 0, stillMissing = 0;
  for(const key of meta.rounds){
    const [worker,date] = key.split('|');
    const jobs = await fsGet(`jobs_${worker}_${date}`);
    if(!jobs) continue;
    let changed = false;
    jobs.forEach(job=>{
      if(job.lat == null || job.lon == null){
        const found = findCoordsForAddress(job.address, lookup);
        if(found){ job.lat = found.lat; job.lon = found.lon; changed = true; fixed++; }
        else stillMissing++;
      }
    });
    if(changed) await fsSet(`jobs_${worker}_${date}`, jobs);
  }
  return { fixed, stillMissing };
}

/* ================= APP STATE ================= */
let state = { screen:'login' };
const app = document.getElementById('app');

function go(screen, extra){ state = Object.assign({screen}, extra); render(); }

function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(()=>t.classList.add('show'));
  setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(),250); }, 1900);
}

function money(n){
  const v = Math.round((n + Number.EPSILON)*100)/100;
  const sign = v < 0 ? '-' : '';
  return sign + '£' + Math.abs(v).toFixed(2);
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}

function resolvedPrice(job, p){
  return (p && p.price !== undefined && p.price !== '' && !isNaN(parseFloat(p.price))) ? parseFloat(p.price) : job.price;
}

let lastScreenRendered = null;
async function render(){
  if(!configOk){ renderNeedsSetup(); return; }
  const sameScreen = state.screen === lastScreenRendered;
  const savedScroll = sameScreen ? window.scrollY : 0;
  if(!sameScreen){
    app.innerHTML = '<div class="center-screen"><p class="muted">Loading…</p></div>';
  }
  lastScreenRendered = state.screen;
  if(state.screen==='login') await renderLogin();
  else if(state.screen==='worker') await renderWorker();
  else if(state.screen==='daySummary') await renderDaySummary();
  else if(state.screen==='adminLogin') renderAdminLogin();
  else if(state.screen==='admin') await renderAdmin();
  if(sameScreen) window.scrollTo(0, savedScroll);
}

async function renderWorker(){

  const [jobs, prog] = await Promise.all([loadJobs(worker,date), loadProgress(worker,date)]);
  app.innerHTML = '';

  const header = document.createElement('div');
  header.className = 'topbar';
  const doneCount = jobs ? jobs.filter(j=>prog[j.id] && prog[j.id].status==='done').length : 0;
  const collected = jobs ? jobs.reduce((s,j)=> s + (prog[j.id]?.payment ? parseFloat(prog[j.id].payment)||0 : 0), 0) : 0;
  header.innerHTML = `
    <div class="topbar-row">
      <div class="brand">
        <div class="brand-mark">${worker[0]}</div>
        <div class="brand-text"><div class="t1">Round · ${date}</div><div class="t2">${worker}</div></div>

  `;
  app.appendChild(header);
  header.querySelector('#switchBtn').onclick = ()=> go('login');

    main.innerHTML = `<div class="empty-state">No round has been loaded for ${worker} yet.<br>Ask the office to upload today's job list.</div>`;

  }

  const sorted = jobs.slice().sort((a,b)=>a.order-b.order);

  const completedJobs = sorted.filter(j=> prog[j.id] && prog[j.id].status!=='todo');

function renderJobCard(worker,date,job,prog){
  const p = prog[job.id] || { status:'todo', payment:'', price:'', note:'' };
  const card = document.createElement('div');
  card.className = `card job-card status-${p.status}`;

  const debt = -job.balance; // positive = customer owes
  const priceVal = (p.price !== undefined && p.price !== '' && !isNaN(parseFloat(p.price))) ? p.price : job.price;
  const telHref = job.phone ? `tel:${job.phone.replace(/[^0-9+]/g,'')}` : '';

  card.innerHTML = `
    <div class="wipe"></div>
    <div class="job-top">
      <div class="job-info">
        <div class="addr">${escapeHtml(job.address)}</div>
        <div class="cust-row">
          <span class="cust">${escapeHtml(job.customer)}</span>
          ${job.phone ? `<a class="phone-btn" href="${telHref}">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M6 3h3l2 5-2.5 1.5a11 11 0 005 5L15 12l5 2v3a2 2 0 01-2 2A16 16 0 014 6a2 2 0 012-2z" fill="currentColor"/></svg>
            ${escapeHtml(job.phone)}
          </a>` : ''}
        </div>
        <a class="nav-btn" href="${navUrl(job)}" target="_blank" rel="noopener">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M3 11l17-8-8 17-2-7-7-2z" fill="currentColor"/></svg>
          Navigate
        </a>
        ${job.notes ? `<div class="notes">⚠ ${escapeHtml(job.notes)}</div>` : ''}
      </div>
      <div class="price-block">
        <div class="price-edit"><span class="pfx">£</span><input type="number" class="price-input" inputmode="decimal" min="0" step="0.01" value="${parseFloat(priceVal).toFixed(2)}"></div>
        <button type="button" class="front" title="Tap to charge the front price instead">Front ${money(job.frontPrice)}</button>
      </div>
    </div>
    <div class="job-controls">
      <button class="status-btn ${p.status==='done'?'active-done':''}" data-action="done"><span class="ic">✓</span>Done</button>
      <button class="status-btn ${p.status==='skipped'?'active-skipped':''}" data-action="skipped"><span class="ic">↷</span>Skipped</button>
      <button class="status-btn ${p.status==='cancelled'?'active-cancelled':''}" data-action="cancelled"><span class="ic">✕</span>Cancelled</button>
    </div>
    <div class="pay-row">
      <div class="pay-field">
        <label>Cash taken</label>
        <div class="pay-input-wrap"><span class="pfx">£</span><input type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" value="${p.payment || ''}" class="pay-input"></div>
      </div>
      <div class="pay-field">
        <label>Balance</label>
        <div class="balance-value"></div>
      </div>
    </div>
    <div class="note-field">
      <label>Job note</label>
      <textarea rows="2">${escapeHtml(p.note || '')}</textarea>
    </div>
  `;

  const priceInput = card.querySelector('.price-input');
  const payInput = card.querySelector('.pay-input');

  function currentPrice(){ return parseFloat(priceInput.value) || 0; }

  function updateOwedAfter(){
    const payment = parseFloat(payInput.value) || 0;
    const owedAfter = debt + currentPrice() - payment;
    const el = card.querySelector('.balance-value');
    if(owedAfter > 0.004) el.innerHTML = `<b style="color:var(--red)">Owes ${money(owedAfter)}</b>`;
    else if(owedAfter < -0.004) el.innerHTML = `<b style="color:var(--green)">Credit ${money(-owedAfter)}</b>`;
    else el.innerHTML = `<b style="color:var(--green)">Settled</b>`;
  }
  updateOwedAfter();

  async function persist(mutator){
    const prog2 = await loadProgress(worker,date);
    const current = prog2[job.id] || {status:'todo',payment:'',price:'',note:''};
    mutator(current);
    prog2[job.id] = current;
    await saveProgress(worker,date,prog2);
  }

  card.querySelectorAll('.status-btn').forEach(btn=>{
    btn.onclick = async ()=>{
      const action = btn.dataset.action;
      let newStatus;
      await persist(current=>{
        newStatus = current.status === action ? 'todo' : action;
        current.status = newStatus;
      });
      if(action==='done' && newStatus==='done'){
        card.classList.add('status-done');
        const wipe = card.querySelector('.wipe');
        wipe.classList.add('play');
      }
      render();
    };
  });

  function updateFrontButton(){
    const btn = card.querySelector('.front');
    const atFront = Math.abs(currentPrice() - job.frontPrice) < 0.005;
    btn.textContent = atFront ? 'Revert' : `Front ${money(job.frontPrice)}`;
    btn.title = atFront ? 'Tap to go back to the full price' : 'Tap to charge the front price instead';
  }
  updateFrontButton();

  priceInput.addEventListener('input', ()=>{
    updateOwedAfter();
    updateFrontButton();
    persist(current=>{ current.price = priceInput.value; });
  });
  priceInput.addEventListener('blur', ()=>{
    if(priceInput.value !== ''){
      priceInput.value = currentPrice().toFixed(2);
      updateOwedAfter();
      updateFrontButton();
      persist(current=>{ current.price = priceInput.value; });
    }
  });

  card.querySelector('.front').onclick = ()=>{
    const atFront = Math.abs(currentPrice() - job.frontPrice) < 0.005;
    priceInput.value = (atFront ? job.price : job.frontPrice).toFixed(2);
    updateOwedAfter();
    updateFrontButton();
    persist(current=>{ current.price = priceInput.value; });
  };

  payInput.addEventListener('input', ()=>{
    updateOwedAfter();
    persist(current=>{ current.payment = payInput.value; });
  });

  card.querySelector('.note-field textarea').addEventListener('input', (e)=>{
    persist(current=>{ current.note = e.target.value; });
  });

  return card;
}

async function renderDaySummary(){
  const {worker,date} = state;
  const [jobsRaw, prog] = await Promise.all([loadJobs(worker,date), loadProgress(worker,date)]);
  const jobs = jobsRaw || [];
  app.innerHTML = '';

  const header = document.createElement('div');
  header.className = 'topbar';
  header.innerHTML = `<div class="topbar-row">
      <div class="brand"><div class="brand-mark">${worker[0]}</div>
      <div class="brand-text"><div class="t1">Summary · ${date}</div><div class="t2">${worker}</div></div></div>

  app.appendChild(header);
  header.querySelector('#backBtn').onclick = ()=> go('worker',{worker,date});

  const main = document.createElement('div');
  main.className = 'main';
  app.appendChild(main);

  let collected=0, doneN=0, skippedN=0, cancelledN=0, outstanding=0;
  const rows = jobs.slice().sort((a,b)=>a.order-b.order).map(j=>{
    const p = prog[j.id] || {status:'todo',payment:0};
    const payment = parseFloat(p.payment)||0;
    const price = resolvedPrice(j,p);
    collected += payment;
    if(p.status==='done') doneN++;
    if(p.status==='skipped') skippedN++;
    if(p.status==='cancelled') cancelledN++;
    const debt = -j.balance;
    const owedAfter = debt + price - payment;
    if(p.status !== 'cancelled') outstanding += owedAfter;
    return {job:j,status:p.status,payment,price,note:p.note||'',owedAfter};
  });

  const card = document.createElement('div');
  card.className = 'card pad';
  card.innerHTML = `
    <div class="section-title">Today's totals</div>
    <table class="report">
      <tr><td>Jobs done</td><td class="num">${doneN} / ${jobs.length}</td></tr>
      <tr><td>Skipped</td><td class="num">${skippedN}</td></tr>
      <tr><td>Cancelled</td><td class="num">${cancelledN}</td></tr>
      <tr><td>Cash collected</td><td class="num">${money(collected)}</td></tr>
      <tr><td>Still outstanding</td><td class="num">${money(outstanding)}</td></tr>
    </table>
  `;
  main.appendChild(card);

  const card2 = document.createElement('div');
  card2.className = 'card pad';
  card2.style.marginTop = '14px';
  let tableRows = rows.map(r=>`
    <tr>
      <td>${escapeHtml(r.job.customer)}${r.note ? `<div class="muted" style="font-size:11px;margin-top:2px;">${escapeHtml(r.note)}</div>` : ''}</td>
      <td><span class="badge badge-${r.status}">${r.status}</span></td>
      <td class="num">${money(r.payment)}</td>
    </tr>`).join('');
  card2.innerHTML = `
    <div class="section-title">Job by job</div>
    <table class="report">
      <tr><th>Customer</th><th>Status</th><th>Paid</th></tr>
      ${tableRows}
    </table>
  `;
  main.appendChild(card2);

  const btnRow = document.createElement('div');
  btnRow.className = 'stack';
  btnRow.style.marginTop = '16px';
  btnRow.innerHTML = `
    <button class="btn btn-amber btn-block" id="copyBtn">Copy report to send to office</button>
    <button class="btn btn-ghost btn-block" id="csvBtn">Download CSV</button>
  `;
  main.appendChild(btnRow);

  btnRow.querySelector('#copyBtn').onclick = ()=>{
    const text = buildReportText(worker,date,rows,{collected,outstanding,doneN,skippedN,cancelledN,total:jobs.length});
    navigator.clipboard.writeText(text).then(()=>toast('Report copied — paste into WhatsApp/text')).catch(()=>{
      const ta = document.createElement('textarea'); ta.value=text; document.body.appendChild(ta);
      ta.select(); document.execCommand('copy'); ta.remove();
      toast('Report copied — paste into WhatsApp/text');
    });
  };
  btnRow.querySelector('#csvBtn').onclick = ()=> downloadReportCSV(worker,date,rows);
}

function buildReportText(worker,date,rows,totals){
  let lines = [];
  lines.push(`${worker} — ${date}`);
  lines.push(`Done ${totals.doneN}/${totals.total} · Skipped ${totals.skippedN} · Cancelled ${totals.cancelledN}`);
  lines.push(`Collected: ${money(totals.collected)}   Outstanding: ${money(totals.outstanding)}`);
  lines.push('');
  rows.forEach(r=>{
    lines.push(`${r.job.customer} — ${r.status}, charged ${money(r.price)}${r.payment?`, paid ${money(r.payment)}`:''}${r.owedAfter>0.004?`, owes ${money(r.owedAfter)}`:''}${r.note?` — note: ${r.note}`:''}`);
  });
  return lines.join('\n');
}

function downloadReportCSV(worker,date,rows){
  let csv = 'Customer,Address,Round,ListPrice,PriceCharged,Status,CashTaken,OwedAfter,Note\n';
  rows.forEach(r=>{
    csv += [r.job.customer,r.job.address,r.job.round,r.job.price.toFixed(2),r.price.toFixed(2),r.status,r.payment.toFixed(2),r.owedAfter.toFixed(2),r.note||'']
      .map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',') + '\n';
  });
  const blob = new Blob([csv],{type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${worker}_${date}_report.csv`;
  a.click();
}

function downloadReportCSVMulti(date,rows){
  let csv = 'Worker,Customer,Address,Round,ListPrice,PriceCharged,Status,CashTaken,OwedAfter,Note\n';

  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `all-workers_${date}_report.csv`;
  a.click();
}

    const reader = new FileReader();
    reader.onload = async (e)=>{
      try{
        const rows = parseCSV(e.target.result);
        const jobs = rowsToJobs(rows);
        if(!jobs.length){ toast('No rows found in that file'); return; }
        const missing = await resolveCoordinates(jobs);
        await saveJobs(worker,date,jobs);
        let msg = `Loaded <b>${jobs.length}</b> jobs for <b>${worker}</b> on <b>${date}</b>.`;
        if(missing.length){
          msg += `<br><br>⚠ ${missing.length} address${missing.length===1?'':'es'} couldn't be matched to coordinates:<br>` +
            missing.map(m=>'• '+escapeHtml(m)).join('<br>') +
            `<br>Upload a fresh coordinate reference file below to fix ${missing.length===1?'it':'these'}.`;
        } else {
          msg += ` All addresses matched to coordinates.`;
        }
        card.querySelector('#uStatus').innerHTML = `<div class="note-box" style="margin-top:6px;">${msg}</div>`;
        toast(missing.length ? `Loaded ${jobs.length} jobs, ${missing.length} missing coordinates` : `Loaded ${jobs.length} jobs for ${worker}`);
      }catch(err){
        console.error(err);
        toast('Could not read that CSV');
      }
    };
    reader.readAsText(file);
  };

  const existing = document.createElement('div');
  existing.className = 'card pad';
  existing.style.marginTop = '14px';
  existing.innerHTML = `<div class="section-title">Currently loaded rounds</div>`;
  const listEl = document.createElement('div');
  listEl.className = 'stack';
  const rows = await Promise.all(WORKERS.map(async w=>{
    const d = await findAnyDateForWorker(w);
    const jobs = d ? await loadJobs(w,d) : null;
    return { w, d, jobs };
  }));
  rows.forEach(({w,d,jobs})=>{
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;justify-content:space-between;font-size:13.5px;padding:8px 0;border-bottom:1px solid var(--line);';
    row.innerHTML = `<span><b>${w}</b></span><span class="muted">${jobs ? `${jobs.length} jobs · ${d}` : 'nothing loaded'}</span>`;
    listEl.appendChild(row);
  });
  existing.appendChild(listEl);
  main.appendChild(existing);

  const coordCard = document.createElement('div');
  coordCard.className = 'card pad';
  coordCard.style.marginTop = '14px';
  const lookup = await loadCoordLookup();
  const addrCount = Object.keys(lookup.addresses).length;
  coordCard.innerHTML = `
    <div class="section-title">Coordinate reference</div>
    <p class="muted" style="font-size:12.5px;margin-top:-4px;line-height:1.5;">Upload your "active / next due" export occasionally to keep GPS coordinates on file. Daily round CSVs don't carry coordinates themselves — addresses are matched against this list automatically whenever you load a round above.</p>
    <div class="note-box" style="margin:10px 0;">${addrCount ? `${addrCount} addresses on file${lookup.updatedAt ? ` · updated ${lookup.updatedAt}` : ''}` : 'No coordinate reference uploaded yet'}</div>
    <div class="field"><label>Active / next-due CSV</label><input type="file" id="cFile" accept=".csv"></div>
    <button class="btn btn-ghost btn-block" id="cGo" style="margin-top:10px;">Update coordinates</button>
    <div id="cStatus"></div>
  `;
  main.appendChild(coordCard);

  coordCard.querySelector('#cGo').onclick = ()=>{
    const file = coordCard.querySelector('#cFile').files[0];
    if(!file){ toast('Choose a CSV file first'); return; }
    const reader = new FileReader();
    reader.onload = async (e)=>{
      try{
        const rows = parseCSV(e.target.result);
        const addresses = buildCoordAddresses(rows);
        const count = Object.keys(addresses).length;
        if(!count){ toast('No coordinates found in that file'); return; }
        await saveCoordLookup({ updatedAt: new Date().toLocaleDateString('en-GB'), addresses });
        const { fixed, stillMissing } = await rescanAllRoundsForCoords();
        coordCard.querySelector('#cStatus').innerHTML = `<div class="note-box" style="margin-top:8px;">Saved ${count} addresses.${fixed ? ` Filled in coordinates for ${fixed} already-loaded job${fixed===1?'':'s'}.` : ''}${stillMissing ? ` ${stillMissing} job${stillMissing===1?'':'s'} still missing — check the address spelling matches.` : ''}</div>`;
        toast('Coordinate reference updated');
      }catch(err){ console.error(err); toast('Could not read that CSV'); }
    };
    reader.readAsText(file);
  };
}

function renderAdminReport(main){
  const card = document.createElement('div');
  card.className = 'card pad';
  const options = `<option value="ALL">All workers</option>` + WORKERS.map(w=>`<option value="${w}">${w}</option>`).join('');
  card.innerHTML = `
    <div class="section-title">View a report</div>
    <div class="stack">
      <div class="field"><label>Worker</label><select id="rWorker">${options}</select></div>
      <div class="field"><label>Date</label><input type="date" id="rDate" value="${todayStr()}"></div>
      <button class="btn btn-primary btn-block" id="rGo">Show report</button>
    </div>
    <div id="rOut" style="margin-top:16px;"></div>
  `;
  main.appendChild(card);

  async function showReport(){
    const worker = card.querySelector('#rWorker').value;
    const date = card.querySelector('#rDate').value;
    const out = card.querySelector('#rOut');

    if(worker === 'ALL'){
      const results = await Promise.all(WORKERS.map(async w=>{
        const jobs = await loadJobs(w,date);
        const prog = jobs ? await loadProgress(w,date) : {};
        return { w, jobs: jobs || [], prog };
      }));
      let collected=0, outstanding=0, doneN=0, skippedN=0, cancelledN=0, totalJobs=0;
      const allRows = [];
      results.forEach(({w, jobs, prog})=>{
        totalJobs += jobs.length;
        jobs.slice().sort((a,b)=>a.order-b.order).forEach(j=>{
          const p = prog[j.id] || {status:'todo',payment:0};
          const payment = parseFloat(p.payment)||0;
          const price = resolvedPrice(j,p);
          collected += payment;
          if(p.status==='done') doneN++;
          if(p.status==='skipped') skippedN++;
          if(p.status==='cancelled') cancelledN++;
          const debt = -j.balance;
          const owedAfter = debt + price - payment;
          if(p.status !== 'cancelled') outstanding += owedAfter;
          allRows.push({worker:w,job:j,status:p.status,payment,price,note:p.note||'',owedAfter});
        });
      });
      if(!totalJobs){ out.innerHTML = `<p class="muted">No rounds loaded for ${date} yet.</p>`; return; }
      const completeRows = allRows.filter(r=>r.status==='done');
      out.innerHTML = `
        <table class="report">
          <tr><td>Jobs done</td><td class="num">${doneN} / ${totalJobs}</td></tr>
          <tr><td>Skipped</td><td class="num">${skippedN}</td></tr>
          <tr><td>Cancelled</td><td class="num">${cancelledN}</td></tr>
          <tr><td>Cash collected</td><td class="num">${money(collected)}</td></tr>
          <tr><td>Still outstanding</td><td class="num">${money(outstanding)}</td></tr>
        </table>
        <div class="section-title" style="margin-top:16px;">All complete jobs</div>
        <table class="report">
          <tr><th>Worker</th><th>Customer</th><th>Status</th><th>Paid</th></tr>
          ${completeRows.length ? completeRows.map(r=>`<tr><td>${escapeHtml(r.worker)}</td><td>${escapeHtml(r.job.customer)}${r.note ? `<div class="muted" style="font-size:11px;margin-top:2px;">${escapeHtml(r.note)}</div>` : ''}</td><td><span class="badge badge-${r.status}">${r.status}</span></td><td class="num">${money(r.payment)}</td></tr>`).join('') : `<tr><td colspan="4" class="muted">No completed jobs yet.</td></tr>`}
        </table>
        <button class="btn btn-ghost btn-block" id="rCsv" style="margin-top:10px;">Download CSV</button>
      `;
      out.querySelector('#rCsv').onclick = ()=> downloadReportCSVMulti(date, allRows);
      return;
    }

    const jobs = await loadJobs(worker,date);
    if(!jobs){ out.innerHTML = `<p class="muted">No round loaded for ${worker} on ${date}.</p>`; return; }
    const prog = await loadProgress(worker,date);
    let collected=0, outstanding=0, doneN=0, skippedN=0, cancelledN=0;
    const rows = jobs.slice().sort((a,b)=>a.order-b.order).map(j=>{
      const p = prog[j.id] || {status:'todo',payment:0};
      const payment = parseFloat(p.payment)||0;
      const price = resolvedPrice(j,p);
      collected += payment;
      if(p.status==='done') doneN++;
      if(p.status==='skipped') skippedN++;
      if(p.status==='cancelled') cancelledN++;
      const debt = -j.balance;
      const owedAfter = debt + price - payment;
      if(p.status !== 'cancelled') outstanding += owedAfter;
      return {job:j,status:p.status,payment,price,note:p.note||'',owedAfter};
    });
    out.innerHTML = `
      <table class="report">
        <tr><td>Jobs done</td><td class="num">${doneN} / ${jobs.length}</td></tr>
        <tr><td>Skipped</td><td class="num">${skippedN}</td></tr>
        <tr><td>Cancelled</td><td class="num">${cancelledN}</td></tr>
        <tr><td>Cash collected</td><td class="num">${money(collected)}</td></tr>
        <tr><td>Still outstanding</td><td class="num">${money(outstanding)}</td></tr>
      </table>
      <table class="report" style="margin-top:14px;">
        <tr><th>Customer</th><th>Status</th><th>Paid</th></tr>
        ${rows.map(r=>`<tr><td>${escapeHtml(r.job.customer)}${r.note ? `<div class="muted" style="font-size:11px;margin-top:2px;">${escapeHtml(r.note)}</div>` : ''}</td><td><span class="badge badge-${r.status}">${r.status}</span></td><td class="num">${money(r.payment)}</td></tr>`).join('')}
      </table>
      <button class="btn btn-ghost btn-block" id="rCsv" style="margin-top:10px;">Download CSV</button>
    `;
    out.querySelector('#rCsv').onclick = ()=> downloadReportCSV(worker,date,rows);
  }
  card.querySelector('#rGo').onclick = showReport;
}

function renderAdminSettings(main){
  const card = document.createElement('div');
  card.className = 'card pad';
  card.innerHTML = `
    <div class="section-title">Change office password</div>
    <p class="muted" style="font-size:12.5px;margin-top:-4px;">This is shared — changing it updates the password required on every phone, not just this one.</p>
    <div class="stack" style="margin-top:10px;">
      <div class="field"><label>New password</label><input type="password" id="newPw2"></div>
      <button class="btn btn-primary btn-block" id="changePwBtn">Update password</button>
    </div>
  `;
  main.appendChild(card);
  card.querySelector('#changePwBtn').onclick = async ()=>{
    const v = card.querySelector('#newPw2').value;
    if(!v){ toast('Enter a password'); return; }
    await setPassword(v);
    toast('Password updated');
  };

  const wipe = document.createElement('div');
  wipe.className = 'card pad';
  wipe.style.marginTop = '14px';
  wipe.innerHTML = `
    <div class="section-title">Storage</div>
    <p class="muted" style="font-size:13px;margin-top:-4px;line-height:1.5;">Round data, cash taken, and job statuses are stored in a shared Firebase database, so any phone with this app open can see the same information. The office password is just a screen in this app, not real access control — anyone with the Firebase project details could still reach the data directly, so don't put anything highly sensitive in here.</p>
  `;
  main.appendChild(wipe);
}

/* ================= INIT ================= */
render();
</script>
