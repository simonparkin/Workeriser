/* ================= WORKER JOB LIST ================= */
async function renderWorker(){
  const worker = state.worker;
  const date = state.date || todayStr();
  state.date = date;
  const [jobs, prog, superUsers] = await Promise.all([loadJobs(worker,date), loadProgress(worker,date), loadSuperUsers()]);
  const isSuper = superUsers.includes(worker);
  app.innerHTML = '';

  const header = document.createElement('div');
  header.className = 'topbar';
  header.innerHTML = `
    <div class="topbar-row">
      <div class="brand">
        <div class="brand-mark">${worker[0]}</div>
        <div class="brand-text"><div class="t1">Job list · ${date}</div><div class="t2">${worker}</div></div>
      </div>
      <button class="topbar-btn" id="switchBtn">Switch</button>
      <button class="topbar-btn" id="newCustBtn" style="margin-left:8px;">New</button>
      ${isSuper ? `<button class="topbar-btn" id="selectBtn" style="margin-left:8px;">Select</button>` : ''}
    </div>
    ${jobs && jobs.length ? `<div class="topbar-sub"><span id="topDoneStat"></span><span>Collected <b id="topCollectedStat"></b></span></div>` : ''}
  `;
  app.appendChild(header);
  header.querySelector('#switchBtn').onclick = ()=> go('login');
  header.querySelector('#newCustBtn').onclick = ()=> go('newCustomer', {worker, date, fromScreen:'worker'});

  const moveBarContainer = document.createElement('div');
  header.appendChild(moveBarContainer);

  const main = document.createElement('div');
  main.className = 'main';
  app.appendChild(main);

  if(!jobs || !jobs.length){
    main.innerHTML = `<div class="empty-state">No job list has been loaded for ${worker} yet.<br>Ask the office to upload today's job list.</div>`;
    return;
  }

  const bar = document.createElement('div');

  function refreshStats(){
    const doneCount = jobs.reduce((s,j)=> s + (prog[j.id] && prog[j.id].status==='done' ? jobWeight(j) : 0), 0);
    const totalWeighted = jobs.reduce((s,j)=> s + jobWeight(j), 0);
    const collected = jobs.reduce((s,j)=> s + (prog[j.id]?.payment ? parseFloat(prog[j.id].payment)||0 : 0), 0);
    const remaining = totalWeighted - jobs.reduce((s,j)=> s + (prog[j.id] && prog[j.id].status!=='todo' ? jobWeight(j) : 0), 0);
    const doneStat = header.querySelector('#topDoneStat');
    if(doneStat) doneStat.textContent = `${formatJobCount(doneCount)}/${formatJobCount(totalWeighted)} done`;
    const collectedStat = header.querySelector('#topCollectedStat');
    if(collectedStat) collectedStat.textContent = money(collected);
    const leftEl = bar.querySelector('#leftStatN');
    if(leftEl) leftEl.textContent = remaining;
    const collEl = bar.querySelector('#collectedStatN');
    if(collEl) collEl.textContent = money(collected);
  }

  async function checkDanglingCancelled(justChangedJobId){
    const freshProg = await loadProgress(worker, date);
    const dangling = jobs.find(j => j.id !== justChangedJobId && freshProg[j.id] && freshProg[j.id].cancelled && freshProg[j.id].status === 'todo');
    if(dangling) showDanglingCancelledDialog(dangling);
  }

  function showDanglingCancelledDialog(job){
    if(document.getElementById('danglingCancelledDialog')) return; // don't stack multiple
    const overlay = document.createElement('div');
    overlay.id = 'danglingCancelledDialog';
    overlay.className = 'dialog-overlay';
    overlay.innerHTML = `
      <div class="card pad dialog-box">
        <div class="section-title" style="color:var(--red);">Cancelled job needs finishing</div>
        <p style="font-size:13.5px;line-height:1.5;margin:8px 0 14px;"><b>${escapeHtml(job.address)}</b> was marked Cancelled but never marked Done or Skipped for today. Which was it?</p>
        <div class="stack">
          <button class="btn btn-primary btn-block" id="dlgDone">Mark Done</button>
          <button class="btn btn-ghost btn-block" id="dlgSkipped">Mark Skipped</button>
          <button class="btn btn-ghost btn-block" id="dlgDismiss" style="color:var(--ink-soft);">Leave for now</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);
    const close = ()=> overlay.remove();
    overlay.querySelector('#dlgDone').onclick = async ()=>{
      await setJobStatusFlag(job.id, 'done');
      close();
      render();
    };
    overlay.querySelector('#dlgSkipped').onclick = async ()=>{
      await setJobStatusFlag(job.id, 'skipped');
      close();
      render();
    };
    overlay.querySelector('#dlgDismiss').onclick = close;
  }

  async function setJobStatusFlag(jobId, status){
    const freshProg = await loadProgress(worker, date);
    const current = freshProg[jobId] || {status:'todo',payment:'',price:'',note:'',frontApplied:false,cancelled:false};
    current.status = status;
    freshProg[jobId] = current;
    await saveProgress(worker, date, freshProg);
  }

  const sorted = jobs.slice().sort((a,b)=>a.order-b.order);
  const todoJobs = sorted.filter(j=> !prog[j.id] || prog[j.id].status==='todo');
  const completedJobs = sorted.filter(j=> prog[j.id] && prog[j.id].status!=='todo');
  const customFrontPrices = await loadCustomFrontPrices();

  // split jobs (worked on by two people at once) need data from the OTHER worker's
  // phone — fetched once up front here, since the two cards live on separate screens
  // and can't read each other's DOM the way same-page linked jobs do
  const linkedDataMap = new Map();
  await Promise.all(sorted.map(async j=>{
    if(j.isSubJob && j.mainJobWorker && j.mainJobId){
      const [mJobs, mProg] = await Promise.all([loadJobs(j.mainJobWorker, date), loadProgress(j.mainJobWorker, date)]);
      const mainJob = (mJobs||[]).find(mj=>mj.id===j.mainJobId);
      if(mainJob) linkedDataMap.set(j.id, { kind:'sub', mainJob, mainProg: mProg||{} });
    } else if(j.subJobWorker && j.subJobId){
      const subProg = await loadProgress(j.subJobWorker, date);
      const subP = (subProg||{})[j.subJobId] || {};
      linkedDataMap.set(j.id, { kind:'main', subPayment: parseFloat(subP.payment)||0 });
    }
  }));

  const balanceLinkHandlers = new Map(); // job.id -> recompute function, wired up after all cards exist

  function renderGroup(list, onCard){
    let lastRound = null;
    list.forEach(job=>{
      if(job.round && job.round !== lastRound){
        const rl = document.createElement('div');
        rl.className = 'round-label';
        rl.textContent = job.round;
        main.appendChild(rl);
        lastRound = job.round;
      }
      const linked = linkedDataMap.get(job.id);
      let card;
      if(linked && linked.kind === 'sub'){
        card = renderSubJobCard(worker,date,job,prog,linked.mainJob,linked.mainProg,refreshStats);
      } else {
        card = renderJobCard(worker,date,job,prog,refreshStats,isSuper,null,checkDanglingCancelled,()=>{
          const fn = balanceLinkHandlers.get(job.id);
          if(fn) fn();
        },customFrontPrices,linked && linked.kind === 'main' ? linked.subPayment : 0);
      }
      main.appendChild(card);
      if(onCard) onCard(job, card);
    });
  }

  const allCardMap = new Map();
  const todoCardMap = new Map();
  renderGroup(todoJobs, (job,card)=>{ allCardMap.set(job.id, card); todoCardMap.set(job.id, card); });

  if(completedJobs.length){
    const divider = document.createElement('div');
    divider.className = 'completed-divider';
    divider.innerHTML = `<span>Completed</span>`;
    main.appendChild(divider);
    renderGroup(completedJobs, (job,card)=>{ allCardMap.set(job.id, card); });
  }

  // Some properties get split into two separate jobs on the same day (e.g. outside
  // windows vs inside windows, only done if someone's in) — both share one real
  // account balance, so their "today's balance" needs to reflect both jobs combined,
  // live, on both cards, rather than each card presuming it's the only thing happening.
  const addressGroups = new Map();
  sorted.forEach(job=>{
    if(job.isSubJob || job.subJobWorker) return; // split jobs share a balance via their own dedicated logic, not this grouping
    if(!addressGroups.has(job.address)) addressGroups.set(job.address, []);
    addressGroups.get(job.address).push(job);
  });
  addressGroups.forEach(groupJobs=>{
    if(groupJobs.length < 2) return;
    const groupCards = groupJobs.map(j=>allCardMap.get(j.id)).filter(Boolean);
    if(groupCards.length < 2) return;
    function recomputeLinkedBalance(){
      const debt = -groupJobs[0].balance;
      let chargeSum = 0, paymentSum = 0, allSkipped = true;
      groupCards.forEach(c=>{
        const isSkipped = c.querySelector('[data-action="skipped"]').classList.contains('active-skipped');
        if(!isSkipped) allSkipped = false;
        const price = parseFloat(c.querySelector('.price-input').value) || 0;
        const payment = parseFloat(c.querySelector('.pay-input').value) || 0;
        if(!isSkipped) chargeSum += price; // presumes each job happens unless explicitly skipped, same rule as a single card
        paymentSum += payment;
      });
      const owedAfter = debt + chargeSum - paymentSum;
      groupCards.forEach(c=>{
        const labelEl = c.querySelector('.balance-label');
        const valueEl = c.querySelector('.balance-value');
        if(labelEl) labelEl.textContent = allSkipped ? 'Current balance' : "Today's balance";
        valueEl.dataset.owed = String(owedAfter);
        if(owedAfter > 0.004) valueEl.innerHTML = `<b style="color:var(--red)">${money(owedAfter)}</b>`;
        else if(owedAfter < -0.004) valueEl.innerHTML = `<b style="color:var(--green)">${money(-owedAfter)} credit</b>`;
        else valueEl.innerHTML = `<b style="color:var(--green)">£0.00</b>`;
      });
    }
    groupJobs.forEach(j=> balanceLinkHandlers.set(j.id, recomputeLinkedBalance));
    recomputeLinkedBalance();
  });

  // footer summary / finish
  bar.className = 'summary-bar';
  const totalWeighted = jobs.reduce((s,j)=> s + jobWeight(j), 0);
  const collected = jobs.reduce((s,j)=> s + (prog[j.id]?.payment ? parseFloat(prog[j.id].payment)||0 : 0), 0);
  const remaining = totalWeighted - jobs.reduce((s,j)=> s + (prog[j.id] && prog[j.id].status!=='todo' ? jobWeight(j) : 0), 0);
  bar.innerHTML = `
    <div class="sum-pill"><div class="n" id="leftStatN">${formatJobCount(remaining)}</div><div class="l">Left</div></div>
    <div class="sum-pill"><div class="n" id="collectedStatN">${money(collected)}</div><div class="l">Collected</div></div>
    <button class="finish-btn" id="finishBtn">Day summary</button>
  `;
  app.appendChild(bar);
  bar.querySelector('#finishBtn').onclick = ()=> go('daySummary',{worker,date});

  const selectBtn = header.querySelector('#selectBtn');
  if(selectBtn){
    let selectMode = false;
    const selectedIds = new Set();
    const frontIds = new Set(); // "F" — send the front, keep a back card behind
    const backIds = new Set();  // "B" — keep the front, send a back card away

    function renderMoveBar(){
      const existing = moveBarContainer.querySelector('.move-bar.select-bar');
      if(existing) existing.remove();
      const allIds = new Set([...selectedIds, ...frontIds, ...backIds]);
      if(!selectMode || allIds.size===0) return;
      const others = WORKERS.filter(w=>w!==worker);
      const mb = document.createElement('div');
      mb.className = 'move-bar select-bar';
      const splitCount = frontIds.size + backIds.size;
      mb.innerHTML = `
        <div class="move-bar-label">${allIds.size} selected${splitCount ? ` (${splitCount} split)` : ''} — send to</div>
        <div class="move-bar-targets">
          ${others.map(w=>`<button type="button" class="move-target-btn" data-target="${escapeHtml(w)}">${escapeHtml(w)}</button>`).join('')}
        </div>
      `;
      moveBarContainer.appendChild(mb);
      mb.querySelectorAll('.move-target-btn').forEach(btn=>{
        btn.onclick = async ()=>{
          const target = btn.dataset.target;
          const ids = Array.from(allIds);
          const frontIdsArr = ids.filter(id=>frontIds.has(id));
          const backIdsArr = ids.filter(id=>backIds.has(id));
          const normalIds = ids.filter(id=>!frontIds.has(id) && !backIds.has(id));
          btn.disabled = true;
          if(normalIds.length) await moveJobsToWorker(worker, target, date, normalIds);
          if(frontIdsArr.length) await splitAndSendJobs(worker, date, frontIdsArr, target);
          if(backIdsArr.length) await splitAndKeepFront(worker, date, backIdsArr, target);
          const splitTotal = frontIdsArr.length + backIdsArr.length;
          toast(`Sent ${ids.length} job${ids.length===1?'':'s'} to ${target}${splitTotal ? ` (${splitTotal} split)` : ''}`);
          state.lastMove = { from:worker, to:target, date, ids: normalIds, frontSplitIds: frontIdsArr, backSplitIds: backIdsArr };
          render();
        };
      });
    }

    function setSelectMode(on, initialIds){
      selectMode = on;
      selectBtn.textContent = selectMode ? 'Cancel' : 'Select';
      selectedIds.clear();
      frontIds.clear();
      backIds.clear();
      todoCardMap.forEach((card,jobId)=>{
        let cb = card.querySelector('.job-select-checkbox');
        let allLabel = card.querySelector('.job-select-label');
        let frontWrap = card.querySelector('.job-front-wrap');
        let backWrap = card.querySelector('.job-back-wrap');
        const jobObj = todoJobs.find(j=>j.id===jobId);
        const isSub = !!(jobObj && jobObj.isSubJob);
        if(selectMode){
          card.classList.add('selectable');
          if(!cb){
            cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.className = 'job-select-checkbox';
            cb.title = isSub ? 'Select this job' : 'ALL: send this job as a whole';
            cb.addEventListener('change', ()=>{
              if(cb.checked){
                selectedIds.add(jobId);
                frontIds.delete(jobId);
                backIds.delete(jobId);
                const fc = card.querySelector('.job-front-checkbox');
                const bc = card.querySelector('.job-back-checkbox');
                if(fc) fc.checked = false;
                if(bc) bc.checked = false;
              } else {
                selectedIds.delete(jobId);
              }
              renderMoveBar();
            });
            card.appendChild(cb);
          }
          if(isSub){
            // a sub-card is already half a job — it can't be split further
            if(allLabel) allLabel.remove();
            if(frontWrap) frontWrap.remove();
            if(backWrap) backWrap.remove();
          } else {
          if(!allLabel){
            allLabel = document.createElement('div');
            allLabel.className = 'job-select-label';
            allLabel.textContent = 'ALL';
            card.appendChild(allLabel);
          }
          if(!frontWrap){
            frontWrap = document.createElement('div');
            frontWrap.className = 'job-front-wrap';
            frontWrap.innerHTML = `<input type="checkbox" class="job-front-checkbox" title="F: send the front, keep a back card for a second worker"><span>F</span>`;
            card.appendChild(frontWrap);
            frontWrap.querySelector('.job-front-checkbox').addEventListener('change', (e)=>{
              if(e.target.checked){
                frontIds.add(jobId);
                backIds.delete(jobId); // F and B are opposite choices for the same job
                const bc = card.querySelector('.job-back-checkbox');
                if(bc) bc.checked = false;
              } else {
                frontIds.delete(jobId);
              }
              renderMoveBar();
            });
          }
          if(!backWrap){
            backWrap = document.createElement('div');
            backWrap.className = 'job-back-wrap';
            backWrap.innerHTML = `<input type="checkbox" class="job-back-checkbox" title="B: keep the front yourself, send a back card away"><span>B</span>`;
            card.appendChild(backWrap);
            backWrap.querySelector('.job-back-checkbox').addEventListener('change', (e)=>{
              if(e.target.checked){
                backIds.add(jobId);
                frontIds.delete(jobId); // F and B are opposite choices for the same job
                const fc = card.querySelector('.job-front-checkbox');
                if(fc) fc.checked = false;
              } else {
                backIds.delete(jobId);
              }
              renderMoveBar();
            });
          }
          } // end of non-sub-card branch
          const shouldCheck = !!(initialIds && initialIds.includes(jobId));
          cb.checked = shouldCheck;
          if(shouldCheck) selectedIds.add(jobId);
        } else {
          card.classList.remove('selectable');
          if(cb) cb.remove();
          if(allLabel) allLabel.remove();
          if(frontWrap) frontWrap.remove();
          if(backWrap) backWrap.remove();
        }
      });
      renderMoveBar();
    }

    selectBtn.onclick = ()=> setSelectMode(!selectMode);

    // show an Undo banner for the most recent move Simon made from this list
    if(state.lastMove && state.lastMove.from===worker && state.lastMove.date===date){
      const { to, ids, frontSplitIds, backSplitIds } = state.lastMove;
      const plainIds = ids || [];
      const frontIdsArr = frontSplitIds || [];
      const backIdsArr = backSplitIds || [];
      const totalCount = plainIds.length + frontIdsArr.length + backIdsArr.length;
      if(totalCount > 0){
        const banner = document.createElement('div');
        banner.className = 'move-bar undo-bar';
        banner.innerHTML = `
          <div class="move-bar-label">Moved ${totalCount} job${totalCount===1?'':'s'} to ${escapeHtml(to)}</div>
          <div class="move-bar-targets">
            <button type="button" class="move-target-btn" id="undoMoveBtn">Undo</button>
            <button type="button" class="move-target-btn move-dismiss-btn" id="dismissMoveBtn">Dismiss</button>
          </div>
        `;
        moveBarContainer.appendChild(banner);
        banner.querySelector('#undoMoveBtn').onclick = async ()=>{
          banner.remove();
          if(plainIds.length) await moveJobsToWorker(to, worker, date, plainIds);
          await Promise.all([
            ...frontIdsArr.map(id=> undoSplit(worker, date, id, to, true)),
            ...backIdsArr.map(id=> undoSplit(worker, date, id, to, false))
          ]);
          toast(`Brought back ${totalCount} job${totalCount===1?'':'s'}`);
          state.pendingSelection = [...plainIds, ...frontIdsArr, ...backIdsArr];
          delete state.lastMove;
          render();
        };
        banner.querySelector('#dismissMoveBtn').onclick = ()=>{
          delete state.lastMove;
          banner.remove();
        };
      }
    }

    // if we just undid a move, re-enter select mode with those jobs pre-checked
    if(state.pendingSelection){
      const ids = state.pendingSelection;
      delete state.pendingSelection;
      setSelectMode(true, ids);
    }
  }

  refreshStats();
  startWorkerPoll(worker, date, jobs);
  armScreenGuard();
}

function renderJobCard(worker,date,job,prog,refreshStats,isSuper,onReassigned,onAnyStatusChange,onBalanceChange,customFrontPrices,linkedPayment){
  customFrontPrices = customFrontPrices || {};
  linkedPayment = parseFloat(linkedPayment) || 0;
  const p = prog[job.id] || { status:'todo', payment:'', price:'', note:'', frontApplied:false, cancelled:false };
  const card = document.createElement('div');
  const vRound = isVRound(job.round);
  card.className = `card job-card status-${p.status}${vRound ? ' v-round' : ''}${p.cancelled ? ' is-cancelled' : ''}`;

  const debt = -job.balance; // positive = customer owes
  const priceVal = (p.price !== undefined && p.price !== '' && !isNaN(parseFloat(p.price))) ? p.price : job.price;
  const telHref = job.phone ? `tel:${job.phone.replace(/[^0-9+]/g,'')}` : '';

  card.innerHTML = `
    <div class="wipe"></div>
    ${vRound ? `<div class="v-round-banner">Vlado</div>` : ''}
    <div class="job-top">
      <div class="job-info">
        <div class="addr">${job.isNewCustomer ? '<span class="badge badge-new">NEW</span> ' : ''}${escapeHtml(job.address)}</div>
        <div class="cust-row">
          <span class="cust">${escapeHtml(job.customer)}</span>
          ${job.phone ? `<a class="phone-btn" href="${telHref}">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M6 3h3l2 5-2.5 1.5a11 11 0 005 5L15 12l5 2v3a2 2 0 01-2 2A16 16 0 014 6a2 2 0 012-2z" fill="currentColor"/></svg>
            ${escapeHtml(job.phone)}
          </a>` : ''}
        </div>
        ${job.notes ? `<div class="notes">⚠ ${escapeHtml(job.notes)}</div>` : ''}
      </div>
      <div class="price-block">
        <a class="nav-icon-btn" href="${navUrl(job)}" target="_blank" rel="noopener" title="Navigate">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 11l17-8-8 17-2-7-7-2z" fill="#fff"/></svg>
        </a>
        ${job.subJobWorker ? `<button type="button" class="front-split-badge" title="Split with ${escapeHtml(job.subJobWorker)} — tap if you can only do the front">FRONT</button>` : `<button type="button" class="front" title="Tap to charge the front price instead"><span style="font-size:16px;">FO</span></button>`}
        <div class="price-edit"><span class="pfx">£</span><input type="number" class="price-input" inputmode="decimal" min="0" step="0.01" value="${parseFloat(priceVal).toFixed(2)}"></div>
      </div>
    </div>
    <div class="job-controls">
      <div class="done-wrap">
        <button class="status-btn ${p.status==='done'?'active-done':''}" data-action="done"><span class="ic">✓</span>Done</button>
        <div class="debt-knock-cap" style="display:none;">4TH<br>TIME</div>
      </div>
      <button class="status-btn ${p.status==='skipped'?'active-skipped':''}" data-action="skipped"><span class="ic">↷</span>Skipped</button>
      <button class="status-btn ${p.cancelled?'active-cancelled':''}" data-action="cancelled"><span class="ic">✕</span>Cancelled</button>
    </div>
    <div class="pay-row">
      <div class="pay-field">
        <label>Cash paid</label>
        <div class="pay-input-wrap"><span class="pfx">£</span><input type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" value="${p.payment || ''}" class="pay-input"></div>
      </div>
      <div class="pay-field">
        <label class="balance-label">Today's balance</label>
        <div class="balance-value"></div>
      </div>
    </div>
    <div class="note-field">
      <label>Job note</label>
      <textarea rows="2">${escapeHtml(p.note || '')}</textarea>
    </div>
    ${onReassigned ? `
    <div class="field" style="margin-top:10px;">
      <label>Assigned to <span class="muted" style="font-weight:400;font-size:11px;">(tick up to 2 for a front/back split)</span></label>
      <div class="assign-checkbox-grid">
        ${WORKERS.map(w=>`<label class="assign-checkbox-item"><input type="checkbox" class="assign-checkbox" value="${escapeHtml(w)}"><span>${escapeHtml(w)}</span><span class="assign-role-tag"></span></label>`).join('')}
      </div>
      <button type="button" class="assign-apply-btn" style="display:none;">Apply change</button>
    </div>` : ''}
    ${job.isNewCustomer ? `
    <div style="display:flex;gap:8px;margin-top:8px;">
      <button type="button" class="nc-edit-btn" style="flex:1;background:transparent;border:1.5px dashed var(--blue);color:var(--blue);border-radius:9px;padding:7px 4px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;">Edit</button>
      <button type="button" class="nc-delete-btn" style="flex:1;background:transparent;border:1.5px dashed var(--red);color:var(--red);border-radius:9px;padding:7px 4px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;">Delete</button>
    </div>` : ''}
    ${!isSuper && p.status==='todo' ? `<button type="button" class="reject-btn">Reject</button>` : ''}
  `;

  const priceInput = card.querySelector('.price-input');
  const payInput = card.querySelector('.pay-input');
  let currentStatus = p.status;
  let currentCancelled = !!p.cancelled;
  let capDismissed = false;
  let wasOverridden = !!p.debtKnockOverridden;
  let recapTimer = null;
  const capEl = card.querySelector('.debt-knock-cap');
  const doneBtn = card.querySelector('[data-action="done"]');

  function currentPrice(){ return parseFloat(priceInput.value) || 0; }

  function updateOwedAfter(){
    const payment = parseFloat(payInput.value) || 0;
    const notCleaned = currentStatus === 'skipped';
    const chargeToday = notCleaned ? 0 : currentPrice();
    const owedAfter = debt + chargeToday - payment - linkedPayment;
    const el = card.querySelector('.balance-value');
    const labelEl = card.querySelector('.balance-label');
    if(labelEl) labelEl.textContent = notCleaned ? 'Current balance' : "Today's balance";
    el.dataset.owed = String(owedAfter);
    if(owedAfter > 0.004) el.innerHTML = `<b style="color:var(--red)">${money(owedAfter)}</b>`;
    else if(owedAfter < -0.004) el.innerHTML = `<b style="color:var(--green)">${money(-owedAfter)} credit</b>`;
    else el.innerHTML = `<b style="color:var(--green)">£0.00</b>`;

    // when skipped, nothing is being charged today — grey out and strike through
    // the price to show that clearly, without touching the actual value, so the
    // standard rate is still there to read off to the customer if they ask, and
    // nothing is lost if the job later gets switched back to Done

    const priceRef = currentPrice();
    const showDebtKnock = owedAfter > 0.004 && priceRef > 0.004 && owedAfter >= 4 * priceRef;
    // the cap stops showing once the job is actually marked Done — at that point
    // the decision's been made and acted on, so nothing more to guard against
    const relevantNow = showDebtKnock && currentStatus !== 'done';
    if(!showDebtKnock) capDismissed = false; // only reset when the debt itself is no longer 4x+ — not just because Done is currently toggled on
    capEl.style.display = (relevantNow && !capDismissed) ? 'flex' : 'none';
    // the red border is a lasting record that this job WAS overridden — unlike the
    // cap itself, it doesn't go away once marked Done or moved to Completed
    doneBtn.classList.toggle('debt-knock-overridden', wasOverridden);
  }
  updateOwedAfter();

  capEl.addEventListener('click', ()=>{
    capDismissed = true;
    wasOverridden = true;
    persist(current=>{ current.debtKnockOverridden = true; });
    updateOwedAfter();
    if(recapTimer) clearTimeout(recapTimer);
    recapTimer = setTimeout(()=>{
      capDismissed = false;
      updateOwedAfter(); // cap reappears only if the job still isn't marked Done
    }, 2*60*1000);
  });

  async function persist(mutator){
    const current = prog[job.id] ? Object.assign({}, prog[job.id]) : {status:'todo',payment:'',price:'',note:'',frontApplied:false,cancelled:false};
    mutator(current);
    prog[job.id] = current;
    await saveProgress(worker,date,prog);
  }

  card.querySelectorAll('.status-btn').forEach(btn=>{
    btn.onclick = async ()=>{
      const action = btn.dataset.action;
      let newStatus = currentStatus;
      let newCancelled = currentCancelled;
      if(action === 'cancelled'){
        newCancelled = !currentCancelled; // purely independent now — doesn't touch status
      } else {
        newStatus = currentStatus === action ? 'todo' : action; // Done/Skipped stay mutually exclusive
      }
      await persist(current=>{
        current.status = newStatus;
        current.cancelled = newCancelled;
      });
      currentStatus = newStatus;
      currentCancelled = newCancelled;
      card.className = `card job-card status-${newStatus}${vRound ? ' v-round' : ''}${newCancelled ? ' is-cancelled' : ''}`;
      card.querySelectorAll('.status-btn').forEach(b=>b.classList.remove('active-done','active-skipped'));
      card.querySelector('[data-action="done"]').classList.toggle('active-done', newStatus==='done');
      card.querySelector('[data-action="skipped"]').classList.toggle('active-skipped', newStatus==='skipped');
      card.querySelector('[data-action="cancelled"]').classList.toggle('active-cancelled', newCancelled);
      if(action==='done' && newStatus==='done'){
        const wipe = card.querySelector('.wipe');
        wipe.classList.add('play');
      }
      updateOwedAfter();
      if(onBalanceChange) onBalanceChange();
      if(refreshStats) refreshStats();
      scheduleReflow(job.id, worker, date);
      if(onAnyStatusChange) onAnyStatusChange(job.id);
      if(job.subJobWorker && (newStatus === 'skipped' || (newCancelled && newStatus !== 'done'))){
        rejectSubJobForMainStatus(worker, job, date);
        delete job.subJobWorker;
        delete job.subJobId;
      }
    };
  });

  const rejectBtn = card.querySelector('.reject-btn');
  if(rejectBtn){
    rejectBtn.onclick = async ()=>{
      rejectBtn.disabled = true;
      rejectBtn.textContent = 'Sending…';
      let target = job.lastAssignedBy;
      if(!target){
        const superUsers = await loadSuperUsers();
        target = superUsers[0] || 'Simon';
      }
      await moveJobsToWorker(worker, target, date, [job.id]);
      toast(`Sent back to ${target}`);
      render();
    };
  }

  const assignCheckboxes = card.querySelectorAll('.assign-checkbox');
  if(assignCheckboxes.length){
    const applyBtn = card.querySelector('.assign-apply-btn');
    // figure out who's currently assigned, front first then back, from the job's own
    // state — works whether we're looking at the front card or the back card.
    // de-duplicated defensively: if a job's linked worker ever happens to equal its
    // own worker (stale data, a mid-correction state), a duplicate entry here would
    // let a single uncheck remove both copies at once and drop straight to zero.
    // also filtered to real workers only — an orphaned job's "current" location
    // (e.g. the recovery view) isn't a selectable checkbox and shouldn't count as
    // a phantom checked entry, which could otherwise force an unwanted split.
    let checkOrder = [worker];
    if(job.isSubJob && job.mainJobWorker){
      checkOrder = [...new Set([job.mainJobWorker, worker])];
    } else if(job.subJobWorker){
      checkOrder = [...new Set([worker, job.subJobWorker])];
    }
    checkOrder = checkOrder.filter(w => WORKERS.includes(w));

    function refreshCheckboxUI(){
      const checkedCount = checkOrder.length;
      assignCheckboxes.forEach(cb=>{
        const isChecked = checkOrder.includes(cb.value);
        cb.checked = isChecked;
        cb.disabled = !isChecked && checkedCount >= 2;
        const tag = cb.closest('.assign-checkbox-item').querySelector('.assign-role-tag');
        if(isChecked && checkedCount === 2){
          const idx = checkOrder.indexOf(cb.value);
          tag.textContent = idx === 0 ? ' (Front)' : ' (Back)';
        } else {
          tag.textContent = '';
        }
      });
    }
    refreshCheckboxUI();

    assignCheckboxes.forEach(cb=>{
      cb.addEventListener('change', ()=>{
        if(cb.checked){
          if(checkOrder.length < 2 && !checkOrder.includes(cb.value)) checkOrder.push(cb.value);
        } else {
          // check the RESULT of removing this one, not the length beforehand —
          // if checkOrder ever had a duplicate, removing "one" could otherwise
          // remove both copies at once and slip past a before-the-fact check
          const wouldRemain = checkOrder.filter(w=>w!==cb.value);
          if(wouldRemain.length === 0){
            // a job always needs at least one person assigned
            cb.checked = true;
            return;
          }
          checkOrder = wouldRemain;
        }
        refreshCheckboxUI();
        applyBtn.style.display = 'block';
      });
    });

    applyBtn.onclick = async ()=>{
      applyBtn.disabled = true;
      applyBtn.textContent = 'Applying…';
      await applyFrontBackAssignment(worker, job, date, checkOrder.slice());
      toast('Assignment updated');
      onReassigned();
    };
  }

  const ncEditBtn = card.querySelector('.nc-edit-btn');
  if(ncEditBtn){
    ncEditBtn.onclick = ()=> go('newCustomer', {worker, date, fromScreen:'worker', editJobId: job.id});
  }
  const ncDeleteBtn = card.querySelector('.nc-delete-btn');
  if(ncDeleteBtn){
    ncDeleteBtn.onclick = async ()=>{
      if(!confirm(`Delete this new customer entry (${job.address})? This can't be undone.`)) return;
      ncDeleteBtn.disabled = true;
      ncDeleteBtn.textContent = 'Deleting…';
      await deleteNewCustomerJob(worker, date, job.id);
      toast('New customer deleted');
      render();
    };
  }

  let frontApplied = !!p.frontApplied;

  function updateFrontButton(){
    const btn = card.querySelector('.front');
    if(!btn) return;
    btn.innerHTML = frontApplied ? 'ALL' : '<span style="font-size:16px;">FO</span>';
    btn.classList.toggle('front-active', frontApplied);
    btn.title = frontApplied ? 'Tap to charge for all the house windows instead' : 'Tap to charge the front-only price instead';
  }
  updateFrontButton();

  priceInput.addEventListener('input', ()=>{
    updateOwedAfter();
    if(onBalanceChange) onBalanceChange();
    persist(current=>{ current.price = priceInput.value; });
    scheduleReflow(job.id, worker, date);
  });
  priceInput.addEventListener('blur', ()=>{
    if(priceInput.value !== ''){
      priceInput.value = currentPrice().toFixed(2);
      updateOwedAfter();
      if(onBalanceChange) onBalanceChange();
      persist(current=>{ current.price = priceInput.value; });
      if(frontApplied) saveCustomFrontPrice(job.id, currentPrice());
      scheduleReflow(job.id, worker, date);
    }
  });

  const frontBtn = card.querySelector('.front');
  if(frontBtn){
    frontBtn.onclick = ()=>{
      frontApplied = !frontApplied;
      const frontPriceToUse = (customFrontPrices[job.id] !== undefined && customFrontPrices[job.id] !== null) ? customFrontPrices[job.id] : job.frontPrice;
      priceInput.value = (frontApplied ? frontPriceToUse : job.price).toFixed(2);
      updateOwedAfter();
      if(onBalanceChange) onBalanceChange();
      updateFrontButton();
      persist(current=>{ current.price = priceInput.value; current.frontApplied = frontApplied; });
      scheduleReflow(job.id, worker, date);
    };
  }

  const frontSplitBadge = card.querySelector('.front-split-badge');
  if(frontSplitBadge){
    frontSplitBadge.onclick = async ()=>{
      if(!confirm(`This job is split with ${job.subJobWorker} doing the back. Convert to front-only? This removes their "back" card completely — use this if you can only do the front today (e.g. a locked gate).`)) return;
      frontSplitBadge.disabled = true;
      frontSplitBadge.textContent = 'Removing…';
      const subWorkerJobs = await loadJobs(job.subJobWorker, date);
      const subJob = (subWorkerJobs||[]).find(j=>j.id===job.subJobId);
      if(subJob) await rejectSubJobEntirely(job.subJobWorker, subJob, date);
      const frontPriceToUse = (customFrontPrices[job.id] !== undefined && customFrontPrices[job.id] !== null) ? customFrontPrices[job.id] : job.frontPrice;
      await persist(current=>{ current.price = frontPriceToUse.toFixed(2); current.frontApplied = true; });
      toast('Converted to front-only — removed the back card');
      render();
    };
  }

  payInput.addEventListener('focus', ()=>{
    if(payInput.value === ''){
      const owedRaw = parseFloat(card.querySelector('.balance-value').dataset.owed || '0');
      if(owedRaw > 0.004){
        payInput.value = owedRaw.toFixed(2);
        payInput.select();
        updateOwedAfter();
        if(onBalanceChange) onBalanceChange();
        persist(current=>{ current.payment = payInput.value; });
        if(refreshStats) refreshStats();
        scheduleReflow(job.id, worker, date);
      }
    }
  });

  payInput.addEventListener('input', ()=>{
    updateOwedAfter();
    if(onBalanceChange) onBalanceChange();
    persist(current=>{ current.payment = payInput.value; });
    if(refreshStats) refreshStats();
    scheduleReflow(job.id, worker, date);
  });

  card.querySelector('.note-field textarea').addEventListener('input', (e)=>{
    persist(current=>{ current.note = e.target.value; });
    scheduleReflow(job.id, worker, date);
  });

  return card;
}

// the simplified "back" card shown to a second worker on a split job — a job two
// (rarely three) people work on together at once. Just enough to be useful in the
// field: address, contact, notes, a read-only price to quote if asked, cash paid,
// the shared balance, and a single Done button. No Skip/Cancel here — if the main
// card ends up skipped or cancelled, this card gets rejected back automatically,
// since the main card already reports that outcome for the whole job.
function renderSubJobCard(worker,date,job,prog,mainJob,mainProg,refreshStats,onReassigned){
  const p = prog[job.id] || { status:'todo', payment:'', note:'' };
  const card = document.createElement('div');
  card.className = `card job-card sub-job-card status-${p.status}`;

  const debt = -job.balance; // positive = customer owes
  const mainP = mainProg[mainJob.id] || { status:'todo', payment:'', price:'' };
  const mainPriceVal = (mainP.price !== undefined && mainP.price !== '' && !isNaN(parseFloat(mainP.price))) ? parseFloat(mainP.price) : mainJob.price;
  const mainPayment = parseFloat(mainP.payment) || 0;
  const mainNotCleaned = mainP.status === 'skipped';
  const telHref = job.phone ? `tel:${job.phone.replace(/[^0-9+]/g,'')}` : '';

  card.innerHTML = `
    <div class="wipe"></div>
    <div class="job-top">
      <div class="job-info">
        <div class="addr">${escapeHtml(job.address)}</div>
        <div class="cust-row">
          <span class="cust">${escapeHtml(job.customer)}</span>
          ${job.phone ? `<a class="phone-btn" href="${telHref}">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M6 3h3l2 5-2.5 1.5a11 11 0 005 5L15 12l5 2v3a2 2 0 01-2 2A16 16 0 014 6a2 2 0 012-2z" fill="currentColor"/></svg>
            ${escapeHtml(job.phone)}
          </a>` : ''}
        </div>
        ${job.notes ? `<div class="notes">⚠ ${escapeHtml(job.notes)}</div>` : ''}
      </div>
      <div class="price-block">
        <div class="nav-icon-btn" style="font-size:10.5px;font-weight:800;color:#fff;letter-spacing:.03em;">BACK</div>
        <div class="price-edit"><span class="pfx">£</span><input type="number" class="price-input" inputmode="decimal" min="0" step="0.01" value="${mainPriceVal.toFixed(2)}"></div>
      </div>
    </div>
    <div class="job-controls">
      <button class="status-btn ${p.status==='done'?'active-done':''}" data-action="done" style="flex:1;"><span class="ic">✓</span>Done</button>
    </div>
    <div class="pay-row">
      <div class="pay-field">
        <label>Cash paid</label>
        <div class="pay-input-wrap"><span class="pfx">£</span><input type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" value="${p.payment || ''}" class="pay-input"></div>
      </div>
      <div class="pay-field">
        <label class="balance-label">Today's balance</label>
        <div class="balance-value"></div>
      </div>
    </div>
    <div class="note-field">
      <label>Job note</label>
      <textarea rows="2">${escapeHtml(p.note || '')}</textarea>
    </div>
    ${onReassigned ? `
    <div class="field" style="margin-top:10px;">
      <label>Assigned to <span class="muted" style="font-weight:400;font-size:11px;">(tick up to 2 for a front/back split)</span></label>
      <div class="assign-checkbox-grid">
        ${WORKERS.map(w=>`<label class="assign-checkbox-item"><input type="checkbox" class="assign-checkbox" value="${escapeHtml(w)}"><span>${escapeHtml(w)}</span><span class="assign-role-tag"></span></label>`).join('')}
      </div>
      <button type="button" class="assign-apply-btn" style="display:none;">Apply change</button>
    </div>` : ''}
    <button type="button" class="reject-btn">Reject (cancel this split)</button>
  `;

  let currentStatus = p.status;
  const payInput = card.querySelector('.pay-input');
  const priceInput = card.querySelector('.price-input');

  function currentPrice(){ return parseFloat(priceInput.value) || 0; }

  function updateOwedAfter(){
    const payment = parseFloat(payInput.value) || 0;
    const chargeToday = mainNotCleaned ? 0 : currentPrice();
    const owedAfter = debt + chargeToday - payment - mainPayment;
    const el = card.querySelector('.balance-value');
    if(owedAfter > 0.004) el.innerHTML = `<b style="color:var(--red)">${money(owedAfter)}</b>`;
    else if(owedAfter < -0.004) el.innerHTML = `<b style="color:var(--green)">${money(-owedAfter)} credit</b>`;
    else el.innerHTML = `<b style="color:var(--green)">£0.00</b>`;
  }
  updateOwedAfter();

  async function persist(mutator){
    const current = prog[job.id] ? Object.assign({}, prog[job.id]) : { status:'todo', payment:'', note:'' };
    mutator(current);
    prog[job.id] = current;
    await saveProgress(worker, date, prog);
  }

  // the price is shared with the main card — editing it here writes straight into
  // the main job's own progress, since that's the single source of truth both
  // cards read from (e.g. the customer asks for a bit more or less while paying
  // whoever's there for the back)
  async function persistMainPrice(newPrice){
    if(!db) return;
    const mainProgRef = doc(db,'workeriser',`progress_${job.mainJobWorker}_${date}`);
    try{
      await runTransaction(db, async (tx)=>{
        const snap = await tx.get(mainProgRef);
        const freshMainProg = snap.exists() ? (snap.data().value || {}) : {};
        const current = freshMainProg[job.mainJobId] ? Object.assign({}, freshMainProg[job.mainJobId]) : { status:'todo', payment:'', price:'', frontApplied:false, cancelled:false };
        current.price = newPrice;
        freshMainProg[job.mainJobId] = current;
        tx.set(mainProgRef, { value: freshMainProg, updatedAt: Date.now() });
      });
    }catch(err){ console.error('persistMainPrice transaction failed', err); }
  }

  card.querySelector('[data-action="done"]').onclick = async ()=>{
    const newStatus = currentStatus === 'done' ? 'todo' : 'done';
    await persist(current=>{ current.status = newStatus; });
    currentStatus = newStatus;
    const btn = card.querySelector('[data-action="done"]');
    btn.classList.toggle('active-done', newStatus==='done');
    card.className = `card job-card sub-job-card status-${newStatus}`;
    if(newStatus === 'done'){
      card.querySelector('.wipe').classList.add('play');
    }
    if(refreshStats) refreshStats();
    scheduleReflow(job.id, worker, date);
  };

  payInput.addEventListener('input', ()=>{
    updateOwedAfter();
    persist(current=>{ current.payment = payInput.value; });
    scheduleReflow(job.id, worker, date);
  });
  payInput.addEventListener('blur', ()=>{
    if(payInput.value !== ''){
      payInput.value = (parseFloat(payInput.value)||0).toFixed(2);
      updateOwedAfter();
      persist(current=>{ current.payment = payInput.value; });
    }
  });

  priceInput.addEventListener('input', ()=>{
    updateOwedAfter();
    persistMainPrice(priceInput.value);
    scheduleReflow(job.id, worker, date);
  });
  priceInput.addEventListener('blur', ()=>{
    if(priceInput.value !== ''){
      priceInput.value = currentPrice().toFixed(2);
      updateOwedAfter();
      persistMainPrice(priceInput.value);
    }
  });

  card.querySelector('.note-field textarea').addEventListener('input', (e)=>{
    persist(current=>{ current.note = e.target.value; });
    scheduleReflow(job.id, worker, date);
  });

  const assignCheckboxes = card.querySelectorAll('.assign-checkbox');
  if(assignCheckboxes.length){
    const applyBtn = card.querySelector('.assign-apply-btn');
    let checkOrder = [...new Set([job.mainJobWorker, worker])]; // front first, then this back card's own worker

    function refreshCheckboxUI(){
      const checkedCount = checkOrder.length;
      assignCheckboxes.forEach(cb=>{
        const isChecked = checkOrder.includes(cb.value);
        cb.checked = isChecked;
        cb.disabled = !isChecked && checkedCount >= 2;
        const tag = cb.closest('.assign-checkbox-item').querySelector('.assign-role-tag');
        if(isChecked && checkedCount === 2){
          const idx = checkOrder.indexOf(cb.value);
          tag.textContent = idx === 0 ? ' (Front)' : ' (Back)';
        } else {
          tag.textContent = '';
        }
      });
    }
    refreshCheckboxUI();

    assignCheckboxes.forEach(cb=>{
      cb.addEventListener('change', ()=>{
        if(cb.checked){
          if(checkOrder.length < 2 && !checkOrder.includes(cb.value)) checkOrder.push(cb.value);
        } else {
          const wouldRemain = checkOrder.filter(w=>w!==cb.value);
          if(wouldRemain.length === 0){
            cb.checked = true;
            return;
          }
          checkOrder = wouldRemain;
        }
        refreshCheckboxUI();
        applyBtn.style.display = 'block';
      });
    });

    applyBtn.onclick = async ()=>{
      applyBtn.disabled = true;
      applyBtn.textContent = 'Applying…';
      await applyFrontBackAssignment(worker, job, date, checkOrder.slice());
      toast('Assignment updated');
      onReassigned();
    };
  }

  card.querySelector('.reject-btn').onclick = async ()=>{
    const btn = card.querySelector('.reject-btn');
    if(!confirm(`Reject this split? This removes the "back" card completely — ${escapeHtml(job.address)} will just be a normal job for whoever has the front.`)) return;
    btn.disabled = true;
    btn.textContent = 'Removing…';
    await rejectSubJobEntirely(worker, job, date);
    toast('Split cancelled — back card removed');
    if(onReassigned) onReassigned(); else render();
  };

  return card;
}

/* ================= DAY SUMMARY (worker-facing) ================= */
/* ================= NEW CUSTOMER ================= */
async function renderNewCustomer(){
  const { worker, date } = state;
  const fromScreen = state.fromScreen || 'worker';
  const editJobId = state.editJobId || null;
  app.innerHTML = '';

  const header = document.createElement('div');
  header.className = 'topbar';
  header.innerHTML = `<div class="topbar-row">
      <div class="brand"><div class="brand-mark">+</div>
      <div class="brand-text"><div class="t1">${escapeHtml(worker)} · ${date}</div><div class="t2">${editJobId ? 'Edit new customer' : 'New customer'}</div></div></div>
      <button class="topbar-btn" id="backBtn">Cancel</button>
    </div>`;
  app.appendChild(header);
  header.querySelector('#backBtn').onclick = ()=> go(fromScreen, {worker, date});

  const main = document.createElement('div');
  main.className = 'main';
  app.appendChild(main);

  const existingJobs = (await loadJobs(worker, date)) || [];
  const editingJob = editJobId ? existingJobs.find(j=>j.id===editJobId) : null;

  // work out a sensible round default from the next job still to do (only for new entries)
  let suggestedRound = editingJob ? editingJob.round : '';
  if(!editingJob){
    const sorted = existingJobs.slice().sort((a,b)=>a.order-b.order);
    const existingProg = await loadProgress(worker, date);
    const nextTodo = sorted.find(j => !existingProg[j.id] || existingProg[j.id].status==='todo');

      <div class="field"><label>Round</label><input type="text" id="ncRound" value="${escapeHtml(suggestedRound)}" placeholder="Nearest round"></div>
      <div class="note-box" id="ncGeoStatus">📍 Getting location…</div>

      <div class="section-title" style="margin-top:6px;">Optional details</div>
      <div class="field"><label>Title</label>
        <select id="ncTitle">
          <option value="">—</option>
          <option${editingJob && editingJob.title==='Mr' ? ' selected' : ''}>Mr</option>
          <option${editingJob && editingJob.title==='Mrs' ? ' selected' : ''}>Mrs</option>
          <option${editingJob && editingJob.title==='Ms' ? ' selected' : ''}>Ms</option>
          <option${editingJob && editingJob.title==='Miss' ? ' selected' : ''}>Miss</option>
          <option${editingJob && editingJob.title==='Dr' ? ' selected' : ''}>Dr</option>
        </select>
      </div>
      <div class="field"><label>First name</label><input type="text" id="ncFirst" value="${editingJob ? escapeHtml(editingJob.firstName||'') : ''}"></div>
      <div class="field"><label>Last name</label><input type="text" id="ncLast" value="${editingJob ? escapeHtml(editingJob.lastName||'') : ''}"></div>
      <div class="field"><label>Phone number</label><input type="tel" id="ncPhone" placeholder="07…" value="${editingJob ? escapeHtml(editingJob.phone||'') : ''}"></div>
      <label style="display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:600;color:var(--ink-soft);">
        <input type="checkbox" id="ncGateText" style="width:18px;height:18px;accent-color:var(--navy);"${editingJob && editingJob.needsGateText ? ' checked' : ''}>

        <input type="checkbox" id="ncGocardless" style="width:18px;height:18px;accent-color:var(--navy);"${editingJob && editingJob.gocardless ? ' checked' : ''}>
        Gocardless
      </label>
      <label style="display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:600;color:var(--ink-soft);">
        <input type="checkbox" id="ncInvoice" style="width:18px;height:18px;accent-color:var(--navy);"${editingJob && editingJob.invoice ? ' checked' : ''}>

  main.appendChild(card);

  // auto-capture GPS location — keeps the existing coordinates as a fallback when editing
  let capturedLat = editingJob ? editingJob.lat : null;
  let capturedLon = editingJob ? editingJob.lon : null;
  const geoStatus = card.querySelector('#ncGeoStatus');
  if('geolocation' in navigator){
    navigator.geolocation.getCurrentPosition(
      pos=>{
        capturedLat = pos.coords.latitude;
        capturedLon = pos.coords.longitude;
        geoStatus.textContent = '📍 Location captured — Navigate will work for this job.';
      },
      err=>{
        geoStatus.textContent = editingJob && editingJob.lat != null ? '📍 Using the location saved earlier.' : '📍 Could not get location — Navigate will fall back to searching the address.';
      },
      { timeout: 10000 }
    );
  } else {
    geoStatus.textContent = editingJob && editingJob.lat != null ? '📍 Using the location saved earlier.' : '📍 Location not available on this device — Navigate will fall back to searching the address.';
  }

  const freqSelect = card.querySelector('#ncFrequency');
  const gateCheck = card.querySelector('#ncGateText');

  card.querySelector('#ncSave').onclick = async ()=>{
    const errEl = card.querySelector('#ncError');
    errEl.textContent = '';
    const address = card.querySelector('#ncAddress').value.trim();
    const price = parseFloat(card.querySelector('#ncPrice').value);
    const frequency = freqSelect.value;
    const round = card.querySelector('#ncRound').value.trim();
    const title = card.querySelector('#ncTitle').value;
    const firstName = card.querySelector('#ncFirst').value.trim();
    const lastName = card.querySelector('#ncLast').value.trim();
    const email = card.querySelector('#ncEmail').value.trim();
    const needsGateText = gateCheck.checked;
    const gocardless = card.querySelector('#ncGocardless').checked;
    const invoice = card.querySelector('#ncInvoice').checked;
    const phone = card.querySelector('#ncPhone').value.trim();
    const notes = card.querySelector('#ncNotes').value.trim();

    if(!address){ errEl.textContent = 'Address is required.'; return; }
    if(!price || price <= 0){ errEl.textContent = 'Enter a valid price.'; return; }
    if(!frequency){ errEl.textContent = 'Frequency is required.'; return; }

    const saveBtn = card.querySelector('#ncSave');
    saveBtn.disabled = true;
    saveBtn.textContent = editJobId ? 'Saving…' : 'Adding…';

    const customerName = [title, firstName, lastName].filter(Boolean).join(' ') || '(new customer)';
    const jobs = (await loadJobs(worker, date)) || [];

    if(editJobId){
      const idx = jobs.findIndex(j=>j.id===editJobId);
      if(idx !== -1){
        jobs[idx] = Object.assign({}, jobs[idx], {
          customer: customerName, address, phone, lat: capturedLat, lon: capturedLon,
          round, price, frontPrice: Math.ceil(price/2 + 1), notes, frequency,
          title, firstName, lastName, email, needsGateText, gocardless, invoice
        });
      }
      await saveJobs(worker, date, jobs);
      toast('New customer updated');
      go(fromScreen, {worker, date});
      return;
    }

    const sameRound = jobs.filter(j=>round && j.round===round);
    const order = sameRound.length
      ? Math.max(...sameRound.map(j=>j.order)) + 0.5
      : (jobs.length ? Math.max(...jobs.map(j=>j.order)) + 1 : 0);

    const newJob = {
      id: 'new_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,7),
      order,
      customer: customerName,
      address,
      postcode: '',
      phone,
      lat: capturedLat,
      lon: capturedLon,
      round,
      price,
      frontPrice: Math.ceil(price/2 + 1),
      balance: 0,
      notes,
      timeRequired: '',
      frequency,
      isNewCustomer: true,
      createdBy: worker,
      title, firstName, lastName, email, needsGateText, gocardless, invoice
    };
    jobs.push(newJob);
    await saveJobs(worker, date, jobs);
    toast('New customer added to the list');
    go('worker', {worker, date});
  };
}

// removes a new-customer job (and any progress recorded against it) entirely
async function deleteNewCustomerJob(worker, date, jobId){
  const jobs = (await loadJobs(worker, date)) || [];
  const remaining = jobs.filter(j=>j.id !== jobId);
  await saveJobs(worker, date, remaining);
  const prog = await loadProgress(worker, date);
  if(prog[jobId]){
    delete prog[jobId];
    await saveProgress(worker, date, prog);
  }
}


async function renderDaySummary(){
  const {worker,date} = state;
  const [jobsRaw, prog] = await Promise.all([loadJobs(worker,date), loadProgress(worker,date)]);
  const jobs = jobsRaw || [];
  app.innerHTML = '';

  const header = document.createElement('div');
  header.className = 'topbar';
  header.innerHTML = `<div class="topbar-row">
      <div class="brand"><div class="brand-mark">${worker[0]}</div>
      <div class="brand-text"><div class="t1">Summary · ${date}</div><div class="t2">${worker}</div></div></div>
      <button class="topbar-btn" id="backBtn">Back</button>
    </div>`;

  const rows = sortedJobs.map(j=>{
    const p = prog[j.id] || {status:'todo',payment:0};

    outstanding += owedAfter;
    return {job:j,status:p.status,cancelled:!!p.cancelled,payment,price,note:p.note||'',owedAfter,frontApplied:!!p.frontApplied};

    <div class="section-title">Job overview</div>

      <tr><th>Address</th><th>Status</th><th class="num">Price</th><th class="num">Cash</th><th class="num">Current balance</th></tr>
      ${tableRows}
    </table>
  `;
  main.appendChild(card2);
  main.insertAdjacentHTML('beforeend', renderNewCustomerSection(rows, true));

  const card = document.createElement('div');
  card.className = 'card pad';
  card.style.marginTop = '14px';
  card.innerHTML = `
    <div class="section-title">Today's totals</div>
    <table class="report">
      <tr><td>Jobs done</td><td class="num">${formatJobCount(doneN)} / ${formatJobCount(totalWeighted)}</td></tr>
      <tr><td>Skipped</td><td class="num">${formatJobCount(skippedN)}</td></tr>
      <tr><td>Cancelled</td><td class="num">${formatJobCount(cancelledN)}</td></tr>
      <tr><td>Not done</td><td class="num">${formatJobCount(notDoneN)}</td></tr>
      <tr><td>Cash collected</td><td class="num">${money(collected)}</td></tr>
    </table>
  `;
  main.appendChild(card);

  const btnRow = document.createElement('div');
  btnRow.className = 'stack';
  btnRow.style.marginTop = '16px';
  btnRow.innerHTML = `
    <button class="btn btn-amber btn-block" id="copyBtn">Copy report to send to office</button>
    <button class="btn btn-ghost btn-block" id="csvBtn">Download CSV</button>
  `;
  main.appendChild(btnRow);

  btnRow.querySelector('#copyBtn').onclick = ()=>{
    const text = buildReportText(worker,date,rows,{collected,outstanding,doneN,skippedN,cancelledN,total:totalWeighted});
    navigator.clipboard.writeText(text).then(()=>toast('Report copied — paste into WhatsApp/text')).catch(()=>{
      const ta = document.createElement('textarea'); ta.value=text; document.body.appendChild(ta);
      ta.select(); document.execCommand('copy'); ta.remove();
      toast('Report copied — paste into WhatsApp/text');
    });
  };
  btnRow.querySelector('#csvBtn').onclick = ()=> downloadReportCSV(worker,date,rows);
}

function buildReportText(worker,date,rows,totals){
  let lines = [];
  lines.push(`${worker} — ${date}`);
  lines.push(`Done ${formatJobCount(totals.doneN)}/${formatJobCount(totals.total)} · Skipped ${formatJobCount(totals.skippedN)} · Cancelled ${formatJobCount(totals.cancelledN)}`);
  lines.push(`Collected: ${money(totals.collected)}   Outstanding: ${money(totals.outstanding)}`);
  lines.push('');
  rows.forEach(r=>{
    const cancelledNote = r.cancelled ? ' [Cancelled]' : '';
    if(r.status === 'todo'){
      lines.push(`${r.job.customer} — ${statusLabel(r.status)}${cancelledNote}`);
      return;
    }
    const charged = chargeForStatus(r.price, r.status);
    lines.push(`${r.job.customer} — ${r.status}${cancelledNote}, charged ${money(charged)}${r.payment?`, paid ${money(r.payment)}`:''}${r.owedAfter>0.004?`, owes ${money(r.owedAfter)}`:''}${r.note?` — note: ${r.note}`:''}`);
  });
  return lines.join('\n');
}

function downloadReportCSV(worker,date,rows){
  let csv = 'Customer,Address,Round,ListPrice,PriceCharged,Status,Cancelled,CashTaken,OwedAfter,Note\n';
  rows.forEach(r=>{
    csv += [r.job.customer,r.job.address,r.job.round,r.job.price.toFixed(2),r.price.toFixed(2),statusLabel(r.status),r.cancelled?'Yes':'No',r.payment.toFixed(2),r.owedAfter.toFixed(2),r.note||'']
      .map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',') + '\n';
  });
  const blob = new Blob([csv],{type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${worker}_${date}_report.csv`;
  a.click();
}

function downloadReportCSVMulti(date,rows){
  let csv = 'Worked by,Customer,Address,Round,ListPrice,PriceCharged,Status,Cancelled,CashTaken,OwedAfter,Note\n';
  rows.forEach(r=>{
    const workedBy = (r.workedBy || [r.worker]).join(' & ');
    csv += [workedBy,r.job.customer,r.job.address,r.job.round,r.job.price.toFixed(2),r.price.toFixed(2),statusLabel(r.status),r.cancelled?'Yes':'No',r.payment.toFixed(2),r.owedAfter.toFixed(2),r.note||'']
      .map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',') + '\n';
  });
  const blob = new Blob([csv],{type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `all-workers_${date}_report.csv`;
  a.click();
}

    <p class="muted" style="font-size:12.5px;margin-top:-4px;line-height:1.5;">Upload your "active, sorted by round order" export occasionally to keep GPS coordinates and round order on file. Daily job list CSVs don't carry this themselves — addresses are matched against this list automatically whenever you load a job list above.</p>
    <div class="note-box" style="margin:10px 0;">${addrCount ? `${addrCount} addresses on file${lookup.updatedAt ? ` · updated ${lookup.updatedAt}` : ''}` : 'No coordinate reference uploaded yet'}</div>
    <div class="field"><label>active-round-order...csv</label><input type="file" id="cFile" accept=".csv,*/*"></div>
    <button class="btn btn-ghost btn-block" id="cGo" style="margin-top:10px;">Update coordinates</button>
    <div id="cStatus"></div>
  `;
  main.appendChild(coordCard);

  coordCard.querySelector('#cGo').onclick = ()=>{
    const file = coordCard.querySelector('#cFile').files[0];
    if(!file){ toast('Choose a CSV file first'); return; }
    const reader = new FileReader();
    reader.onload = async (e)=>{
      try{
        const rows = parseCSV(e.target.result);
        const addresses = buildCoordAddresses(rows);
        const roundOrder = buildRoundOrder(rows);
        const roundPosition = buildRoundPosition(rows);
        const roundIndexOrder = buildRoundIndexOrder(rows);
        const count = Object.keys(addresses).length;
        if(!count){ toast('No coordinates found in that file'); return; }
        await saveCoordLookup({ updatedAt: new Date().toLocaleDateString('en-GB'), addresses, roundOrder, roundPosition, roundIndexOrder });
        const { fixed, stillMissing } = await rescanAllRoundsForCoords();
        coordCard.querySelector('#cStatus').innerHTML = `<div class="note-box" style="margin-top:8px;">Saved ${count} addresses.${fixed ? ` Filled in coordinates for ${fixed} already-loaded job${fixed===1?'':'s'}.` : ''}${stillMissing ? ` ${stillMissing} job${stillMissing===1?'':'s'} still missing — check the address spelling matches.` : ''}</div>`;
        toast('Coordinate reference updated');
      }catch(err){ console.error(err); toast('Could not read that CSV'); }
    };
    reader.readAsText(file);
  };
}

async function renderAdminDayManagement(main, header){
  const card = document.createElement('div');
  card.className = 'card pad';
  const options = `<option value="ALL">All workers</option>` + WORKERS.map(w=>`<option value="${w}">${w}</option>`).join('') + `<option value="undefined">⚠ Recover orphaned jobs</option>`;
  card.innerHTML = `
    <div class="section-title">Day management</div>
    <p class="muted" style="font-size:12.5px;margin-top:-4px;line-height:1.5;">View and correct any worker's list for any date — add notes, adjust prices, fix statuses. Works for jobs still to come or already completed.</p>
    <div class="stack" style="margin-top:10px;">
      <div class="field"><label>Worker</label><select id="dmWorker">${options}</select></div>
      <div class="field"><label>Date</label><input type="date" id="dmDate" value="${todayStr()}"></div>
      <button class="btn btn-primary btn-block" id="dmGo">Load list</button>
    </div>
  `;
  main.appendChild(card);

  const out = document.createElement('div');
  out.style.marginTop = '14px';
  main.appendChild(out);

  const dmReorderBar = document.createElement('div');
  header.appendChild(dmReorderBar);
  const selectedForReorder = new Set();

  async function loadAndRender(keepSelection){
    if(!keepSelection) selectedForReorder.clear();
    const worker = card.querySelector('#dmWorker').value;
    const date = card.querySelector('#dmDate').value || todayStr();
    out.innerHTML = '<p class="muted">Loading…</p>';
    dmReorderBar.innerHTML = '';

    const healedCount = await healBrokenSplitLinks(date);
    if(healedCount){
      toast(`Fixed ${healedCount} split${healedCount===1?'':'s'} with a missing front/back — recreated and ready to reassign if needed`);
    }

    if(worker === 'ALL'){
      const results = await Promise.all(WORKERS.map(async w=>{
        const jobs = await loadJobs(w,date);
        const prog = (jobs && jobs.length) ? await loadProgress(w,date) : {};
        return (jobs||[]).map(j=>({worker:w, job:j, prog}));
      }));
      const flat = results.flat();
      if(!flat.length){
        out.innerHTML = `<div class="card pad"><p class="muted">No job lists loaded for ${date} yet.</p></div>`;
        return;
      }
      const lookup = await loadCoordLookup();
      flat.sort((a,b)=> roundOrderRank(a.job,lookup) - roundOrderRank(b.job,lookup));
      out.innerHTML = '';

      const headerCard = document.createElement('div');
      headerCard.className = 'card pad';
      headerCard.innerHTML = `<div style="font-weight:700;">${flat.length} job${flat.length===1?'':'s'} across all workers · ${date}</div>`;
      out.appendChild(headerCard);

      const listWrap = document.createElement('div');
      listWrap.style.marginTop = '14px';
      out.appendChild(listWrap);

      let lastRound = null;
      const cardMap = new Map();
      const balanceLinkHandlers = new Map();
      const customFrontPrices = await loadCustomFrontPrices();

      // build lookup maps from data we've already loaded, so a sub-card's main job
      // (which might belong to a different worker) can be found with no extra fetch
      const jobsByWorker = new Map();
      const progByWorker = new Map();
      flat.forEach(({worker:w, job, prog})=>{
        if(!jobsByWorker.has(w)) jobsByWorker.set(w, new Map());
        jobsByWorker.get(w).set(job.id, job);
        progByWorker.set(w, prog);
      });

      flat.forEach(({worker:w, job, prog})=>{
        if(job.round && job.round !== lastRound){
          const rl = document.createElement('div');
          rl.className = 'round-label';
          rl.textContent = job.round;
          listWrap.appendChild(rl);
          lastRound = job.round;
        }
        let cardEl;
        const mainJob = (job.isSubJob && job.mainJobWorker && job.mainJobId) ? jobsByWorker.get(job.mainJobWorker)?.get(job.mainJobId) : null;
        if(mainJob){
          // confirmed-valid link — show it exactly as the worker's own screen would
          cardEl = renderSubJobCard(w, date, job, prog, mainJob, progByWorker.get(job.mainJobWorker) || {}, null, loadAndRender);
        } else {
          cardEl = renderJobCard(w, date, job, prog, null, true, loadAndRender, null, ()=>{
            const fn = balanceLinkHandlers.get(job.id);
            if(fn) fn();
          },customFrontPrices);
        }
        listWrap.appendChild(cardEl);
        cardMap.set(job.id, cardEl);
      });

      // same property split into two jobs (e.g. outside vs inside windows) share one
      // real account balance — keep both cards' "today's balance" in sync, live,
      // same as the worker's own screen and the single-worker Day Management view
      const addressGroups = new Map();
      flat.forEach(({job})=>{
        if(job.isSubJob || job.subJobWorker) return; // split jobs share a balance via their own dedicated logic, not this grouping
        if(!addressGroups.has(job.address)) addressGroups.set(job.address, []);
        addressGroups.get(job.address).push(job);
      });
      addressGroups.forEach(groupJobs=>{
        if(groupJobs.length < 2) return;
        const groupCards = groupJobs.map(j=>cardMap.get(j.id)).filter(Boolean);
        if(groupCards.length < 2) return;
        function recomputeLinkedBalance(){
          const debt = -groupJobs[0].balance;
          let chargeSum = 0, paymentSum = 0, allSkipped = true;
          groupCards.forEach(c=>{
            const skippedBtn = c.querySelector('[data-action="skipped"]');
            const isSkipped = skippedBtn ? skippedBtn.classList.contains('active-skipped') : false;
            if(!isSkipped) allSkipped = false;
            const price = parseFloat(c.querySelector('.price-input').value) || 0;
            const payment = parseFloat(c.querySelector('.pay-input').value) || 0;
            if(!isSkipped) chargeSum += price;
            paymentSum += payment;
          });
          const owedAfter = debt + chargeSum - paymentSum;
          groupCards.forEach(c=>{
            const labelEl = c.querySelector('.balance-label');
            const valueEl = c.querySelector('.balance-value');
            if(labelEl) labelEl.textContent = allSkipped ? 'Current balance' : "Today's balance";
            valueEl.dataset.owed = String(owedAfter);
            if(owedAfter > 0.004) valueEl.innerHTML = `<b style="color:var(--red)">${money(owedAfter)}</b>`;
            else if(owedAfter < -0.004) valueEl.innerHTML = `<b style="color:var(--green)">${money(-owedAfter)} credit</b>`;
            else valueEl.innerHTML = `<b style="color:var(--green)">£0.00</b>`;
          });
        }
        groupJobs.forEach(j=> balanceLinkHandlers.set(j.id, recomputeLinkedBalance));
        recomputeLinkedBalance();
      });
      return;
    }

    const jobs = await loadJobs(worker,date);
    if(!jobs || !jobs.length){
      out.innerHTML = `<div class="card pad"><p class="muted">No job list loaded for ${escapeHtml(worker)} on ${date}. Upload one from the Upload tab.</p></div>`;
      return;
    }
    const prog = await loadProgress(worker,date);
    const sorted = jobs.slice().sort((a,b)=>a.order-b.order);
    out.innerHTML = '';

    const headerCard = document.createElement('div');
    headerCard.className = 'card pad';
    headerCard.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
        <div style="font-weight:700;">${jobs.length} job${jobs.length===1?'':'s'} · ${escapeHtml(worker)} · ${date}</div>
        <div style="display:flex;gap:6px;">
          <button type="button" id="dmReverse" style="background:transparent;border:1.5px solid var(--line);color:var(--navy);border-radius:8px;padding:6px 11px;font-size:12.5px;font-weight:700;cursor:pointer;">Reverse order</button>
          <button type="button" id="dmClear" style="background:transparent;border:1.5px solid var(--line);color:var(--red);border-radius:8px;padding:6px 11px;font-size:12.5px;font-weight:700;cursor:pointer;">Clear</button>
        </div>
      </div>
    `;
    out.appendChild(headerCard);
    headerCard.querySelector('#dmReverse').onclick = async ()=>{
      if(!confirm(`Reverse ${worker}'s job order for ${date}? Their next job will become their last, and vice versa.`)) return;
      await reverseWorkOrder(worker, date);
      toast(`Reversed ${worker}'s job order for ${date}`);
      loadAndRender(true);
    };
    headerCard.querySelector('#dmClear').onclick = async ()=>{
      if(!confirm(`Clear ${worker}'s job list for ${date}? This removes their jobs, progress, and report for that day completely — this can't be undone.`)) return;
      await deleteReportSnapshot(worker, date);
      await saveJobs(worker, date, []);
      await saveProgress(worker, date, {});
      toast(`Cleared ${worker}'s job list for ${date}`);
      loadAndRender();
    };

    const listWrap = document.createElement('div');
    listWrap.style.marginTop = '14px';
    out.appendChild(listWrap);

    function updateReorderBar(){
      dmReorderBar.innerHTML = '';
      if(!selectedForReorder.size) return;
      const box = document.createElement('div');
      box.className = 'move-bar';
      box.style.marginTop = '12px';
      box.innerHTML = `
        <div class="move-bar-label">${selectedForReorder.size} selected for reordering</div>
        <div class="move-bar-targets">
          <button type="button" class="move-target-btn" id="reorderUpBtn">▲ Move up</button>
          <button type="button" class="move-target-btn" id="reorderDownBtn">▼ Move down</button>
          <button type="button" class="move-dismiss-btn" id="reorderClearBtn" style="border:none;border-radius:20px;padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer;">Deselect all</button>
        </div>
      `;
      dmReorderBar.appendChild(box);
      box.querySelector('#reorderUpBtn').onclick = async ()=>{
        await nudgeJobOrder(worker, date, Array.from(selectedForReorder), 'up');
        loadAndRender(true);
      };
      box.querySelector('#reorderDownBtn').onclick = async ()=>{
        await nudgeJobOrder(worker, date, Array.from(selectedForReorder), 'down');
        loadAndRender(true);
      };
      box.querySelector('#reorderClearBtn').onclick = ()=>{
        selectedForReorder.clear();
        loadAndRender(true);
      };
    }
    updateReorderBar();

    let lastRound = null;
    const dmBalanceLinkHandlers = new Map();
    const dmCardMap = new Map();
    const customFrontPrices = await loadCustomFrontPrices();

    // pre-fetch any sub-cards' main job data (which might belong to a different
    // worker) so each one can be shown exactly as the worker's own screen would
    const linkedMainMap = new Map();
    await Promise.all(sorted.map(async j=>{
      if(j.isSubJob && j.mainJobWorker && j.mainJobId){
        const [mJobs, mProg] = await Promise.all([loadJobs(j.mainJobWorker, date), loadProgress(j.mainJobWorker, date)]);
        const mainJob = (mJobs||[]).find(mj=>mj.id===j.mainJobId);
        if(mainJob) linkedMainMap.set(j.id, { mainJob, mainProg: mProg||{} });
      }
    }));

    sorted.forEach((job,idx)=>{
      if(job.round && job.round !== lastRound){
        const rl = document.createElement('div');
        rl.className = 'round-label';
        rl.textContent = job.round;
        listWrap.appendChild(rl);
        lastRound = job.round;
      }
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;gap:8px;align-items:stretch;margin-bottom:10px;';
      const controls = document.createElement('div');
      controls.style.cssText = 'display:flex;flex-direction:column;align-items:center;gap:4px;flex:none;justify-content:center;width:34px;';
      controls.innerHTML = `
        <button type="button" class="dm-up-btn" ${idx===0?'disabled':''} style="width:32px;height:28px;border:1.5px solid var(--line);background:#fff;border-radius:7px;color:var(--navy);font-size:13px;cursor:pointer;">▲</button>
        <input type="checkbox" class="dm-reorder-check" ${selectedForReorder.has(job.id)?'checked':''} style="width:18px;height:18px;accent-color:var(--navy);">
        <button type="button" class="dm-down-btn" ${idx===sorted.length-1?'disabled':''} style="width:32px;height:28px;border:1.5px solid var(--line);background:#fff;border-radius:7px;color:var(--navy);font-size:13px;cursor:pointer;">▼</button>
      `;
      // isSuper=true hides the Reject button, which is meant for field workers, not admin edits
      const linked = linkedMainMap.get(job.id);
      const cardEl = linked
        ? renderSubJobCard(worker, date, job, prog, linked.mainJob, linked.mainProg, null, loadAndRender)
        : renderJobCard(worker, date, job, prog, null, true, loadAndRender, null, ()=>{
            const fn = dmBalanceLinkHandlers.get(job.id);
            if(fn) fn();
          },customFrontPrices);
      cardEl.style.flex = '1';
      cardEl.style.marginBottom = '0';
      row.appendChild(controls);
      row.appendChild(cardEl);
      listWrap.appendChild(row);

      controls.querySelector('.dm-up-btn').onclick = async ()=>{
