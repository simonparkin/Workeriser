      };
      controls.querySelector('.dm-down-btn').onclick = async ()=>{
        await nudgeJobOrder(worker, date, [job.id], 'down');
        loadAndRender(true);
      };
      controls.querySelector('.dm-reorder-check').addEventListener('change', (e)=>{
        if(e.target.checked) selectedForReorder.add(job.id);
        else selectedForReorder.delete(job.id);
        updateReorderBar();
      });
    });

    // same property split into two jobs (e.g. outside vs inside windows) share one
    // real account balance — keep both cards' "today's balance" in sync, live
    const dmAddressGroups = new Map();
    sorted.forEach(job=>{
      if(job.isSubJob || job.subJobWorker) return; // split jobs share a balance via their own dedicated logic, not this grouping
      if(!dmAddressGroups.has(job.address)) dmAddressGroups.set(job.address, []);
      dmAddressGroups.get(job.address).push(job);
    });
    dmAddressGroups.forEach(groupJobs=>{
      if(groupJobs.length < 2) return;
      const groupCards = groupJobs.map(j=>dmCardMap.get(j.id)).filter(Boolean);
      if(groupCards.length < 2) return;
      function recomputeLinkedBalance(){
        const debt = -groupJobs[0].balance;
        let chargeSum = 0, paymentSum = 0, allSkipped = true;
        groupCards.forEach(c=>{
          const skippedBtn = c.querySelector('[data-action="skipped"]');
          const isSkipped = skippedBtn ? skippedBtn.classList.contains('active-skipped') : false;
          if(!isSkipped) allSkipped = false;
          const price = parseFloat(c.querySelector('.price-input').value) || 0;
          const payment = parseFloat(c.querySelector('.pay-input').value) || 0;
          if(!isSkipped) chargeSum += price; // presumes each job happens unless explicitly skipped, same rule as a single card
          paymentSum += payment;
        });
        const owedAfter = debt + chargeSum - paymentSum;
        groupCards.forEach(c=>{
          const labelEl = c.querySelector('.balance-label');
          const valueEl = c.querySelector('.balance-value');
          if(labelEl) labelEl.textContent = allSkipped ? 'Current balance' : "Today's balance";
          valueEl.dataset.owed = String(owedAfter);
          if(owedAfter > 0.004) valueEl.innerHTML = `<b style="color:var(--red)">${money(owedAfter)}</b>`;
          else if(owedAfter < -0.004) valueEl.innerHTML = `<b style="color:var(--green)">${money(-owedAfter)} credit</b>`;
          else valueEl.innerHTML = `<b style="color:var(--green)">£0.00</b>`;
        });
      }
      groupJobs.forEach(j=> dmBalanceLinkHandlers.set(j.id, recomputeLinkedBalance));
      recomputeLinkedBalance();
    });
  }

  card.querySelector('#dmGo').onclick = ()=> loadAndRender();
}

function renderAdminReport(main){
  const card = document.createElement('div');
  card.className = 'card pad';
  const options = `<option value="ALL">All workers</option>` + WORKERS.map(w=>`<option value="${w}">${w}</option>`).join('');
  card.innerHTML = `
    <div class="section-title">View a report</div>
    <div class="stack">
      <div class="field"><label>Worker</label><select id="rWorker">${options}</select></div>
      <div class="field"><label>Date</label><input type="date" id="rDate" value="${todayStr()}"></div>
      <button class="btn btn-primary btn-block" id="rGo">Show report</button>
    </div>
    <div id="rOut" style="margin-top:16px;"></div>
  `;
  main.appendChild(card);

  async function showReport(){
    const worker = card.querySelector('#rWorker').value;
    const date = card.querySelector('#rDate').value;
    const out = card.querySelector('#rOut');

    if(worker === 'ALL'){
      const results = await Promise.all(WORKERS.map(async w=>{
        const { jobs, prog } = await loadForReport(w,date);
        return { w, jobs: jobs || [], prog: prog || {} };
      }));
      const customFrontPrices = await loadCustomFrontPrices();
      const progByWorker = {};
      results.forEach(({w,prog})=>{ progByWorker[w] = prog; });
      // a sub-card's price edits are written to the MAIN job's own progress, not its
      // own — so its own progress never carries a price, and resolvedPrice() would
      // otherwise fall back to a frozen snapshot from when the split was created
      function resolveJobPrice(j, p){
        if(j.isSubJob && j.mainJobWorker && j.mainJobId){
          const mainProg = progByWorker[j.mainJobWorker] || {};
          return resolvedPrice(j, mainProg[j.mainJobId]);
        }
        return resolvedPrice(j, p);
      }
      let collected=0, doneN=0, skippedN=0, cancelledN=0, notDoneN=0, totalJobs=0, totalWeighted=0;
      const allRows = [];
      const earnedByWorker = {};
      results.forEach(({w, jobs, prog})=>{
        totalJobs += jobs.length;
        jobs.slice().sort((a,b)=>a.order-b.order).forEach(j=>{
          const p = prog[j.id] || {status:'todo',payment:0};
          const payment = parseFloat(p.payment)||0;
          const price = resolveJobPrice(j,p);
          const weight = jobWeight(j);
          collected += payment;
          totalWeighted += weight;
          if(p.status==='done'){ doneN += weight; earnedByWorker[w] = (earnedByWorker[w]||0) + splitEarnedShare(j, price, customFrontPrices); }
          if(p.status==='skipped') skippedN += weight;
          if(p.cancelled) cancelledN += weight;
          if(p.status==='todo') notDoneN += weight;
          const debt = -j.balance;
          const owedAfter = debt + chargeForStatus(price,p.status) - payment;
          allRows.push({worker:w,job:j,status:p.status,cancelled:!!p.cancelled,payment,price,note:p.note||'',owedAfter,frontApplied:!!p.frontApplied});
        });
      });
      if(!totalJobs){ out.innerHTML = `<p class="muted">No job lists loaded for ${date} yet.</p>`; return; }
      const lookup = await loadCoordLookup();

      // a split job appears twice in allRows (once per worker) — merge each pair into
      // one row for the table, since Aworka only knows about one job per address and
      // two rows makes reconciliation harder. This also fixes the balance itself:
      // each half's own row only knew about its own payment, not the other half's.
      const mergedRows = [];
      const consumedIds = new Set();
      allRows.forEach(r=>{
        if(consumedIds.has(r.job.id)) return;
        let mainRow = null, subRow = null;
        if(r.job.isSubJob && r.job.mainJobWorker && r.job.mainJobId){
          subRow = r;
          mainRow = allRows.find(o=>o.worker===r.job.mainJobWorker && o.job.id===r.job.mainJobId);
        } else if(r.job.subJobWorker && r.job.subJobId){
          mainRow = r;
          subRow = allRows.find(o=>o.worker===r.job.subJobWorker && o.job.id===r.job.subJobId);
        }
        if(mainRow && subRow){
          consumedIds.add(mainRow.job.id);
          consumedIds.add(subRow.job.id);
          const combinedPayment = mainRow.payment + subRow.payment;
          const debt = -mainRow.job.balance;
          const combinedOwed = debt + chargeForStatus(mainRow.price, mainRow.status) - combinedPayment;
          mergedRows.push({
            workedBy: [mainRow.worker, subRow.worker],
            worker: mainRow.worker,
            job: mainRow.job, status: mainRow.status, cancelled: mainRow.cancelled,
            payment: combinedPayment, price: mainRow.price,
            note: [mainRow.note, subRow.note].filter(Boolean).join(' / '),
            owedAfter: combinedOwed, frontApplied: mainRow.frontApplied
          });
        } else {
          consumedIds.add(r.job.id);
          mergedRows.push(Object.assign({workedBy:[r.worker]}, r));
        }
      });
      const outstanding = mergedRows.reduce((s,r)=> s + r.owedAfter, 0);
      mergedRows.sort((a,b)=> roundOrderRank(a.job,lookup) - roundOrderRank(b.job,lookup));
      const earnedRows = WORKERS.filter(w=>earnedByWorker[w]);
      const totalEarned = earnedRows.reduce((s,w)=> s + earnedByWorker[w], 0);
      out.innerHTML = `
        <table class="report">
          <tr><td>Jobs done</td><td class="num">${formatJobCount(doneN)} / ${formatJobCount(totalWeighted)}</td></tr>
          <tr><td>Skipped</td><td class="num">${formatJobCount(skippedN)}</td></tr>
          <tr><td>Cancelled</td><td class="num">${formatJobCount(cancelledN)}</td></tr>
          <tr><td>Not done</td><td class="num">${formatJobCount(notDoneN)}</td></tr>
          <tr><td>Cash collected</td><td class="num">${money(collected)}</td></tr>
          <tr><td>Still outstanding</td><td class="num">${money(outstanding)}</td></tr>
        </table>
        <div class="section-title" style="margin-top:16px;">Earned by worker</div>
        <table class="report">
          ${earnedRows.length ? earnedRows.map(w=>`<tr><td>${escapeHtml(w)}</td><td class="num">${money(earnedByWorker[w])}</td></tr>`).join('') : `<tr><td class="muted">No completed jobs yet.</td></tr>`}
          ${earnedRows.length ? `<tr><td><b>Day total</b></td><td class="num"><b>${money(totalEarned)}</b></td></tr>` : ''}
        </table>
        <div class="section-title" style="margin-top:16px;">All jobs</div>
        <table class="report">
          <tr><th>Worked by</th><th>Address</th><th>Status</th><th class="num">Charged</th><th class="num">Paid</th><th class="num">Balance</th></tr>
          ${mergedRows.length ? mergedRows.map(r=>`<tr><td>${r.workedBy.map(w=>escapeHtml(w)).join(' &amp; ')}</td><td>${escapeHtml(r.job.address)}${r.note ? `<div class="muted" style="font-size:11px;margin-top:2px;">${escapeHtml(r.note)}</div>` : ''}</td><td><span class="badge badge-${r.status}">${statusLabel(r.status)}</span>${cancelledBadge(r.cancelled)}</td>${chargedCell(r)}${paidCell(r)}${balanceCell(r)}</tr>`).join('') : `<tr><td colspan="6" class="muted">No jobs yet.</td></tr>`}
        </table>
        ${renderNewCustomerSection(mergedRows)}
        <button class="btn btn-ghost btn-block" id="rCsv" style="margin-top:10px;">Download CSV</button>
      `;
      out.querySelector('#rCsv').onclick = ()=> downloadReportCSVMulti(date, mergedRows);
      return;
    }

    const { jobs, prog: progRaw } = await loadForReport(worker,date);
    if(!jobs || !jobs.length){ out.innerHTML = `<p class="muted">No job list loaded for ${worker} on ${date}.</p>`; return; }
    const prog = progRaw || {};
    const sortedJobs = jobs.slice().sort((a,b)=>a.order-b.order);
    let collected=0, outstanding=0, doneN=0, skippedN=0, cancelledN=0, notDoneN=0, totalWeighted=0;
    const rows = sortedJobs.map(j=>{
      const p = prog[j.id] || {status:'todo',payment:0};
      const payment = parseFloat(p.payment)||0;
      const price = resolvedPrice(j,p);
      const weight = jobWeight(j);
      collected += payment;
      totalWeighted += weight;
      if(p.status==='done') doneN += weight;
      if(p.status==='skipped') skippedN += weight;
      if(p.cancelled) cancelledN += weight;
      if(p.status==='todo') notDoneN += weight;
      const debt = -j.balance;
      const owedAfter = debt + chargeForStatus(price,p.status) - payment;
      outstanding += owedAfter;
      return {job:j,status:p.status,cancelled:!!p.cancelled,payment,price,note:p.note||'',owedAfter,frontApplied:!!p.frontApplied};
    });
    out.innerHTML = `
      <table class="report">
        <tr><td>Jobs done</td><td class="num">${formatJobCount(doneN)} / ${formatJobCount(totalWeighted)}</td></tr>
        <tr><td>Skipped</td><td class="num">${formatJobCount(skippedN)}</td></tr>
        <tr><td>Cancelled</td><td class="num">${formatJobCount(cancelledN)}</td></tr>
        <tr><td>Not done</td><td class="num">${formatJobCount(notDoneN)}</td></tr>
        <tr><td>Cash collected</td><td class="num">${money(collected)}</td></tr>
        <tr><td>Still outstanding</td><td class="num">${money(outstanding)}</td></tr>
      </table>
      <div class="section-title" style="margin-top:16px;">Jobs</div>
      <table class="report">
        <tr><th>Address</th><th>Status</th><th class="num">Charged</th><th class="num">Paid</th><th class="num">Balance</th></tr>
        ${rows.length ? rows.map(r=>`<tr><td>${escapeHtml(r.job.address)}${r.note ? `<div class="muted" style="font-size:11px;margin-top:2px;">${escapeHtml(r.note)}</div>` : ''}</td><td><span class="badge badge-${r.status}">${statusLabel(r.status)}</span>${cancelledBadge(r.cancelled)}</td>${chargedCell(r)}${paidCell(r)}${balanceCell(r)}</tr>`).join('') : `<tr><td colspan="5" class="muted">No jobs yet.</td></tr>`}
      </table>
      ${renderNewCustomerSection(rows)}
      <button class="btn btn-ghost btn-block" id="rCsv" style="margin-top:10px;">Download CSV</button>
      <button class="btn btn-ghost btn-block" id="rDelete" style="margin-top:10px;color:var(--red);border-color:var(--red);">Delete this report</button>
    `;
    out.querySelector('#rCsv').onclick = ()=> downloadReportCSV(worker,date,rows);
    out.querySelector('#rDelete').onclick = async ()=>{
      if(!confirm(`Permanently delete ${worker}'s report for ${date}? This can't be undone.`)) return;
      const delBtn = out.querySelector('#rDelete');
      delBtn.disabled = true;
      delBtn.textContent = 'Deleting…';
      await deleteReportSnapshot(worker, date);
      await saveJobs(worker, date, []);
      await saveProgress(worker, date, {});
      toast(`Deleted ${worker}'s report for ${date}`);
      showReport();
    };
  }
  card.querySelector('#rGo').onclick = showReport;
}

async function renderAdminSettings(main){
  const card = document.createElement('div');
  card.className = 'card pad';
  card.innerHTML = `
    <div class="section-title">Change office password</div>
    <p class="muted" style="font-size:12.5px;margin-top:-4px;">This is shared — changing it updates the password required on every phone, not just this one.</p>
    <div class="stack" style="margin-top:10px;">
      <div class="field"><label>New password</label><input type="password" id="newPw2"></div>
      <button class="btn btn-primary btn-block" id="changePwBtn">Update password</button>
    </div>
  `;
  main.appendChild(card);
  card.querySelector('#changePwBtn').onclick = async ()=>{
    const v = card.querySelector('#newPw2').value;
    if(!v){ toast('Enter a password'); return; }
    await setPassword(v);
    toast('Password updated');
  };

  const superCard = document.createElement('div');
  superCard.className = 'card pad';
  superCard.style.marginTop = '14px';
  const currentSuperUsers = await loadSuperUsers();
  superCard.innerHTML = `
    <div class="section-title">Super users</div>
    <p class="muted" style="font-size:12.5px;margin-top:-4px;line-height:1.5;">Super users can tap Select on their own list to move jobs to anyone else, and rejected jobs get sent back to the first person ticked below.</p>
    <div class="stack" style="margin-top:10px;">
      ${WORKERS.map(w=>`
        <label style="display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;">
          <input type="checkbox" class="super-user-check" value="${escapeHtml(w)}" style="width:18px;height:18px;accent-color:var(--navy);"${currentSuperUsers.includes(w) ? ' checked' : ''}>
          ${escapeHtml(w)}
        </label>
      `).join('')}
      <button class="btn btn-primary btn-block" id="saveSuperUsersBtn" style="margin-top:6px;">Save super users</button>
    </div>
  `;
  main.appendChild(superCard);
  superCard.querySelector('#saveSuperUsersBtn').onclick = async ()=>{
    const checked = Array.from(superCard.querySelectorAll('.super-user-check:checked')).map(cb=>cb.value);
    if(!checked.length){ toast('Pick at least one super user'); return; }
    await saveSuperUsers(checked);
    toast('Super users updated');
  };

  const wipe = document.createElement('div');
  wipe.className = 'card pad';
  wipe.style.marginTop = '14px';
  wipe.innerHTML = `
    <div class="section-title">Storage</div>
    <p class="muted" style="font-size:13px;margin-top:-4px;line-height:1.5;">Job list data, cash taken, and job statuses are stored in a shared Firebase database, so any phone with this app open can see the same information. The office password is just a screen in this app, not real access control — anyone with the Firebase project details could still reach the data directly, so don't put anything highly sensitive in here.</p>
  `;
  main.appendChild(wipe);
}

/* ================= INIT ================= */
{
  const resumedWorker = restoreSession();
  if(resumedWorker) state = { screen:'worker', worker: resumedWorker };
}
render();
</script>
