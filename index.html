<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Workeriser</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#123a5e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workeriser">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef2f4;
    --surface:#ffffff;
    --ink:#10202f;
    --ink-soft:#516b7a;
    --navy:#123a5e;
    --navy-deep:#0a2540;
    --amber:#f0a202;
    --amber-deep:#c98600;
    --green:#1f8a54;
    --green-bg:#e5f4ec;
    --red:#c23b3b;
    --red-bg:#fbe9e9;
    --slate:#8fa1ac;
    --slate-bg:#eef1f2;
    --blue:#2f6fed;
    --blue-bg:#e8effd;
    --line:#dbe3e7;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,h3,.display{font-family:'Space Grotesk',system-ui,sans-serif;}
  button{font-family:inherit;}
  #app{max-width:560px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;transition:max-width .15s ease;}
  #app.admin-wide{max-width:1100px;}
  #app.admin-wide table.report{font-size:13.5px;}
  #app.admin-wide table.report th,#app.admin-wide table.report td{padding:7px 10px;}

  /* ---------- header ---------- */
  .topbar{
    background:linear-gradient(160deg,var(--navy-deep),var(--navy));
    color:#fff;
    padding:18px 20px 16px;
    position:sticky;top:0;z-index:20;
  }
  .topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{
    width:34px;height:34px;border-radius:9px;
    background:var(--amber);
    display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk';font-weight:700;color:var(--navy-deep);font-size:15px;
    flex:none;
  }
  .brand-text .t1{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#b9cbd8;font-weight:600;}
  .brand-text .t2{font-size:18px;font-weight:700;line-height:1.1;}
  .topbar-btn{
    background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);color:#fff;
    padding:7px 12px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;
  }
  .topbar-btn:active{background:rgba(255,255,255,.22);}
  .topbar-sub{margin-top:12px;display:flex;justify-content:space-between;align-items:baseline;color:#cfdce5;font-size:13px;}
  .topbar-sub b{color:#fff;font-weight:700;}

  /* ---------- generic ---------- */
  .main{flex:1;padding:18px 16px 100px;}
  .card{background:var(--surface);border-radius:var(--radius);box-shadow:0 1px 2px rgba(10,37,64,.06), 0 6px 18px rgba(10,37,64,.05);}
  .center-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;text-align:center;}
  .muted{color:var(--ink-soft);}
  .stack{display:flex;flex-direction:column;gap:12px;}

  /* ---------- login screen ---------- */
  .login-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;padding:32px 24px;}
  .login-hero{text-align:center;margin-bottom:34px;}
  .login-hero .glyph{
    width:64px;height:64px;border-radius:16px;margin:0 auto 16px;
    background:linear-gradient(160deg,var(--navy),var(--navy-deep));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 20px rgba(10,37,64,.25);
  }
  .login-hero h1{font-size:24px;margin:0 0 6px;color:var(--navy-deep);}
  .login-hero p{margin:0;color:var(--ink-soft);font-size:14px;}
  .worker-btn{
    display:flex;align-items:center;gap:14px;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 18px;cursor:pointer;text-align:left;width:100%;
    box-shadow:0 1px 2px rgba(10,37,64,.05);
  }
  .worker-btn:active{background:#f4f7f8;}
  .worker-avatar{
    width:42px;height:42px;border-radius:50%;flex:none;
    background:var(--amber);color:var(--navy-deep);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-family:'Space Grotesk';font-size:16px;
  }
  .worker-btn .name{font-weight:700;font-size:16px;}
  .worker-btn .sub{font-size:12.5px;color:var(--ink-soft);margin-top:1px;}
  .worker-btn .chev{margin-left:auto;color:var(--slate);}
  .admin-link{
    margin-top:26px;text-align:center;font-size:13px;color:var(--ink-soft);
    text-decoration:underline;cursor:pointer;
  }

  /* ---------- job list ---------- */
  .round-label{
    font-family:'Space Grotesk';font-size:12.5px;font-weight:700;letter-spacing:.04em;
    color:var(--navy);text-transform:uppercase;margin:22px 0 8px 2px;
    display:flex;align-items:center;gap:8px;
  }
  .round-label:first-child{margin-top:2px;}
  .round-label::after{content:"";flex:1;height:1px;background:var(--line);}

  .completed-divider{
    display:flex;align-items:center;gap:10px;
    margin:26px 0 14px;color:var(--slate);
  }
  .completed-divider::before,.completed-divider::after{content:"";flex:1;height:1px;background:var(--line);}
  .completed-divider span{
    font-family:'Space Grotesk';font-size:11px;font-weight:700;letter-spacing:.08em;
    text-transform:uppercase;color:var(--ink-soft);white-space:nowrap;
  }

  .job-card{
    padding:14px 14px 12px;margin-bottom:10px;position:relative;overflow:hidden;
    border:1px solid var(--line);
  }
  .job-card.status-done{border-color:#bfe3cd;background:var(--green-bg);}
  .job-card.status-skipped{border-color:#e6dab8;background:#fbf3e0;}
  .job-card.status-cancelled{border-color:#f0c9c9;background:var(--red-bg);opacity:.75;}
  .job-card.v-round{
    border:2px solid var(--blue) !important;
    padding-top:38px;
  }
  .v-round-banner{
    position:absolute;top:0;left:0;right:0;height:26px;
    background:var(--blue);color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;
  }
  .job-card.selectable{padding-left:44px;}
  .job-select-checkbox{
    position:absolute;top:16px;left:14px;width:20px;height:20px;z-index:5;accent-color:var(--navy);
  }

  .move-bar{
    background:var(--navy-deep);border-radius:var(--radius);
    padding:12px 14px;margin-bottom:16px;
    display:flex;flex-direction:column;gap:10px;
  }
  .move-bar-label{color:#cfdce5;font-size:12.5px;font-weight:600;}
  .move-bar-targets{display:flex;gap:8px;flex-wrap:wrap;}
  .move-target-btn{
    background:var(--amber);color:var(--navy-deep);border:none;border-radius:20px;
    padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer;
  }
  .move-target-btn:active{background:var(--amber-deep);color:#fff;}
  .move-target-btn:disabled{opacity:.6;}
  .undo-bar{background:var(--navy);}
  .move-dismiss-btn{background:rgba(255,255,255,.14);color:#fff;}
  .move-dismiss-btn:active{background:rgba(255,255,255,.24);}

  .job-top{display:flex;justify-content:space-between;gap:10px;}
  .job-info .addr{font-weight:700;font-size:15.5px;line-height:1.3;color:var(--ink);}
  .cust-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:3px;}
  .job-info .cust{font-size:13px;color:var(--ink-soft);}
  .phone-btn{
    display:inline-flex;align-items:center;gap:4px;
    color:var(--navy);text-decoration:none;font-size:12.5px;font-weight:700;
    background:var(--slate-bg);border-radius:20px;padding:2px 8px 2px 7px;
  }
  .phone-btn:active{background:var(--line);}
  .nav-btn{
    display:inline-flex;align-items:center;gap:4px;flex:none;width:fit-content;
    background:var(--navy);color:#fff;text-decoration:none;
    font-size:11px;font-weight:700;padding:3px 8px 3px 7px;border-radius:20px;
    white-space:nowrap;margin-top:7px;
  }
  .nav-btn:active{background:var(--navy-deep);}
  .job-info .notes{font-size:12.5px;color:var(--amber-deep);margin-top:6px;font-weight:600;}
  .job-card.status-cancelled .cust,.job-card.status-cancelled .addr{text-decoration:line-through;}

  .price-block{display:flex;align-items:center;gap:10px;flex:none;}
  .price-edit{display:flex;align-items:center;justify-content:flex-end;gap:2px;}
  .price-edit .pfx{font-family:'Space Grotesk';font-weight:700;font-size:19px;color:var(--navy-deep);}
  .price-input{
    width:80px;border:none;background:transparent;text-align:right;
    font-family:'Space Grotesk';font-weight:700;font-size:19px;color:var(--navy-deep);
    padding:2px 2px;border-bottom:1.5px dashed var(--line);
    -moz-appearance:textfield;
  }
  .price-input::-webkit-outer-spin-button,
  .price-input::-webkit-inner-spin-button{
    -webkit-appearance:none;margin:0;
  }
  .price-input:focus{outline:none;border-bottom-color:var(--navy);}
  .price-block .front{
    flex:none;width:46px;height:46px;
    display:flex;align-items:center;justify-content:center;
    background:#fff;color:var(--amber-deep);border:2px solid var(--amber-deep);border-radius:11px;
    font-size:13px;font-weight:800;letter-spacing:.02em;
    cursor:pointer;font-family:inherit;padding:2px;
  }
  .price-block .front.front-active{background:var(--amber-deep);color:#fff;}

  .job-controls{display:flex;gap:8px;margin-top:14px;}
  .status-btn{
    flex:1;padding:9px 4px;border-radius:9px;border:1.5px solid var(--line);
    background:#fff;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--ink-soft);
    display:flex;flex-direction:column;align-items:center;gap:2px;
  }
  .status-btn .ic{font-size:15px;}
  .status-btn.active-done{background:var(--green);border-color:var(--green);color:#fff;}
  .status-btn.active-skipped{background:var(--amber);border-color:var(--amber);color:#3a2a00;}
  .status-btn.active-cancelled{background:var(--red);border-color:var(--red);color:#fff;}
  .reject-btn{
    width:100%;margin-top:8px;background:transparent;border:1.5px dashed var(--red);
    color:var(--red);border-radius:9px;padding:7px 4px;font-size:12px;font-weight:600;
    cursor:pointer;font-family:inherit;
  }
  .reject-btn:active{background:var(--red-bg);}
  .reject-btn:disabled{opacity:.6;}

  .pay-row{display:flex;gap:10px;margin-top:12px;}
  .pay-field{flex:1;}
  .pay-field label{font-size:12.5px;color:var(--ink-soft);font-weight:600;display:block;margin-bottom:5px;}
  .pay-input-wrap{
    display:flex;align-items:center;gap:2px;
    border:1.5px solid var(--line);border-radius:9px;padding:8px 8px 8px 10px;background:#fbfcfd;
  }
  .pay-input-wrap .pfx{color:var(--ink-soft);}
  .pay-input-wrap:focus-within{outline:2px solid var(--navy);border-color:var(--navy);}
  .pay-input-wrap input{
    width:100%;border:none;background:transparent;font-size:15px;font-weight:600;font-family:'Inter';padding:0;
  }
  .pay-input-wrap input:focus{outline:none;}
  .balance-value{
    border:1.5px solid var(--line);border-radius:9px;padding:9px 10px;background:#fbfcfd;
    font-size:13.5px;
  }

  .note-field{margin-top:10px;}
  .note-field label{font-size:12.5px;color:var(--ink-soft);font-weight:600;display:block;margin-bottom:5px;}
  .note-field textarea{
    width:100%;border:1.5px solid var(--line);border-radius:9px;padding:8px 9px;
    font-size:13.5px;font-family:'Inter';background:#fbfcfd;resize:vertical;
  }
  .note-field textarea:focus{outline:2px solid var(--navy);border-color:var(--navy);}

  /* squeegee wipe */
  .wipe{
    position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(100deg,transparent 0%,rgba(255,255,255,.85) 45%,rgba(255,255,255,0) 60%);
    transform:translateX(-120%);
  }
  .wipe.play{animation:squeegee .55s ease-out;}
  @keyframes squeegee{ to{transform:translateX(120%);} }
  @media (prefers-reduced-motion: reduce){ .wipe.play{animation:none;} }

  /* ---------- summary bar / footer ---------- */
  .summary-bar{
    position:sticky;bottom:0;left:0;right:0;
    background:rgba(255,255,255,.92);backdrop-filter:blur(6px);
    border-top:1px solid var(--line);
    padding:10px 16px;display:flex;gap:10px;
  }
  .sum-pill{
    flex:1;text-align:center;padding:6px 4px;border-radius:9px;background:var(--slate-bg);
  }
  .sum-pill .n{font-family:'Space Grotesk';font-weight:700;font-size:16px;color:var(--navy-deep);}
  .sum-pill .l{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);}
  .finish-btn{
    flex:none;background:var(--amber);color:var(--navy-deep);border:none;border-radius:9px;
    font-weight:700;font-size:13px;padding:0 16px;cursor:pointer;
  }

  /* ---------- forms / admin ---------- */
  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:13px;font-weight:600;color:var(--ink-soft);}
  .field input,.field select{
    border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;font-size:15px;font-family:inherit;background:#fff;
  }
  .field input:focus,.field select:focus{outline:2px solid var(--navy);border-color:var(--navy);}
  .btn{
    border:none;border-radius:10px;padding:12px 16px;font-weight:700;font-size:14.5px;cursor:pointer;
  }
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-primary:active{background:var(--navy-deep);}
  .btn-amber{background:var(--amber);color:var(--navy-deep);}
  .btn-ghost{background:transparent;color:var(--navy);border:1.5px solid var(--line);}
  .btn-block{width:100%;}
  .tab-row{display:flex;gap:6px;margin-bottom:16px;background:var(--slate-bg);padding:4px;border-radius:11px;}
  .tab-btn{flex:1;border:none;background:transparent;padding:9px 4px;border-radius:8px;font-weight:700;font-size:12.5px;color:var(--ink-soft);cursor:pointer;}
  .tab-btn.active{background:#fff;color:var(--navy-deep);box-shadow:0 1px 3px rgba(10,37,64,.12);}
  .section-title{font-family:'Space Grotesk';font-weight:700;font-size:15px;margin:0 0 10px;color:var(--navy-deep);}
  .pad{padding:16px;}
  .note-box{background:var(--slate-bg);border-radius:10px;padding:12px 14px;font-size:12.5px;color:var(--ink-soft);line-height:1.5;}

  table.report{width:auto;min-width:100%;border-collapse:collapse;font-size:12.5px;}
  table.report th,table.report td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--line);}
  table.report th{font-size:10.5px;text-transform:uppercase;color:var(--ink-soft);letter-spacing:.03em;}
  table.report td.num{text-align:right;font-weight:600;}
  table.report th.num{text-align:right;}
  table.report .round-row{
    background:var(--slate-bg);color:var(--navy);font-weight:700;font-size:10.5px;
    text-transform:uppercase;letter-spacing:.03em;padding-top:9px;padding-bottom:6px;
  }
  .badge{display:inline-block;padding:2px 7px;border-radius:6px;font-size:11px;font-weight:700;}
  .badge-done{background:var(--green-bg);color:var(--green);}
  .badge-skipped{background:#fbf3e0;color:var(--amber-deep);}
  .badge-cancelled{background:var(--red-bg);color:var(--red);}
  .badge-todo{background:var(--slate-bg);color:var(--ink-soft);}
  .badge-front{background:var(--amber-deep);color:#fff;}
  .badge-new{background:var(--blue);color:#fff;}

  .toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
    background:var(--navy-deep);color:#fff;padding:11px 18px;border-radius:10px;font-size:13.5px;font-weight:600;
    box-shadow:0 8px 20px rgba(10,37,64,.3);z-index:100;opacity:0;transition:opacity .2s;pointer-events:none;
    max-width:90%;text-align:center;
  }
  .toast.show{opacity:1;}
  .back-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
  .back-row .back{cursor:pointer;color:var(--navy);font-weight:700;font-size:13px;}
  .empty-state{padding:40px 20px;text-align:center;color:var(--ink-soft);}
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* =========================================================================
   FIREBASE SETUP — fill this in so every phone shares the same data.
   1. Go to https://console.firebase.google.com, create a free project.
   2. In the project, click the </> (web app) icon to register a web app —
      it will show you a firebaseConfig object. Copy those values in below.
   3. In the left menu go to Databases & Storage > Firestore > Create database
      (choose the open/permissive starting rules option, not "Restrictive").
   4. Later, tighten the rules in Firestore > Rules to something like:
        rules_version = '2';
        service cloud.firestore {
          match /databases/{database}/documents {
            match /workeriser/{docId} { allow read, write: if true; }
          }
        }
      (This keeps it simple, no logins — same "not high security, just
      keeps casual browsers out" level as the office password.)
   ========================================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyABEfdCUcjsaHwpu78luEE25R9__jgg0Q4",
  authDomain: "workeriser.firebaseapp.com",
  projectId: "workeriser",
  storageBucket: "workeriser.firebasestorage.app",
  messagingSenderId: "5012320559",
  appId: "1:5012320559:web:047bc3931048a27cd171da"
};

const configOk = !!firebaseConfig.apiKey && !firebaseConfig.apiKey.startsWith('PASTE_');
let db = null;
if(configOk){
  try{
    const fbApp = initializeApp(firebaseConfig);
    db = getFirestore(fbApp);
  }catch(err){ console.error('Firebase init failed', err); }
}

async function fsGet(key){
  if(!db) return null;
  try{
    const snap = await getDoc(doc(db,'workeriser',key));
    return snap.exists() ? snap.data().value : null;
  }catch(err){
    console.error('fsGet failed', key, err);
    toast('Connection problem loading data');
    return null;
  }
}
async function fsSet(key, value){
  if(!db) return false;
  try{
    await setDoc(doc(db,'workeriser',key), { value, updatedAt: Date.now() });
    return true;
  }catch(err){
    console.error('fsSet failed', key, err);
    toast('Connection problem saving — try again');
    return false;
  }
}

/* ================= CONFIG / STORAGE ================= */
const WORKERS = ['Simon','Jim','Lily','Shane','Vlado'];
// Required whenever the office area hasn't had a custom password set for this
// shared database. Visible to anyone who views the page source — this is a
// "keep casual browsers out" lock, not real security.
const DEFAULT_ADMIN_PW = 'squeegee2026';

function todayStr(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function tomorrowStr(){
  const d = new Date();
  d.setDate(d.getDate()+1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

async function getPassword(){ const v = await fsGet('admin_pw'); return v || DEFAULT_ADMIN_PW; }
async function setPassword(p){ await fsSet('admin_pw', p); }

async function getMeta(){
  const m = await fsGet('meta');
  return m || { lastDate:{}, rounds:[] };
}
async function saveMeta(meta){ await fsSet('meta', meta); }

async function loadJobs(worker,date){ return await fsGet(`jobs_${worker}_${date}`); }
async function saveJobs(worker,date,jobs){
  await fsSet(`jobs_${worker}_${date}`, jobs);
  const meta = await getMeta();
  meta.lastDate[worker] = date;
  const key = `${worker}|${date}`;
  if(!meta.rounds.includes(key)) meta.rounds.push(key);
  await saveMeta(meta);
}
async function loadProgress(worker,date){ return (await fsGet(`progress_${worker}_${date}`)) || {}; }
async function saveProgress(worker,date,prog){ await fsSet(`progress_${worker}_${date}`, prog); }

async function findAnyDateForWorker(worker){
  const meta = await getMeta();
  return meta.lastDate[worker] || null;
}

// super users can select/move jobs between anyone's list and see them rejected back to them.
// stored as a list rather than hardcoded so it isn't tied to one specific person.
async function loadSuperUsers(){
  const list = await fsGet('super_users');
  return (list && list.length) ? list : ['Simon'];
}
async function saveSuperUsers(list){
  await fsSet('super_users', list);
}

// snapshots a worker's day before it's cleared, so historical reports survive
// even after their live working list has been reset
async function archiveBeforeClear(worker,date){
  const [jobs, prog] = await Promise.all([loadJobs(worker,date), loadProgress(worker,date)]);
  if(jobs && jobs.length){
    await fsSet(`report_${worker}_${date}`, { jobs, prog });
  }
}

// flips the visiting order for a whole day — last job becomes first and vice versa
async function reverseWorkOrder(worker,date){
  const jobs = await loadJobs(worker,date);
  if(!jobs || !jobs.length) return false;
  const reversed = jobs.slice().sort((a,b)=>a.order-b.order).reverse();
  reversed.forEach((j,idx)=>{ j.order = idx; });
  await saveJobs(worker,date,reversed);
  return true;
}

// reads data for reporting: prefers an archived snapshot (taken at Clear time) over
// live data, so a cleared day's report still reflects what actually happened that day
async function loadForReport(worker,date){
  const snap = await fsGet(`report_${worker}_${date}`);
  if(snap) return snap;
  const [jobs, prog] = await Promise.all([loadJobs(worker,date), loadProgress(worker,date)]);
  return { jobs, prog };
}

// moves a set of jobs (by id) from one worker's round to another's, for the same date,
// carrying over any progress (payment/price/note) already recorded against them
async function moveJobsToWorker(fromWorker, toWorker, date, jobIds){
  const [fromJobs, fromProg, toJobsRaw, toProgRaw, lookup] = await Promise.all([
    loadJobs(fromWorker,date),
    loadProgress(fromWorker,date),
    loadJobs(toWorker,date),
    loadProgress(toWorker,date),
    loadCoordLookup()
  ]);
  const idSet = new Set(jobIds);
  const source = fromJobs || [];
  const moving = source.filter(j=>idSet.has(j.id));
  const remaining = source.filter(j=>!idSet.has(j.id));
  const toJobs = toJobsRaw || [];
  const toProg = toProgRaw || {};
  moving.forEach(j=>{
    j.lastAssignedBy = fromWorker;
    toJobs.push(j);
    if(fromProg[j.id]){
      toProg[j.id] = fromProg[j.id];
      delete fromProg[j.id];
    }
  });
  // reinsert into round order where possible (falls back to append-at-end if no round order is on file)
  const roundOrder = lookup.roundOrder || [];
  function roundRank(roundName){
    const idx = roundOrder.indexOf(roundName);
    return idx === -1 ? Infinity : idx;
  }
  toJobs.sort((a,b)=> roundRank(a.round) - roundRank(b.round));
  toJobs.forEach((j,idx)=>{ j.order = idx; });
  await Promise.all([
    saveJobs(fromWorker, date, remaining),
    saveJobs(toWorker, date, toJobs),
    saveProgress(fromWorker, date, fromProg),
    saveProgress(toWorker, date, toProg)
  ]);
}

/* ================= CSV PARSING ================= */
function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c === '\r'){ /* skip */ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  if(!rows.length) return [];
  const headers = rows[0].map(h=>h.trim());
  return rows.slice(1).filter(r=>r.length>1 || r[0] !== '').map(r=>{
    const obj = {};
    headers.forEach((h,idx)=>{ obj[h] = (r[idx] !== undefined ? r[idx] : '').trim(); });
    return obj;
  });
}

function pick(row, candidates){
  for(const c of candidates){
    if(row[c] !== undefined && String(row[c]).trim() !== '') return row[c];
  }
  return '';
}

function rowsToJobs(rows){
  return rows.map((r,idx)=>{
    const price = parseFloat(pick(r,['Price'])) || 0;
    const balance = parseFloat(pick(r,['Balance'])) || 0;
    const frontPrice = Math.ceil(price/2 + 1);
    const lat = parseFloat(pick(r,['Job Latitude','Customer Latitude']));
    const lon = parseFloat(pick(r,['Job Longitude','Customer Longitude']));
    const address = pick(r,['Job Address','Customer Address','Address']);
    const postcode = pick(r,['Job Postcode','Customer Postcode']);
    const phone = pick(r,['Job Phone 1','Customer Phone 1','Phone 1']);
    const csvStatus = (pick(r,['Status']) || '').trim().toLowerCase();
    return {
      id: pick(r,['Aworka Job ID','Aworka ID','Job Ref']) || ('row'+idx),
      order: idx,
      customer: (pick(r,['Customer Name','Customer']) || '').trim() || '(no name on file)',
      address: address,
      postcode: postcode,
      phone: phone,
      lat: isFinite(lat) ? lat : null,
      lon: isFinite(lon) ? lon : null,
      round: pick(r,['Round']) || '',
      price: price,
      frontPrice: frontPrice,
      balance: balance,
      notes: pick(r,['Job Day Notes','Notes','Description','Job Notes']),
      timeRequired: pick(r,['Time Required']),
      frequency: pick(r,['Frequency']),
      initialStatus: csvStatus === 'skip' ? 'skipped' : null
    };
  });
}

function navUrl(job){
  if(job.lat != null && job.lon != null){
    return `https://www.google.com/maps/dir/?api=1&destination=${job.lat},${job.lon}`;
  }
  const q = [job.address, job.postcode].filter(Boolean).join(', ');
  return `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(q)}`;
}

// rounds ending in a standalone "v" (e.g. "R) Ryhill 12 v") need a different completion
// slip through the door — flagged visually on the job card regardless of who it's assigned to
function isVRound(round){
  if(!round) return false;
  const parts = round.trim().split(/\s+/);
  return parts.length > 0 && parts[parts.length-1].toLowerCase() === 'v';
}

/* ---- coordinate reference lookup (address -> lat/lon), updated occasionally ---- */
async function loadCoordLookup(){ return (await fsGet('coord_lookup')) || { updatedAt:null, addresses:{}, roundOrder:[], addressOrder:{} }; }
async function saveCoordLookup(lookup){ await fsSet('coord_lookup', lookup); }

function normAddr(a){
  return (a||'').toLowerCase().replace(/[^a-z0-9, ]/g,'').replace(/\s+/g,' ').trim();
}

function buildCoordAddresses(rows){
  const addresses = {};
  rows.forEach(r=>{
    const addr = pick(r,['Job Address','Customer Address','Address']);
    const lat = parseFloat(pick(r,['Job Latitude','Customer Latitude']));
    const lon = parseFloat(pick(r,['Job Longitude','Customer Longitude']));
    const n = normAddr(addr);
    if(n && isFinite(lat) && isFinite(lon)){
      addresses[n] = { lat, lon, raw: addr };
    }
  });
  return addresses;
}

// the order rounds first appear in the reference CSV is treated as the canonical round sequence
function buildRoundOrder(rows){
  const order = [];
  const seen = new Set();
  rows.forEach(r=>{
    const round = pick(r,['Round']);
    if(round && !seen.has(round)){
      seen.add(round);
      order.push(round);
    }
  });
  return order;
}

// the reference CSV is exported in true visiting order (round, then position within round) —
// capturing each address's row position lets us match Aworka's actual sequence exactly,
// not just which round comes before which
function buildAddressOrder(rows){
  const order = {};
  rows.forEach((r,idx)=>{
    const addr = pick(r,['Job Address','Customer Address','Address']);
    const n = normAddr(addr);
    if(n && !(n in order)) order[n] = idx;
  });
  return order;
}

function findAddressRank(address, addressOrder){
  const n = normAddr(address);
  if(!n) return null;
  if(addressOrder[n] !== undefined) return addressOrder[n];
  let best = null, bestLen = 0;
  for(const key in addressOrder){
    if((key.includes(n) || n.includes(key)) && key.length > bestLen){
      best = addressOrder[key];
      bestLen = key.length;
    }
  }
  return best;
}

function findCoordsForAddress(address, lookup){
  const n = normAddr(address);
  if(!n) return null;
  if(lookup.addresses[n]) return lookup.addresses[n];
  let best = null, bestLen = 0;
  for(const key in lookup.addresses){
    if((key.includes(n) || n.includes(key)) && key.length > bestLen){
      best = lookup.addresses[key];
      bestLen = key.length;
    }
  }
  return best;
}

// fills in missing coordinates on a set of jobs from the stored lookup; returns list of addresses still missing
async function resolveCoordinates(jobs){
  const lookup = await loadCoordLookup();
  const missing = [];
  jobs.forEach(job=>{
    if(job.lat == null || job.lon == null){
      const found = findCoordsForAddress(job.address, lookup);
      if(found){ job.lat = found.lat; job.lon = found.lon; }
    }
    if(job.lat == null || job.lon == null){
      missing.push(job.address || job.customer);
    }
  });
  return missing;
}

// after a fresh coordinate reference is uploaded, retroactively fill in any already-loaded rounds
async function rescanAllRoundsForCoords(){
  const lookup = await loadCoordLookup();
  const meta = await getMeta();
  let fixed = 0, stillMissing = 0;
  for(const key of meta.rounds){
    const [worker,date] = key.split('|');
    const jobs = await fsGet(`jobs_${worker}_${date}`);
    if(!jobs) continue;
    let changed = false;
    jobs.forEach(job=>{
      if(job.lat == null || job.lon == null){
        const found = findCoordsForAddress(job.address, lookup);
        if(found){ job.lat = found.lat; job.lon = found.lon; changed = true; fixed++; }
        else stillMissing++;
      }
    });
    if(changed) await fsSet(`jobs_${worker}_${date}`, jobs);
  }
  return { fixed, stillMissing };
}



/* ================= APP STATE ================= */
let state = { screen:'login' };
const app = document.getElementById('app');

// Delays a job card's move into/out of the Completed section for 5s after the
// last interaction with that card, so cash/price/note edits can still happen
// without the card jumping away underneath the user.
const cardTimers = new Map();
function scheduleReflow(jobId, worker, date){
  if(cardTimers.has(jobId)) clearTimeout(cardTimers.get(jobId));
  const t = setTimeout(()=>{
    cardTimers.delete(jobId);
    if(state.screen==='worker' && state.worker===worker && state.date===date){
      render();
    }
  }, 5000);
  cardTimers.set(jobId, t);
}

function go(screen, extra){ state = Object.assign({screen}, extra); render(); saveSession(); }

// Mobile browsers frequently unload a backgrounded tab/PWA from memory (e.g. when
// switching to the Phone or WhatsApp) and silently reload it on return, wiping the
// in-memory `state`. Persisting just who's logged in — not the date — lets the app
// quietly resume the right person without them having to reselect, while still
// defaulting to *today* the normal way. Restricted to the worker screen only, so a
// reload can never resume straight into the password-protected admin area.
const SESSION_KEY = 'wjt_session';
const SESSION_MAX_AGE_MS = 8 * 60 * 60 * 1000; // 8 hours — same shift, not the next day
function saveSession(){
  try{
    if(state.screen === 'worker' && state.worker){
      localStorage.setItem(SESSION_KEY, JSON.stringify({ worker: state.worker, savedAt: Date.now() }));
    } else if(state.screen === 'login'){
      localStorage.removeItem(SESSION_KEY);
    }
  }catch(e){ /* localStorage unavailable — fail silently, normal login still works */ }
}
function restoreSession(){
  try{
    const raw = localStorage.getItem(SESSION_KEY);
    if(!raw) return null;
    const saved = JSON.parse(raw);
    const age = Date.now() - (saved.savedAt || 0);
    if(saved.worker && age >= 0 && age < SESSION_MAX_AGE_MS) return saved.worker;
  }catch(e){}
  return null;
}

// If the page was just paused (not reloaded) while backgrounded, JS state survives
// but the data on screen could be stale by the time the user comes back — refresh
// immediately rather than waiting for the next background poll.
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible' && (state.screen === 'worker' || state.screen === 'admin')){
    render();
  }
});

// Quietly checks every 15s for jobs added/removed by someone else (e.g. Simon
// sending or reclaiming jobs) while a worker is sitting on their own list, and
// refreshes automatically if anything's changed — no manual refresh needed.
let workerPollTimer = null;
function jobIdsKey(jobs){ return (jobs||[]).map(j=>j.id).sort().join(','); }
function startWorkerPoll(worker, date, currentJobs){
  if(workerPollTimer) clearInterval(workerPollTimer);
  const knownKey = jobIdsKey(currentJobs);
  workerPollTimer = setInterval(async ()=>{
    if(state.screen!=='worker' || state.worker!==worker || state.date!==date){
      clearInterval(workerPollTimer);
      return;
    }
    const freshJobs = await loadJobs(worker,date);
    if(jobIdsKey(freshJobs) !== knownKey){
      render();
    }
  }, 15000);
}

function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(()=>t.classList.add('show'));
  setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(),250); }, 1900);
}

function money(n){
  const v = Math.round((n + Number.EPSILON)*100)/100;
  const sign = v < 0 ? '-' : '';
  return sign + '£' + Math.abs(v).toFixed(2);
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}

function resolvedPrice(job, p){
  return (p && p.price !== undefined && p.price !== '' && !isNaN(parseFloat(p.price))) ? parseFloat(p.price) : job.price;
}

// skipped/cancelled jobs weren't actually cleaned, so no charge applies for the day
function chargeForStatus(price, status){
  return (status==='skipped' || status==='cancelled') ? 0 : price;
}

// sorts jobs by the canonical round order (from the round-order reference file), falling
// back to each job's own stored order within a round, or to the end if the round isn't
// recognised at all — used to keep reports consistent even if a list's stored order has
// drifted (e.g. after Reverse, or jobs moved in from elsewhere)
// combines exact address position (Aworka's true visiting order, from the reference file)
// with a round-grouped fallback for anything that isn't matched (e.g. brand new customers)
function roundOrderRank(job, lookup){
  const addrRank = findAddressRank(job.address, lookup.addressOrder || {});
  if(addrRank !== null) return addrRank;
  const roundOrder = lookup.roundOrder || [];
  const rIdx = roundOrder.indexOf(job.round);
  const rRank = rIdx === -1 ? Infinity : rIdx;
  return rRank === Infinity ? Infinity : (rRank * 100000 + (job.order || 0));
}

function sortJobsByRoundOrder(jobs, lookup){
  return jobs.slice().sort((a,b)=> roundOrderRank(a,lookup) - roundOrderRank(b,lookup));
}

// report-table cell for what was actually charged today, flagging front-only prices
function chargedCell(r){
  if(r.status === 'todo') return `<td class="num">-</td>`;
  const charged = chargeForStatus(r.price, r.status);
  const isFront = charged > 0.004 && !!r.frontApplied;
  const isAltered = !isFront && charged > 0.004 && Math.abs(charged - r.job.price) > 0.005;
  const style = isAltered ? ` style="color:var(--blue);font-weight:700;"` : '';
  return `<td class="num"${style}>${isFront ? '<span class="badge badge-front">F</span> ' : ''}${money(charged)}</td>`;
}

// report-table cell for cash paid — red draws the eye to unpaid jobs, green confirms cash in hand
function paidCell(r){
  if(r.status === 'todo') return `<td class="num">-</td>`;
  const paid = r.payment;
  const color = paid > 0.004 ? 'var(--green)' : 'var(--red)';
  return `<td class="num"><b style="color:${color}">${money(paid)}</b></td>`;
}

// report-table cell for the running balance after today — muted, since Paid is the main signal here
function balanceCell(r){
  if(r.status === 'todo') return `<td class="num">-</td>`;
  const bal = r.owedAfter;
  const color = bal > 0.004 ? '#a97b7b' : '#7a9c8c';
  const val = bal > 0.004 ? bal : (bal < -0.004 ? -bal : 0);
  return `<td class="num" style="color:${color}">${money(val)}</td>`;
}

// like chargedCell, but shows the standard price for to-do jobs instead of dashing them out
function priceCell(r){
  if(r.status === 'todo') return `<td class="num">${money(r.price)}</td>`;
  return chargedCell(r);
}

// compact tick/blank cash indicator, used where a full amount would take too much space
function cashCell(r){
  const paid = r.payment > 0.004;
  return `<td class="num" style="text-align:center;">${paid ? '<span style="color:var(--green);font-weight:800;">✓</span>' : ''}</td>`;
}

// what they currently owe overall — includes today's price only if the job was actually
// done today; skipped/cancelled/to-do jobs don't add today's charge to the balance
function currentBalanceCell(r){
  const debt = -r.job.balance;
  const chargeToday = r.status === 'done' ? r.price : 0;
  const bal = debt + chargeToday - r.payment;
  const color = bal > 0.004 ? '#a97b7b' : '#7a9c8c';
  const val = bal > 0.004 ? bal : (bal < -0.004 ? -bal : 0);
  return `<td class="num" style="color:${color}">${money(val)}</td>`;
}

function statusLabel(status){
  return status === 'todo' ? 'Not done' : status;
}

// shared "new customers to add to Aworka" summary, used across all report views
function renderNewCustomerSection(rows, useToDoLabel){
  const newRows = rows.filter(r => r.job.isNewCustomer);
  if(!newRows.length) return '';
  return `
    <div class="card pad" style="margin-top:14px;border:1.5px solid var(--blue);">
      <div class="section-title" style="color:var(--blue);">New customers</div>
      ${newRows.map(r=>{
        const j = r.job;
        const name = [j.title, j.firstName, j.lastName].filter(Boolean).join(' ') || '(name not given)';
        const payMethods = [j.gocardless ? 'Gocardless' : '', j.invoice ? 'Invoice' : ''].filter(Boolean).join(', ');
        const label = (useToDoLabel && r.status==='todo') ? 'To do' : statusLabel(r.status);
        return `
          <div style="padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.6;">
            <b>${escapeHtml(name)}</b>${r.worker ? ` <span class="muted">(${escapeHtml(r.worker)})</span>` : ''} — ${escapeHtml(j.address)}<br>
            Price: ${money(j.price)} · Frequency: ${escapeHtml(j.frequency||'—')} · Status: ${label}<br>
            ${j.email ? `Email: ${escapeHtml(j.email)}<br>` : ''}
            ${j.phone ? `Phone: ${escapeHtml(j.phone)}${j.needsGateText ? ' (requires txt night before)' : ''}<br>` : (j.needsGateText ? `Requires txt night before — no phone given<br>` : '')}
            ${payMethods ? `Payment: ${payMethods}<br>` : ''}
            ${j.notes ? `Notes: ${escapeHtml(j.notes)}` : ''}
          </div>
        `;
      }).join('')}
    </div>
  `;
}

  if(!sameScreen){
    app.innerHTML = '<div class="center-screen"><p class="muted">Loading…</p></div>';

  if(sameScreen) window.scrollTo(0, savedScroll);
}

    if(collectedStat) collectedStat.textContent = money(collected);
    const leftEl = bar.querySelector('#leftStatN');
    if(leftEl) leftEl.textContent = remaining;
    const collEl = bar.querySelector('#collectedStatN');
    if(collEl) collEl.textContent = money(collected);
  }

  const sorted = jobs.slice().sort((a,b)=>a.order-b.order);
  const todoJobs = sorted.filter(j=> !prog[j.id] || prog[j.id].status==='todo');
  const completedJobs = sorted.filter(j=> prog[j.id] && prog[j.id].status!=='todo');

  function renderGroup(list, onCard){
    let lastRound = null;
    list.forEach(job=>{
      if(job.round && job.round !== lastRound){
        const rl = document.createElement('div');
        rl.className = 'round-label';
        rl.textContent = job.round;
        main.appendChild(rl);
        lastRound = job.round;
      }
      const card = renderJobCard(worker,date,job,prog,refreshStats,isSuper);
      main.appendChild(card);
      if(onCard) onCard(job, card);
    });
  }

  const todoCardMap = new Map();
  renderGroup(todoJobs, (job,card)=>{ todoCardMap.set(job.id, card); });

  if(completedJobs.length){
    const divider = document.createElement('div');
    divider.className = 'completed-divider';
    divider.innerHTML = `<span>Completed</span>`;
    main.appendChild(divider);
    renderGroup(completedJobs);
  }

  // footer summary / finish
  bar.className = 'summary-bar';
  const doneCount = jobs.filter(j=>prog[j.id] && prog[j.id].status==='done').length;
  const collected = jobs.reduce((s,j)=> s + (prog[j.id]?.payment ? parseFloat(prog[j.id].payment)||0 : 0), 0);
  const remaining = jobs.length - jobs.filter(j=>prog[j.id] && prog[j.id].status!=='todo').length;
  bar.innerHTML = `
    <div class="sum-pill"><div class="n" id="leftStatN">${remaining}</div><div class="l">Left</div></div>
    <div class="sum-pill"><div class="n" id="collectedStatN">${money(collected)}</div><div class="l">Collected</div></div>
    <button class="finish-btn" id="finishBtn">Day summary</button>
  `;
  app.appendChild(bar);
  bar.querySelector('#finishBtn').onclick = ()=> go('daySummary',{worker,date});

  const selectBtn = header.querySelector('#selectBtn');
  if(selectBtn){
    let selectMode = false;
    const selectedIds = new Set();

    function renderMoveBar(){
      const existing = moveBarContainer.querySelector('.move-bar.select-bar');
      if(existing) existing.remove();
      if(!selectMode || selectedIds.size===0) return;
      const others = WORKERS.filter(w=>w!==worker);
      const mb = document.createElement('div');
      mb.className = 'move-bar select-bar';
      mb.innerHTML = `
        <div class="move-bar-label">${selectedIds.size} selected — send to</div>
        <div class="move-bar-targets">
          ${others.map(w=>`<button type="button" class="move-target-btn" data-target="${escapeHtml(w)}">${escapeHtml(w)}</button>`).join('')}
        </div>
      `;
      moveBarContainer.appendChild(mb);
      mb.querySelectorAll('.move-target-btn').forEach(btn=>{
        btn.onclick = async ()=>{
          const target = btn.dataset.target;
          const ids = Array.from(selectedIds);
          btn.disabled = true;
          await moveJobsToWorker(worker, target, date, ids);
          toast(`Moved ${ids.length} job${ids.length===1?'':'s'} to ${target}`);
          state.lastMove = { from:worker, to:target, date, ids };
          render();
        };
      });
    }

    function setSelectMode(on, initialIds){
      selectMode = on;
      selectBtn.textContent = selectMode ? 'Cancel' : 'Select';
      selectedIds.clear();
      todoCardMap.forEach((card,jobId)=>{
        let cb = card.querySelector('.job-select-checkbox');
        if(selectMode){
          card.classList.add('selectable');
          if(!cb){
            cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.className = 'job-select-checkbox';
            cb.addEventListener('change', ()=>{
              if(cb.checked) selectedIds.add(jobId); else selectedIds.delete(jobId);
              renderMoveBar();
            });
            card.appendChild(cb);
          }
          const shouldCheck = !!(initialIds && initialIds.includes(jobId));
          cb.checked = shouldCheck;
          if(shouldCheck) selectedIds.add(jobId);
        } else {
          card.classList.remove('selectable');
          if(cb) cb.remove();
        }
      });
      renderMoveBar();
    }

    selectBtn.onclick = ()=> setSelectMode(!selectMode);

    // show an Undo banner for the most recent move Simon made from this list
    if(state.lastMove && state.lastMove.from===worker && state.lastMove.date===date){
      const { to, ids } = state.lastMove;
      const banner = document.createElement('div');
      banner.className = 'move-bar undo-bar';
      banner.innerHTML = `
        <div class="move-bar-label">Moved ${ids.length} job${ids.length===1?'':'s'} to ${escapeHtml(to)}</div>
        <div class="move-bar-targets">
          <button type="button" class="move-target-btn" id="undoMoveBtn">Undo</button>
          <button type="button" class="move-target-btn move-dismiss-btn" id="dismissMoveBtn">Dismiss</button>
        </div>
      `;
      moveBarContainer.appendChild(banner);
      banner.querySelector('#undoMoveBtn').onclick = async ()=>{
        banner.remove();
        await moveJobsToWorker(to, worker, date, ids);
        toast(`Brought back ${ids.length} job${ids.length===1?'':'s'}`);
        state.pendingSelection = ids;
        delete state.lastMove;
        render();
      };
      banner.querySelector('#dismissMoveBtn').onclick = ()=>{
        delete state.lastMove;
        banner.remove();
      };
    }

    // if we just undid a move, re-enter select mode with those jobs pre-checked
    if(state.pendingSelection){
      const ids = state.pendingSelection;
      delete state.pendingSelection;
      setSelectMode(true, ids);
    }
  }

  refreshStats();
  startWorkerPoll(worker, date, jobs);
}

function renderJobCard(worker,date,job,prog,refreshStats,isSuper){
  const p = prog[job.id] || { status:'todo', payment:'', price:'', note:'', frontApplied:false };
  const card = document.createElement('div');
  const vRound = isVRound(job.round);
  card.className = `card job-card status-${p.status}${vRound ? ' v-round' : ''}`;

  const debt = -job.balance; // positive = customer owes
  const priceVal = (p.price !== undefined && p.price !== '' && !isNaN(parseFloat(p.price))) ? p.price : job.price;
  const telHref = job.phone ? `tel:${job.phone.replace(/[^0-9+]/g,'')}` : '';

  card.innerHTML = `
    <div class="wipe"></div>
    ${vRound ? `<div class="v-round-banner">Vlado</div>` : ''}
    <div class="job-top">
      <div class="job-info">
        <div class="addr">${job.isNewCustomer ? '<span class="badge badge-new">NEW</span> ' : ''}${escapeHtml(job.address)}</div>
        <div class="cust-row">
          <span class="cust">${escapeHtml(job.customer)}</span>
          ${job.phone ? `<a class="phone-btn" href="${telHref}">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none"><path d="M6 3h3l2 5-2.5 1.5a11 11 0 005 5L15 12l5 2v3a2 2 0 01-2 2A16 16 0 014 6a2 2 0 012-2z" fill="currentColor"/></svg>
            ${escapeHtml(job.phone)}
          </a>` : ''}
        </div>
        <a class="nav-btn" href="${navUrl(job)}" target="_blank" rel="noopener">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M3 11l17-8-8 17-2-7-7-2z" fill="currentColor"/></svg>
          Navigate
        </a>
        ${job.notes ? `<div class="notes">⚠ ${escapeHtml(job.notes)}</div>` : ''}
      </div>
      <div class="price-block">
        <button type="button" class="front" title="Tap to charge the front price instead"><span style="font-size:16px;">FO</span></button>
        <div class="price-edit"><span class="pfx">£</span><input type="number" class="price-input" inputmode="decimal" min="0" step="0.01" value="${parseFloat(priceVal).toFixed(2)}"></div>
      </div>
    </div>
    <div class="job-controls">
      <button class="status-btn ${p.status==='done'?'active-done':''}" data-action="done"><span class="ic">✓</span>Done</button>
      <button class="status-btn ${p.status==='skipped'?'active-skipped':''}" data-action="skipped"><span class="ic">↷</span>Skipped</button>
      <button class="status-btn ${p.status==='cancelled'?'active-cancelled':''}" data-action="cancelled"><span class="ic">✕</span>Cancelled</button>
    </div>
    <div class="pay-row">
      <div class="pay-field">
        <label>Cash paid</label>
        <div class="pay-input-wrap"><span class="pfx">£</span><input type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" value="${p.payment || ''}" class="pay-input"></div>
      </div>
      <div class="pay-field">
        <label>Today's balance</label>
        <div class="balance-value"></div>
      </div>
    </div>
    <div class="note-field">
      <label>Job note</label>
      <textarea rows="2">${escapeHtml(p.note || '')}</textarea>
    </div>
    ${job.isNewCustomer ? `
    <div style="display:flex;gap:8px;margin-top:8px;">
      <button type="button" class="nc-edit-btn" style="flex:1;background:transparent;border:1.5px dashed var(--blue);color:var(--blue);border-radius:9px;padding:7px 4px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;">Edit</button>
      <button type="button" class="nc-delete-btn" style="flex:1;background:transparent;border:1.5px dashed var(--red);color:var(--red);border-radius:9px;padding:7px 4px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;">Delete</button>
    </div>` : ''}
    ${!isSuper && p.status==='todo' ? `<button type="button" class="reject-btn">Reject</button>` : ''}
  `;

  const priceInput = card.querySelector('.price-input');
  const payInput = card.querySelector('.pay-input');
  let currentStatus = p.status;

  function currentPrice(){ return parseFloat(priceInput.value) || 0; }

  function updateOwedAfter(){
    const payment = parseFloat(payInput.value) || 0;
    const chargeToday = (currentStatus==='skipped' || currentStatus==='cancelled') ? 0 : currentPrice();
    const owedAfter = debt + chargeToday - payment;
    const el = card.querySelector('.balance-value');
    if(owedAfter > 0.004) el.innerHTML = `<b style="color:var(--red)">${money(owedAfter)}</b>`;
    else if(owedAfter < -0.004) el.innerHTML = `<b style="color:var(--green)">${money(-owedAfter)}</b>`;
    else el.innerHTML = `<b style="color:var(--green)">£0.00</b>`;
  }
  updateOwedAfter();

  async function persist(mutator){
    const current = prog[job.id] ? Object.assign({}, prog[job.id]) : {status:'todo',payment:'',price:'',note:'',frontApplied:false};
    mutator(current);
    prog[job.id] = current;
    await saveProgress(worker,date,prog);
  }

  card.querySelectorAll('.status-btn').forEach(btn=>{
    btn.onclick = async ()=>{
      const action = btn.dataset.action;
      let newStatus;
      await persist(current=>{
        newStatus = current.status === action ? 'todo' : action;
        current.status = newStatus;
      });
      currentStatus = newStatus;
      card.className = `card job-card status-${newStatus}${vRound ? ' v-round' : ''}`;
      card.querySelectorAll('.status-btn').forEach(b=>b.classList.remove('active-done','active-skipped','active-cancelled'));
      if(newStatus !== 'todo') btn.classList.add(`active-${newStatus}`);
      if(action==='done' && newStatus==='done'){
        const wipe = card.querySelector('.wipe');
        wipe.classList.add('play');
      }
      updateOwedAfter();
      if(refreshStats) refreshStats();
      scheduleReflow(job.id, worker, date);
    };
  });

  const rejectBtn = card.querySelector('.reject-btn');
  if(rejectBtn){
    rejectBtn.onclick = async ()=>{
      rejectBtn.disabled = true;
      rejectBtn.textContent = 'Sending…';
      let target = job.lastAssignedBy;
      if(!target){
        const superUsers = await loadSuperUsers();
        target = superUsers[0] || 'Simon';
      }
      await moveJobsToWorker(worker, target, date, [job.id]);
      toast(`Sent back to ${target}`);
      render();
    };
  }

  const ncEditBtn = card.querySelector('.nc-edit-btn');
  if(ncEditBtn){
    ncEditBtn.onclick = ()=> go('newCustomer', {worker, date, fromScreen:'worker', editJobId: job.id});
  }
  const ncDeleteBtn = card.querySelector('.nc-delete-btn');
  if(ncDeleteBtn){
    ncDeleteBtn.onclick = async ()=>{
      if(!confirm(`Delete this new customer entry (${job.address})? This can't be undone.`)) return;
      ncDeleteBtn.disabled = true;
      ncDeleteBtn.textContent = 'Deleting…';
      await deleteNewCustomerJob(worker, date, job.id);
      toast('New customer deleted');
      render();
    };
  }

  let frontApplied = !!p.frontApplied;

  function updateFrontButton(){
    const btn = card.querySelector('.front');
    btn.innerHTML = frontApplied ? 'ALL' : '<span style="font-size:16px;">FO</span>';
    btn.classList.toggle('front-active', frontApplied);
    btn.title = frontApplied ? 'Tap to charge for all the house windows instead' : 'Tap to charge the front-only price instead';
  }
  updateFrontButton();

  priceInput.addEventListener('input', ()=>{
    updateOwedAfter();
    frontApplied = false;
    updateFrontButton();
    persist(current=>{ current.price = priceInput.value; current.frontApplied = false; });
    scheduleReflow(job.id, worker, date);
  });
  priceInput.addEventListener('blur', ()=>{
    if(priceInput.value !== ''){
      priceInput.value = currentPrice().toFixed(2);
      updateOwedAfter();
      persist(current=>{ current.price = priceInput.value; });
      scheduleReflow(job.id, worker, date);
    }
  });

  card.querySelector('.front').onclick = ()=>{
    frontApplied = !frontApplied;
    priceInput.value = (frontApplied ? job.frontPrice : job.price).toFixed(2);
    updateOwedAfter();
    updateFrontButton();
    persist(current=>{ current.price = priceInput.value; current.frontApplied = frontApplied; });
    scheduleReflow(job.id, worker, date);
  };

  payInput.addEventListener('input', ()=>{
    updateOwedAfter();
    persist(current=>{ current.payment = payInput.value; });
    if(refreshStats) refreshStats();
    scheduleReflow(job.id, worker, date);
  });

  card.querySelector('.note-field textarea').addEventListener('input', (e)=>{
    persist(current=>{ current.note = e.target.value; });
    scheduleReflow(job.id, worker, date);
  });

  return card;
}

async function renderNewCustomer(){
  const { worker, date } = state;
  const fromScreen = state.fromScreen || 'worker';
  const editJobId = state.editJobId || null;
  app.innerHTML = '';

  const header = document.createElement('div');
  header.className = 'topbar';
  header.innerHTML = `<div class="topbar-row">
      <div class="brand"><div class="brand-mark">+</div>
      <div class="brand-text"><div class="t1">${escapeHtml(worker)} · ${date}</div><div class="t2">${editJobId ? 'Edit new customer' : 'New customer'}</div></div></div>
      <button class="topbar-btn" id="backBtn">Cancel</button>
    </div>`;
  app.appendChild(header);
  header.querySelector('#backBtn').onclick = ()=> go(fromScreen, {worker, date});

  const main = document.createElement('div');
  main.className = 'main';
  app.appendChild(main);

  const existingJobs = (await loadJobs(worker, date)) || [];
  const editingJob = editJobId ? existingJobs.find(j=>j.id===editJobId) : null;

  // work out a sensible round default from the next job still to do (only for new entries)
  let suggestedRound = editingJob ? editingJob.round : '';
  if(!editingJob){
    const sorted = existingJobs.slice().sort((a,b)=>a.order-b.order);
    const existingProg = await loadProgress(worker, date);
    const nextTodo = sorted.find(j => !existingProg[j.id] || existingProg[j.id].status==='todo');
    suggestedRound = (nextTodo && nextTodo.round) || (sorted.length ? sorted[sorted.length-1].round : '') || '';
  }

  const card = document.createElement('div');
  card.className = 'card pad';
  card.innerHTML = `
    <div class="section-title">${editJobId ? 'Edit new customer' : 'New customer'}</div>
    <p class="muted" style="font-size:12.5px;margin-top:-4px;line-height:1.5;">This adds a job to today's list. Mark it Done/Skipped and take payment the same way as any other job after you have done here.</p>
    <div class="stack" style="margin-top:12px;">
      <div class="field"><label>Address *</label><input type="text" id="ncAddress" placeholder="e.g. 12 Example Street, Town" value="${editingJob ? escapeHtml(editingJob.address) : ''}"></div>
      <div class="field"><label>Price *</label><input type="number" id="ncPrice" inputmode="decimal" min="0" step="0.01" placeholder="0.00" value="${editingJob ? editingJob.price : ''}"></div>
      <div class="field"><label>Frequency *</label>
        <select id="ncFrequency">
          <option value="">Select…</option>
          <option${(editingJob ? editingJob.frequency==='Monthly' : true) ? ' selected' : ''}>Monthly</option>
          <option${editingJob && editingJob.frequency==='Bi-monthly' ? ' selected' : ''}>Bi-monthly</option>
          <option${editingJob && editingJob.frequency==='Weekly' ? ' selected' : ''}>Weekly</option>
          <option${editingJob && editingJob.frequency==='One-off' ? ' selected' : ''}>One-off</option>
        </select>
      </div>
      <div class="field"><label>Round</label><input type="text" id="ncRound" value="${escapeHtml(suggestedRound)}" placeholder="Nearest round"></div>
      <div class="note-box" id="ncGeoStatus">📍 Getting location…</div>

      <div class="section-title" style="margin-top:6px;">Optional details</div>
      <div class="field"><label>Title</label>
        <select id="ncTitle">
          <option value="">—</option>
          <option${editingJob && editingJob.title==='Mr' ? ' selected' : ''}>Mr</option>
          <option${editingJob && editingJob.title==='Mrs' ? ' selected' : ''}>Mrs</option>
          <option${editingJob && editingJob.title==='Ms' ? ' selected' : ''}>Ms</option>
          <option${editingJob && editingJob.title==='Miss' ? ' selected' : ''}>Miss</option>
          <option${editingJob && editingJob.title==='Dr' ? ' selected' : ''}>Dr</option>
        </select>
      </div>
      <div class="field"><label>First name</label><input type="text" id="ncFirst" value="${editingJob ? escapeHtml(editingJob.firstName||'') : ''}"></div>
      <div class="field"><label>Last name</label><input type="text" id="ncLast" value="${editingJob ? escapeHtml(editingJob.lastName||'') : ''}"></div>
      <div class="field"><label>Phone number</label><input type="tel" id="ncPhone" placeholder="07…" value="${editingJob ? escapeHtml(editingJob.phone||'') : ''}"></div>
      <label style="display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:600;color:var(--ink-soft);">
        <input type="checkbox" id="ncGateText" style="width:18px;height:18px;accent-color:var(--navy);"${editingJob && editingJob.needsGateText ? ' checked' : ''}>
        Requires txt night before
      </label>
      <div class="field"><label>Email</label><input type="email" id="ncEmail" placeholder="name@example.com" value="${editingJob ? escapeHtml(editingJob.email||'') : ''}"></div>
      <label style="display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:600;color:var(--ink-soft);">
        <input type="checkbox" id="ncGocardless" style="width:18px;height:18px;accent-color:var(--navy);"${editingJob && editingJob.gocardless ? ' checked' : ''}>
        Gocardless
      </label>
      <label style="display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:600;color:var(--ink-soft);">
        <input type="checkbox" id="ncInvoice" style="width:18px;height:18px;accent-color:var(--navy);"${editingJob && editingJob.invoice ? ' checked' : ''}>
        Invoice
      </label>
      <div class="field"><label>Notes</label><textarea id="ncNotes" rows="2">${editingJob ? escapeHtml(editingJob.notes||'') : ''}</textarea></div>

      <button class="btn btn-primary btn-block" id="ncSave" style="margin-top:6px;">${editJobId ? 'Save changes' : "Add to today's list"}</button>
      <div id="ncError" style="color:var(--red);font-size:13px;font-weight:600;"></div>
    </div>
  `;
  main.appendChild(card);

  // auto-capture GPS location — keeps the existing coordinates as a fallback when editing
  let capturedLat = editingJob ? editingJob.lat : null;
  let capturedLon = editingJob ? editingJob.lon : null;
  const geoStatus = card.querySelector('#ncGeoStatus');
  if('geolocation' in navigator){
    navigator.geolocation.getCurrentPosition(
      pos=>{
        capturedLat = pos.coords.latitude;
        capturedLon = pos.coords.longitude;
        geoStatus.textContent = '📍 Location captured — Navigate will work for this job.';
      },
      err=>{
        geoStatus.textContent = editingJob && editingJob.lat != null ? '📍 Using the location saved earlier.' : '📍 Could not get location — Navigate will fall back to searching the address.';
      },
      { timeout: 10000 }
    );
  } else {
    geoStatus.textContent = editingJob && editingJob.lat != null ? '📍 Using the location saved earlier.' : '📍 Location not available on this device — Navigate will fall back to searching the address.';
  }

  const freqSelect = card.querySelector('#ncFrequency');
  const gateCheck = card.querySelector('#ncGateText');

  card.querySelector('#ncSave').onclick = async ()=>{
    const errEl = card.querySelector('#ncError');
    errEl.textContent = '';
    const address = card.querySelector('#ncAddress').value.trim();
    const price = parseFloat(card.querySelector('#ncPrice').value);
    const frequency = freqSelect.value;
    const round = card.querySelector('#ncRound').value.trim();
    const title = card.querySelector('#ncTitle').value;
    const firstName = card.querySelector('#ncFirst').value.trim();
    const lastName = card.querySelector('#ncLast').value.trim();
    const email = card.querySelector('#ncEmail').value.trim();
    const needsGateText = gateCheck.checked;
    const gocardless = card.querySelector('#ncGocardless').checked;
    const invoice = card.querySelector('#ncInvoice').checked;
    const phone = card.querySelector('#ncPhone').value.trim();
    const notes = card.querySelector('#ncNotes').value.trim();

    if(!address){ errEl.textContent = 'Address is required.'; return; }
    if(!price || price <= 0){ errEl.textContent = 'Enter a valid price.'; return; }
    if(!frequency){ errEl.textContent = 'Frequency is required.'; return; }

    const saveBtn = card.querySelector('#ncSave');
    saveBtn.disabled = true;
    saveBtn.textContent = editJobId ? 'Saving…' : 'Adding…';

    const customerName = [title, firstName, lastName].filter(Boolean).join(' ') || '(new customer)';
    const jobs = (await loadJobs(worker, date)) || [];

    if(editJobId){
      const idx = jobs.findIndex(j=>j.id===editJobId);
      if(idx !== -1){
        jobs[idx] = Object.assign({}, jobs[idx], {
          customer: customerName, address, phone, lat: capturedLat, lon: capturedLon,
          round, price, frontPrice: Math.ceil(price/2 + 1), notes, frequency,
          title, firstName, lastName, email, needsGateText, gocardless, invoice
        });
      }
      await saveJobs(worker, date, jobs);
      toast('New customer updated');
      go(fromScreen, {worker, date});
      return;
    }

    const sameRound = jobs.filter(j=>round && j.round===round);
    const order = sameRound.length
      ? Math.max(...sameRound.map(j=>j.order)) + 0.5
      : (jobs.length ? Math.max(...jobs.map(j=>j.order)) + 1 : 0);

    const newJob = {
      id: 'new_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,7),
      order,
      customer: customerName,
      address,
      postcode: '',
      phone,
      lat: capturedLat,
      lon: capturedLon,
      round,
      price,
      frontPrice: Math.ceil(price/2 + 1),
      balance: 0,
      notes,
      timeRequired: '',
      frequency,
      isNewCustomer: true,
      title, firstName, lastName, email, needsGateText, gocardless, invoice
    };
    jobs.push(newJob);
    await saveJobs(worker, date, jobs);
    toast('New customer added to the list');
    go('worker', {worker, date});
  };
}

// removes a new-customer job (and any progress recorded against it) entirely
async function deleteNewCustomerJob(worker, date, jobId){
  const jobs = (await loadJobs(worker, date)) || [];
  const remaining = jobs.filter(j=>j.id !== jobId);
  await saveJobs(worker, date, remaining);
  const prog = await loadProgress(worker, date);
  if(prog[jobId]){
    delete prog[jobId];
    await saveProgress(worker, date, prog);
  }
}


async function renderDaySummary(){

    const debt = -j.balance;

  `;

  main.insertAdjacentHTML('beforeend', renderNewCustomerSection(rows, true));

  const card = document.createElement('div');
  card.className = 'card pad';
  card.style.marginTop = '14px';
  card.innerHTML = `
    <div class="section-title">Today's totals</div>
    <table class="report">
      <tr><td>Jobs done</td><td class="num">${doneN} / ${jobs.length}</td></tr>
      <tr><td>Skipped</td><td class="num">${skippedN}</td></tr>
      <tr><td>Cancelled</td><td class="num">${cancelledN}</td></tr>
      <tr><td>Not done</td><td class="num">${notDoneN}</td></tr>
      <tr><td>Cash collected</td><td class="num">${money(collected)}</td></tr>

  const btnRow = document.createElement('div');
  btnRow.className = 'stack';
  btnRow.style.marginTop = '16px';
  btnRow.innerHTML = `
    <button class="btn btn-amber btn-block" id="copyBtn">Copy report to send to office</button>
    <button class="btn btn-ghost btn-block" id="csvBtn">Download CSV</button>
  `;
  main.appendChild(btnRow);

  btnRow.querySelector('#copyBtn').onclick = ()=>{
    const text = buildReportText(worker,date,rows,{collected,outstanding,doneN,skippedN,cancelledN,total:jobs.length});
    navigator.clipboard.writeText(text).then(()=>toast('Report copied — paste into WhatsApp/text')).catch(()=>{
      const ta = document.createElement('textarea'); ta.value=text; document.body.appendChild(ta);
      ta.select(); document.execCommand('copy'); ta.remove();
      toast('Report copied — paste into WhatsApp/text');
    });
  };
  btnRow.querySelector('#csvBtn').onclick = ()=> downloadReportCSV(worker,date,rows);
}

function buildReportText(worker,date,rows,totals){
  let lines = [];
  lines.push(`${worker} — ${date}`);
  lines.push(`Done ${totals.doneN}/${totals.total} · Skipped ${totals.skippedN} · Cancelled ${totals.cancelledN}`);
  lines.push(`Collected: ${money(totals.collected)}   Outstanding: ${money(totals.outstanding)}`);
  lines.push('');
  rows.forEach(r=>{
    if(r.status === 'todo'){
      lines.push(`${r.job.customer} — ${statusLabel(r.status)}`);
      return;
    }
    const charged = chargeForStatus(r.price, r.status);
    lines.push(`${r.job.customer} — ${r.status}, charged ${money(charged)}${r.payment?`, paid ${money(r.payment)}`:''}${r.owedAfter>0.004?`, owes ${money(r.owedAfter)}`:''}${r.note?` — note: ${r.note}`:''}`);
  });
  return lines.join('\n');
}

function downloadReportCSV(worker,date,rows){
  let csv = 'Customer,Address,Round,ListPrice,PriceCharged,Status,CashTaken,OwedAfter,Note\n';
  rows.forEach(r=>{
    csv += [r.job.customer,r.job.address,r.job.round,r.job.price.toFixed(2),r.price.toFixed(2),statusLabel(r.status),r.payment.toFixed(2),r.owedAfter.toFixed(2),r.note||'']
      .map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',') + '\n';
  });
  const blob = new Blob([csv],{type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${worker}_${date}_report.csv`;
  a.click();
}

    if(worker === 'ALL'){

        return { w, jobs: jobs || [], prog: prog || {} };
      }));
      let collected=0, outstanding=0, doneN=0, skippedN=0, cancelledN=0, notDoneN=0, totalJobs=0;
      const allRows = [];
      results.forEach(({w, jobs, prog})=>{
        totalJobs += jobs.length;
        jobs.slice().sort((a,b)=>a.order-b.order).forEach(j=>{
          const p = prog[j.id] || {status:'todo',payment:0};
          const payment = parseFloat(p.payment)||0;
          const price = resolvedPrice(j,p);
          collected += payment;
          if(p.status==='done') doneN++;
          if(p.status==='skipped') skippedN++;
          if(p.status==='cancelled') cancelledN++;
          if(p.status==='todo') notDoneN++;
          const debt = -j.balance;
          const owedAfter = debt + chargeForStatus(price,p.status) - payment;
          if(p.status !== 'cancelled') outstanding += owedAfter;
          allRows.push({worker:w,job:j,status:p.status,payment,price,note:p.note||'',owedAfter,frontApplied:!!p.frontApplied});
        });
      });
      if(!totalJobs){ out.innerHTML = `<p class="muted">No job lists loaded for ${date} yet.</p>`; return; }
      const lookup = await loadCoordLookup();
      allRows.sort((a,b)=> roundOrderRank(a.job,lookup) - roundOrderRank(b.job,lookup));
      out.innerHTML = `
        <table class="report">
          <tr><td>Jobs done</td><td class="num">${doneN} / ${totalJobs}</td></tr>
          <tr><td>Skipped</td><td class="num">${skippedN}</td></tr>
          <tr><td>Cancelled</td><td class="num">${cancelledN}</td></tr>
          <tr><td>Not done</td><td class="num">${notDoneN}</td></tr>
          <tr><td>Cash collected</td><td class="num">${money(collected)}</td></tr>
          <tr><td>Still outstanding</td><td class="num">${money(outstanding)}</td></tr>
        </table>
        <div class="section-title" style="margin-top:16px;">All jobs</div>
        <table class="report">
          <tr><th>Worker</th><th>Address</th><th>Status</th><th class="num">Charged</th><th class="num">Paid</th><th class="num">Balance</th></tr>
          ${allRows.length ? allRows.map(r=>`<tr><td>${escapeHtml(r.worker)}</td><td>${escapeHtml(r.job.address)}${r.note ? `<div class="muted" style="font-size:11px;margin-top:2px;">${escapeHtml(r.note)}</div>` : ''}</td><td><span class="badge badge-${r.status}">${statusLabel(r.status)}</span></td>${chargedCell(r)}${paidCell(r)}${balanceCell(r)}</tr>`).join('') : `<tr><td colspan="6" class="muted">No jobs yet.</td></tr>`}
        </table>
        ${renderNewCustomerSection(allRows)}
        <button class="btn btn-ghost btn-block" id="rCsv" style="margin-top:10px;">Download CSV</button>
      `;
      out.querySelector('#rCsv').onclick = ()=> downloadReportCSVMulti(date, allRows);
      return;
    }

    const { jobs, prog: progRaw } = await loadForReport(worker,date);
    if(!jobs || !jobs.length){ out.innerHTML = `<p class="muted">No job list loaded for ${worker} on ${date}.</p>`; return; }
    const prog = progRaw || {};
    const lookup = await loadCoordLookup();
    const sortedJobs = sortJobsByRoundOrder(jobs, lookup);
    let collected=0, outstanding=0, doneN=0, skippedN=0, cancelledN=0, notDoneN=0;
    const rows = sortedJobs.map(j=>{
      const p = prog[j.id] || {status:'todo',payment:0};
      const payment = parseFloat(p.payment)||0;
      const price = resolvedPrice(j,p);
      collected += payment;
      if(p.status==='done') doneN++;
      if(p.status==='skipped') skippedN++;
      if(p.status==='cancelled') cancelledN++;
      if(p.status==='todo') notDoneN++;
      const debt = -j.balance;
      const owedAfter = debt + chargeForStatus(price,p.status) - payment;
      if(p.status !== 'cancelled') outstanding += owedAfter;
      return {job:j,status:p.status,payment,price,note:p.note||'',owedAfter,frontApplied:!!p.frontApplied};
    });
    out.innerHTML = `
      <table class="report">
        <tr><td>Jobs done</td><td class="num">${doneN} / ${jobs.length}</td></tr>
        <tr><td>Skipped</td><td class="num">${skippedN}</td></tr>
        <tr><td>Cancelled</td><td class="num">${cancelledN}</td></tr>
        <tr><td>Not done</td><td class="num">${notDoneN}</td></tr>
        <tr><td>Cash collected</td><td class="num">${money(collected)}</td></tr>
        <tr><td>Still outstanding</td><td class="num">${money(outstanding)}</td></tr>
      </table>
      <div class="section-title" style="margin-top:16px;">Jobs</div>
      <table class="report">
        <tr><th>Address</th><th>Status</th><th class="num">Charged</th><th class="num">Paid</th><th class="num">Balance</th></tr>
        ${rows.length ? rows.map(r=>`<tr><td>${escapeHtml(r.job.address)}${r.note ? `<div class="muted" style="font-size:11px;margin-top:2px;">${escapeHtml(r.note)}</div>` : ''}</td><td><span class="badge badge-${r.status}">${statusLabel(r.status)}</span></td>${chargedCell(r)}${paidCell(r)}${balanceCell(r)}</tr>`).join('') : `<tr><td colspan="5" class="muted">No jobs yet.</td></tr>`}
      </table>
      ${renderNewCustomerSection(rows)}
      <button class="btn btn-ghost btn-block" id="rCsv" style="margin-top:10px;">Download CSV</button>
    `;
    out.querySelector('#rCsv').onclick = ()=> downloadReportCSV(worker,date,rows);
  }
  card.querySelector('#rGo').onclick = showReport;
}

async function renderAdminSettings(main){
  const card = document.createElement('div');
  card.className = 'card pad';
  card.innerHTML = `
    <div class="section-title">Change office password</div>
    <p class="muted" style="font-size:12.5px;margin-top:-4px;">This is shared — changing it updates the password required on every phone, not just this one.</p>
    <div class="stack" style="margin-top:10px;">
      <div class="field"><label>New password</label><input type="password" id="newPw2"></div>
      <button class="btn btn-primary btn-block" id="changePwBtn">Update password</button>
    </div>
  `;
  main.appendChild(card);
  card.querySelector('#changePwBtn').onclick = async ()=>{
    const v = card.querySelector('#newPw2').value;
    if(!v){ toast('Enter a password'); return; }
    await setPassword(v);
    toast('Password updated');
  };

  const superCard = document.createElement('div');
  superCard.className = 'card pad';
  superCard.style.marginTop = '14px';
  const currentSuperUsers = await loadSuperUsers();
  superCard.innerHTML = `
    <div class="section-title">Super users</div>
    <p class="muted" style="font-size:12.5px;margin-top:-4px;line-height:1.5;">Super users can tap Select on their own list to move jobs to anyone else, and rejected jobs get sent back to the first person ticked below.</p>
    <div class="stack" style="margin-top:10px;">
      ${WORKERS.map(w=>`
        <label style="display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;">
          <input type="checkbox" class="super-user-check" value="${escapeHtml(w)}" style="width:18px;height:18px;accent-color:var(--navy);"${currentSuperUsers.includes(w) ? ' checked' : ''}>
          ${escapeHtml(w)}
        </label>
      `).join('')}
      <button class="btn btn-primary btn-block" id="saveSuperUsersBtn" style="margin-top:6px;">Save super users</button>
    </div>
  `;
  main.appendChild(superCard);
  superCard.querySelector('#saveSuperUsersBtn').onclick = async ()=>{
    const checked = Array.from(superCard.querySelectorAll('.super-user-check:checked')).map(cb=>cb.value);
    if(!checked.length){ toast('Pick at least one super user'); return; }
    await saveSuperUsers(checked);
    toast('Super users updated');
  };

  const wipe = document.createElement('div');
  wipe.className = 'card pad';
  wipe.style.marginTop = '14px';
  wipe.innerHTML = `
    <div class="section-title">Storage</div>
    <p class="muted" style="font-size:13px;margin-top:-4px;line-height:1.5;">Job list data, cash taken, and job statuses are stored in a shared Firebase database, so any phone with this app open can see the same information. The office password is just a screen in this app, not real access control — anyone with the Firebase project details could still reach the data directly, so don't put anything highly sensitive in here.</p>
  `;
  main.appendChild(wipe);
}

/* ================= INIT ================= */
{
  const resumedWorker = restoreSession();
  if(resumedWorker) state = { screen:'worker', worker: resumedWorker };
}
render();
</script>
