<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Workeriser</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#123a5e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workeriser">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef2f4;
    --surface:#ffffff;
    --ink:#10202f;
    --ink-soft:#516b7a;
    --navy:#123a5e;
    --navy-deep:#0a2540;
    --amber:#f0a202;
    --amber-deep:#c98600;
    --green:#1f8a54;
    --green-bg:#e5f4ec;
    --red:#c23b3b;
    --red-bg:#fbe9e9;
    --slate:#8fa1ac;
    --slate-bg:#eef1f2;
    --blue:#2f6fed;
    --blue-bg:#e8effd;
    --line:#dbe3e7;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,h3,.display{font-family:'Space Grotesk',system-ui,sans-serif;}
  button{font-family:inherit;}
  #app{max-width:560px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;transition:max-width .15s ease;}
  #app.admin-wide{max-width:1100px;}
  #app.admin-wide table.report{font-size:13.5px;}
  #app.admin-wide table.report th,#app.admin-wide table.report td{padding:7px 10px;}

  /* ---------- header ---------- */
  .topbar{
    background:linear-gradient(160deg,var(--navy-deep),var(--navy));
    color:#fff;
    padding:18px 20px 16px;
    position:sticky;top:0;z-index:20;
  }
  .topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{
    width:34px;height:34px;border-radius:9px;
    background:var(--amber);
    display:flex;align-items:center;justify-content:center;
    font-family:'Space Grotesk';font-weight:700;color:var(--navy-deep);font-size:15px;
    flex:none;
  }
  .brand-text .t1{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#b9cbd8;font-weight:600;}
  .brand-text .t2{font-size:18px;font-weight:700;line-height:1.1;}
  .topbar-btn{
    background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);color:#fff;
    padding:7px 12px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;
  }
  .topbar-btn:active{background:rgba(255,255,255,.22);}
  .topbar-sub{margin-top:12px;display:flex;justify-content:space-between;align-items:baseline;color:#cfdce5;font-size:13px;}
  .topbar-sub b{color:#fff;font-weight:700;}

  /* ---------- generic ---------- */
  .main{flex:1;padding:18px 16px 100px;}
  .card{background:var(--surface);border-radius:var(--radius);box-shadow:0 1px 2px rgba(10,37,64,.06), 0 6px 18px rgba(10,37,64,.05);}
  .center-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;text-align:center;}
  .muted{color:var(--ink-soft);}
  .stack{display:flex;flex-direction:column;gap:12px;}

  /* ---------- login screen ---------- */
  .login-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;padding:32px 24px;}
  .login-hero{text-align:center;margin-bottom:34px;}
  .login-hero .glyph{
    width:64px;height:64px;border-radius:16px;margin:0 auto 16px;
    background:linear-gradient(160deg,var(--navy),var(--navy-deep));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 20px rgba(10,37,64,.25);
  }
  .login-hero h1{font-size:24px;margin:0 0 6px;color:var(--navy-deep);}
  .login-hero p{margin:0;color:var(--ink-soft);font-size:14px;}
  .worker-btn{
    display:flex;align-items:center;gap:14px;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 18px;cursor:pointer;text-align:left;width:100%;
    box-shadow:0 1px 2px rgba(10,37,64,.05);
  }
  .worker-btn:active{background:#f4f7f8;}
  .worker-avatar{
    width:42px;height:42px;border-radius:50%;flex:none;
    background:var(--amber);color:var(--navy-deep);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-family:'Space Grotesk';font-size:16px;
  }
  .worker-btn .name{font-weight:700;font-size:16px;}
  .worker-btn .sub{font-size:12.5px;color:var(--ink-soft);margin-top:1px;}
  .worker-btn .chev{margin-left:auto;color:var(--slate);}
  .admin-link{
    margin-top:26px;text-align:center;font-size:13px;color:var(--ink-soft);
    text-decoration:underline;cursor:pointer;
  }

  /* ---------- job list ---------- */
  .round-label{
    font-family:'Space Grotesk';font-size:12.5px;font-weight:700;letter-spacing:.04em;
    color:var(--navy);text-transform:uppercase;margin:22px 0 8px 2px;
    display:flex;align-items:center;gap:8px;
  }
  .round-label:first-child{margin-top:2px;}
  .round-label::after{content:"";flex:1;height:1px;background:var(--line);}

  .completed-divider{
    display:flex;align-items:center;gap:10px;
    margin:26px 0 14px;color:var(--slate);
  }
  .completed-divider::before,.completed-divider::after{content:"";flex:1;height:1px;background:var(--line);}
  .completed-divider span{
    font-family:'Space Grotesk';font-size:11px;font-weight:700;letter-spacing:.08em;
    text-transform:uppercase;color:var(--ink-soft);white-space:nowrap;
  }

  .job-card{
    padding:14px 14px 12px;margin-bottom:10px;position:relative;overflow:hidden;
    border:1px solid var(--line);
  }
  .job-card.status-done{border-color:#bfe3cd;background:var(--green-bg);}
  .job-card.status-skipped{border-color:#e6dab8;background:#fbf3e0;}
  .job-card.is-cancelled{border-left:4px solid var(--red);}
  .job-card.is-cancelled .cust,.job-card.is-cancelled .addr{text-decoration:line-through;}
  .job-card.v-round{
    border:2px solid var(--navy) !important;
    padding-top:38px;
  }
  .v-round-banner{
    position:absolute;top:0;left:0;right:0;height:26px;
    background:linear-gradient(160deg,var(--navy-deep),var(--navy));color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;
  }
  .job-card.selectable{padding-left:44px;}
  .job-select-checkbox{
    position:absolute;top:12px;left:13px;width:20px;height:20px;z-index:5;accent-color:var(--navy);
  }
  .job-select-label{
    position:absolute;top:32px;left:11px;z-index:5;font-size:7.5px;font-weight:800;
    color:var(--ink-soft);letter-spacing:.02em;width:24px;text-align:center;
  }
  .job-front-wrap, .job-back-wrap{
    position:absolute;left:12px;z-index:5;display:flex;flex-direction:column;align-items:center;gap:1px;
  }
  .job-front-wrap{top:46px;}
  .job-back-wrap{top:76px;}
  .job-front-wrap input, .job-back-wrap input{width:18px;height:18px;}
  .job-front-wrap input{accent-color:var(--amber-deep);}
  .job-back-wrap input{accent-color:var(--blue);}
  .job-front-wrap span, .job-back-wrap span{font-size:7.5px;font-weight:800;color:var(--ink-soft);letter-spacing:.02em;}

  .move-bar{
    background:var(--navy-deep);border-radius:var(--radius);
    padding:12px 14px;margin-top:12px;
    display:flex;flex-direction:column;gap:10px;
  }
  .move-bar-label{color:#cfdce5;font-size:12.5px;font-weight:600;}
  .move-bar-targets{display:flex;gap:8px;flex-wrap:wrap;}
  .move-target-btn{
    background:var(--amber);color:var(--navy-deep);border:none;border-radius:20px;
    padding:8px 14px;font-weight:700;font-size:13px;cursor:pointer;
  }
  .move-target-btn:active{background:var(--amber-deep);color:#fff;}
  .move-target-btn:disabled{opacity:.6;}
  .undo-bar{background:var(--navy);}
  .move-dismiss-btn{background:rgba(255,255,255,.14);color:#fff;}
  .move-dismiss-btn:active{background:rgba(255,255,255,.24);}

  .job-top{display:flex;justify-content:space-between;gap:10px;}
  .job-info .addr{font-weight:700;font-size:15.5px;line-height:1.3;color:var(--ink);}
  .cust-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:3px;}
  .job-info .cust{font-size:13px;color:var(--ink-soft);}
  .phone-btn{
    display:inline-flex;align-items:center;gap:4px;
    color:var(--navy);text-decoration:none;font-size:12.5px;font-weight:700;
    background:var(--slate-bg);border-radius:20px;padding:2px 8px 2px 7px;
  }
  .phone-btn:active{background:var(--line);}
  .job-info .notes{font-size:12.5px;color:var(--amber-deep);margin-top:6px;font-weight:600;}

  .price-block{display:flex;align-items:center;gap:10px;flex:none;}
  .price-edit{display:flex;align-items:center;justify-content:flex-end;gap:2px;}
  .price-edit .pfx{font-family:'Space Grotesk';font-weight:700;font-size:19px;color:var(--navy-deep);}
  .price-input{
    width:80px;border:none;background:transparent;text-align:right;
    font-family:'Space Grotesk';font-weight:700;font-size:19px;color:var(--navy-deep);
    padding:2px 2px;border-bottom:1.5px dashed var(--line);
    -moz-appearance:textfield;
  }
  .price-input::-webkit-outer-spin-button,
  .price-input::-webkit-inner-spin-button{
    -webkit-appearance:none;margin:0;
  }
  .price-input:focus{outline:none;border-bottom-color:var(--navy);}
  .price-block .front{
    flex:none;width:46px;height:46px;
    display:flex;align-items:center;justify-content:center;
    background:#fff;color:var(--amber-deep);border:2px solid var(--amber-deep);border-radius:11px;
    font-size:13px;font-weight:800;letter-spacing:.02em;
    cursor:pointer;font-family:inherit;padding:2px;
  }
  .price-block .front.front-active{background:var(--amber-deep);color:#fff;}
  .nav-icon-btn{
    flex:none;width:46px;height:46px;
    display:flex;align-items:center;justify-content:center;
    background:var(--navy);border-radius:11px;text-decoration:none;
  }
  .nav-icon-btn:active{background:var(--navy-deep);}
  .front-split-badge{
    flex:none;width:46px;height:46px;
    display:flex;align-items:center;justify-content:center;
    background:var(--amber-deep);color:#fff;border:none;border-radius:11px;
    font-size:10.5px;font-weight:800;letter-spacing:.02em;cursor:pointer;font-family:inherit;
  }
  .front-split-badge:active{background:var(--amber);}

  .job-controls{display:flex;gap:8px;margin-top:14px;}
  .status-btn{
    flex:1;padding:9px 4px;border-radius:9px;border:1.5px solid var(--line);
    background:#fff;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--ink-soft);
    display:flex;flex-direction:column;align-items:center;gap:2px;
    width:100%;font-family:inherit;
  }
  .status-btn .ic{font-size:15px;}
  .status-btn.active-done{background:var(--green);border-color:var(--green);color:#fff;}
  .status-btn.active-skipped{background:var(--amber);border-color:var(--amber);color:#3a2a00;}
  .status-btn.active-cancelled{background:var(--red);border-color:var(--red);color:#fff;}
  .status-btn.debt-knock-overridden{border:2px solid var(--red);}
  .done-wrap{position:relative;flex:1;}
  .debt-knock-cap{
    position:absolute;inset:0;border-radius:9px;
    background:var(--red);color:#fff;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;
    line-height:1.25;text-align:center;
  }
  .reject-btn{
    width:100%;margin-top:8px;background:transparent;border:1.5px dashed var(--red);
    color:var(--red);border-radius:9px;padding:7px 4px;font-size:12px;font-weight:600;
    cursor:pointer;font-family:inherit;
  }
  .reject-btn:active{background:var(--red-bg);}
  .reject-btn:disabled{opacity:.6;}

  .assign-checkbox-grid{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:6px;}
  .assign-checkbox-item{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--ink);cursor:pointer;}
  .assign-checkbox-item input{width:16px;height:16px;accent-color:var(--navy);cursor:pointer;}
  .assign-checkbox-item input:disabled{cursor:not-allowed;}
  .assign-role-tag{font-size:11px;font-weight:800;color:var(--amber-deep);}
  .assign-apply-btn{
    margin-top:8px;width:100%;background:var(--navy);color:#fff;border:none;border-radius:9px;
    padding:8px 4px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;
  }
  .assign-apply-btn:disabled{opacity:.6;}

  .pay-row{display:flex;gap:10px;margin-top:12px;}
  .pay-field{flex:1;}
  .pay-field label{font-size:12.5px;color:var(--ink-soft);font-weight:600;display:block;margin-bottom:5px;}
  .pay-input-wrap{
    display:flex;align-items:center;gap:2px;
    border:1.5px solid var(--line);border-radius:9px;padding:8px 8px 8px 10px;background:#fbfcfd;
  }
  .pay-input-wrap .pfx{color:var(--ink-soft);}
  .pay-input-wrap:focus-within{outline:2px solid var(--navy);border-color:var(--navy);}
  .pay-input-wrap input{
    width:100%;border:none;background:transparent;font-size:15px;font-weight:600;font-family:'Inter';padding:0;
  }
  .pay-input-wrap input:focus{outline:none;}
  .balance-value{
    border:1.5px solid var(--line);border-radius:9px;padding:9px 10px;background:#fbfcfd;
    font-size:13.5px;
  }

  .note-field{margin-top:10px;}
  .note-field label{font-size:12.5px;color:var(--ink-soft);font-weight:600;display:block;margin-bottom:5px;}
  .note-field textarea{
    width:100%;border:1.5px solid var(--line);border-radius:9px;padding:8px 9px;
    font-size:13.5px;font-family:'Inter';background:#fbfcfd;resize:vertical;
  }
  .note-field textarea:focus{outline:2px solid var(--navy);border-color:var(--navy);}

  /* squeegee wipe */
  .wipe{
    position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(100deg,transparent 0%,rgba(255,255,255,.85) 45%,rgba(255,255,255,0) 60%);
    transform:translateX(-120%);
  }
  .wipe.play{animation:squeegee .55s ease-out;}
  @keyframes squeegee{ to{transform:translateX(120%);} }
  @media (prefers-reduced-motion: reduce){ .wipe.play{animation:none;} }

  /* ---------- summary bar / footer ---------- */
  .summary-bar{
    position:sticky;bottom:0;left:0;right:0;
    background:rgba(255,255,255,.92);backdrop-filter:blur(6px);
    border-top:1px solid var(--line);
    padding:10px 16px;display:flex;gap:10px;
  }
  .sum-pill{
    flex:1;text-align:center;padding:6px 4px;border-radius:9px;background:var(--slate-bg);
  }
  .sum-pill .n{font-family:'Space Grotesk';font-weight:700;font-size:16px;color:var(--navy-deep);}
  .sum-pill .l{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);}
  .finish-btn{
    flex:none;background:var(--amber);color:var(--navy-deep);border:none;border-radius:9px;
    font-weight:700;font-size:13px;padding:0 16px;cursor:pointer;
  }

  /* ---------- forms / admin ---------- */
  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{font-size:13px;font-weight:600;color:var(--ink-soft);}
  .field input,.field select{
    border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;font-size:15px;font-family:inherit;background:#fff;
  }
  .field input:focus,.field select:focus{outline:2px solid var(--navy);border-color:var(--navy);}
  .btn{
    border:none;border-radius:10px;padding:12px 16px;font-weight:700;font-size:14.5px;cursor:pointer;
  }
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-primary:active{background:var(--navy-deep);}
  .btn-amber{background:var(--amber);color:var(--navy-deep);}
  .btn-ghost{background:transparent;color:var(--navy);border:1.5px solid var(--line);}
  .btn-block{width:100%;}
  .tab-row{display:flex;gap:6px;margin-bottom:16px;background:var(--slate-bg);padding:4px;border-radius:11px;}
  .tab-btn{flex:1;border:none;background:transparent;padding:9px 4px;border-radius:8px;font-weight:700;font-size:12.5px;color:var(--ink-soft);cursor:pointer;}
  .tab-btn.active{background:#fff;color:var(--navy-deep);box-shadow:0 1px 3px rgba(10,37,64,.12);}
  .section-title{font-family:'Space Grotesk';font-weight:700;font-size:15px;margin:0 0 10px;color:var(--navy-deep);}
  .pad{padding:16px;}
  .note-box{background:var(--slate-bg);border-radius:10px;padding:12px 14px;font-size:12.5px;color:var(--ink-soft);line-height:1.5;}

  table.report{width:auto;min-width:100%;border-collapse:collapse;font-size:12.5px;}
  table.report th,table.report td{padding:6px 8px;text-align:left;border-bottom:1px solid var(--line);}
  table.report th{font-size:10.5px;text-transform:uppercase;color:var(--ink-soft);letter-spacing:.03em;}
  table.report td.num{text-align:right;font-weight:600;}
  table.report th.num{text-align:right;}
  table.report .round-row{
    background:var(--slate-bg);color:var(--navy);font-weight:700;font-size:10.5px;
    text-transform:uppercase;letter-spacing:.03em;padding-top:9px;padding-bottom:6px;
  }
  .badge{display:inline-block;padding:2px 7px;border-radius:6px;font-size:11px;font-weight:700;}
  .badge-done{background:var(--green-bg);color:var(--green);}
  .badge-skipped{background:#fbf3e0;color:var(--amber-deep);}
  .badge-cancelled{background:var(--red-bg);color:var(--red);}
  .badge-todo{background:var(--slate-bg);color:var(--ink-soft);}
  .badge-front{background:var(--amber-deep);color:#fff;}
  .badge-new{background:var(--blue);color:#fff;}

  .dialog-overlay{
    position:fixed;inset:0;background:rgba(10,37,64,.55);z-index:10000;
    display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .dialog-box{max-width:360px;width:100%;}

  .toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
    background:var(--navy-deep);color:#fff;padding:11px 18px;border-radius:10px;font-size:13.5px;font-weight:600;
    box-shadow:0 8px 20px rgba(10,37,64,.3);z-index:100;opacity:0;transition:opacity .2s;pointer-events:none;
    max-width:90%;text-align:center;
  }
  .toast.show{opacity:1;}
  .back-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
  .back-row .back{cursor:pointer;color:var(--navy);font-weight:700;font-size:13px;}
  .empty-state{padding:40px 20px;text-align:center;color:var(--ink-soft);}
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* =========================================================================
   FIREBASE SETUP — fill this in so every phone shares the same data.
   1. Go to https://console.firebase.google.com, create a free project.
   2. In the project, click the </> (web app) icon to register a web app —
      it will show you a firebaseConfig object. Copy those values in below.
   3. In the left menu go to Databases & Storage > Firestore > Create database
      (choose the open/permissive starting rules option, not "Restrictive").
   4. Later, tighten the rules in Firestore > Rules to something like:
        rules_version = '2';
        service cloud.firestore {
          match /databases/{database}/documents {
            match /workeriser/{docId} { allow read, write: if true; }
          }
        }
      (This keeps it simple, no logins — same "not high security, just
      keeps casual browsers out" level as the office password.)
   ========================================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyABEfdCUcjsaHwpu78luEE25R9__jgg0Q4",
  authDomain: "workeriser.firebaseapp.com",
  projectId: "workeriser",
  storageBucket: "workeriser.firebasestorage.app",
  messagingSenderId: "5012320559",
  appId: "1:5012320559:web:047bc3931048a27cd171da"
};

const configOk = !!firebaseConfig.apiKey && !firebaseConfig.apiKey.startsWith('PASTE_');
let db = null;
if(configOk){
  try{
    const fbApp = initializeApp(firebaseConfig);
    db = getFirestore(fbApp);
  }catch(err){ console.error('Firebase init failed', err); }
}

async function fsGet(key){
  if(!db) return null;
  try{
    const snap = await getDoc(doc(db,'workeriser',key));
    return snap.exists() ? snap.data().value : null;
  }catch(err){
    console.error('fsGet failed', key, err);
    toast('Connection problem loading data');
    return null;
  }
}
async function fsSet(key, value){
  if(!db) return false;
  try{
    await setDoc(doc(db,'workeriser',key), { value, updatedAt: Date.now() });
    return true;
  }catch(err){
    console.error('fsSet failed', key, err);
    toast('Connection problem saving — try again');
    return false;
  }
}

/* ================= CONFIG / STORAGE ================= */
const WORKERS = ['Simon','Jim','Lily','Shane','Vlado'];
// Required whenever the office area hasn't had a custom password set for this

async function getPassword(){ const v = await fsGet('admin_pw'); return v || DEFAULT_ADMIN_PW; }

async function getMeta(){

  return m || { lastDate:{}, rounds:[] };
}

async function loadJobs(worker,date){ return await fsGet(`jobs_${worker}_${date}`); }
async function saveJobs(worker,date,jobs){

async function loadProgress(worker,date){ return (await fsGet(`progress_${worker}_${date}`)) || {}; }
async function saveProgress(worker,date,prog){ await fsSet(`progress_${worker}_${date}`, prog); }

// super users can select/move jobs between anyone's list and see them rejected back to them.
// stored as a list rather than hardcoded so it isn't tied to one specific person.
async function loadSuperUsers(){

  return (list && list.length) ? list : ['Simon'];
}
async function saveSuperUsers(list){

}

// the front-only price formula (half the full price, rounded up, plus £1) doesn't
// suit every property — e.g. a conservatory at the back means more windows round
// there than at the front. Once a worker corrects the price while Front Only is
// active, that figure is remembered against the job itself, so it's recalled
// automatically next time Front Only is pressed for that same recurring job,
// on any future day, instead of the generic formula.
async function loadCustomFrontPrices(){
  return (await fsGet('custom_front_prices')) || {};
}
async function saveCustomFrontPrice(jobId, price){
  const current = await loadCustomFrontPrices();
  current[jobId] = price;
  await fsSet('custom_front_prices', current);
}

// used by Clear to wipe a day's report along with its live job list and progress
async function deleteReportSnapshot(worker,date){
  await fsSet(`report_${worker}_${date}`, null);
}

// flips the visiting order for a whole day — last job becomes first and vice versa
async function reverseWorkOrder(worker,date){
  const jobs = await loadJobs(worker,date);
  if(!jobs || !jobs.length) return false;
  const reversed = jobs.slice().sort((a,b)=>a.order-b.order).reverse();
  reversed.forEach((j,idx)=>{ j.order = idx; });
  await saveJobs(worker,date,reversed);
  return true;
}

// moves one or several jobs up/down by one step each, past their nearest unselected
// neighbour — works for a single job (arrows) or a multi-selected group alike
async function nudgeJobOrder(worker,date,jobIds,direction){
  const jobs = await loadJobs(worker,date);
  if(!jobs || !jobs.length) return;
  const arr = jobs.slice().sort((a,b)=>a.order-b.order);
  const selSet = new Set(jobIds);
  const sel = arr.map(j=>selSet.has(j.id));
  if(direction === 'up'){
    for(let i=0;i<arr.length;i++){
      if(sel[i] && i>0 && !sel[i-1]){
        [arr[i-1],arr[i]] = [arr[i],arr[i-1]];
        [sel[i-1],sel[i]] = [sel[i],sel[i-1]];
      }
    }
  } else {
    for(let i=arr.length-1;i>=0;i--){
      if(sel[i] && i<arr.length-1 && !sel[i+1]){
        [arr[i],arr[i+1]] = [arr[i+1],arr[i]];
        [sel[i],sel[i+1]] = [sel[i+1],sel[i]];
      }
    }
  }
  arr.forEach((j,idx)=>{ j.order = idx; });
  await saveJobs(worker,date,arr);
}

// reads data for reporting: prefers an archived snapshot (taken at Clear time) over
// live data, so a cleared day's report still reflects what actually happened that day
async function loadForReport(worker,date){
  const snap = await fsGet(`report_${worker}_${date}`);
  if(snap) return snap;
  const [jobs, prog] = await Promise.all([loadJobs(worker,date), loadProgress(worker,date)]);
  return { jobs, prog };
}

// moves a set of jobs (by id) from one worker's round to another's, for the same date,
// carrying over any progress (payment/price/note) already recorded against them
async function moveJobsToWorker(fromWorker, toWorker, date, jobIds){
  if(!db){ toast('Not connected to the database'); return; }
  const lookup = await loadCoordLookup();
  const idSet = new Set(jobIds);
  const roundOrder = lookup.roundOrder || [];
  function roundRank(roundName){
    const idx = roundOrder.indexOf(roundName);
    return idx === -1 ? Infinity : idx;
  }

  const fromJobsRef = doc(db,'workeriser',`jobs_${fromWorker}_${date}`);
  const toJobsRef = doc(db,'workeriser',`jobs_${toWorker}_${date}`);
  const fromProgRef = doc(db,'workeriser',`progress_${fromWorker}_${date}`);
  const toProgRef = doc(db,'workeriser',`progress_${toWorker}_${date}`);

  let moving = [];
  try{
    await runTransaction(db, async (tx)=>{
      const [fromSnap, toSnap, fromProgSnap, toProgSnap] = await Promise.all([
        tx.get(fromJobsRef), tx.get(toJobsRef), tx.get(fromProgRef), tx.get(toProgRef)
      ]);
      const source = fromSnap.exists() ? (fromSnap.data().value || []) : [];
      const toJobs = toSnap.exists() ? (toSnap.data().value || []) : [];
      const fromProg = fromProgSnap.exists() ? (fromProgSnap.data().value || {}) : {};
      const toProg = toProgSnap.exists() ? (toProgSnap.data().value || {}) : {};

      moving = source.filter(j=>idSet.has(j.id));
      const remaining = source.filter(j=>!idSet.has(j.id));

      moving.forEach(j=>{
        j.lastAssignedBy = fromWorker;
        toJobs.push(j);
        if(fromProg[j.id]){
          toProg[j.id] = fromProg[j.id];
          delete fromProg[j.id];
        }
      });

      toJobs.sort((a,b)=> roundRank(a.round) - roundRank(b.round));
      toJobs.forEach((j,idx)=>{ j.order = idx; });

      tx.set(fromJobsRef, { value: remaining, updatedAt: Date.now() });
      tx.set(toJobsRef, { value: toJobs, updatedAt: Date.now() });
      tx.set(fromProgRef, { value: fromProg, updatedAt: Date.now() });
      tx.set(toProgRef, { value: toProg, updatedAt: Date.now() });
    });
  }catch(err){
    console.error('moveJobsToWorker transaction failed', err);
    toast('Connection problem moving the job — please try again');
    return;
  }

  const meta = await getMeta();
  [fromWorker, toWorker].forEach(w=>{
    meta.lastDate[w] = date;
    const key = `${w}|${date}`;
    if(!meta.rounds.includes(key)) meta.rounds.push(key);
  });
  await saveMeta(meta);

  const movedSubJobs = moving.filter(j=>j.isSubJob && j.mainJobWorker && j.mainJobId);
  for(const j of movedSubJobs){
    const mainRef = doc(db,'workeriser',`jobs_${j.mainJobWorker}_${date}`);
    try{
      await runTransaction(db, async (tx)=>{
        const snap = await tx.get(mainRef);
        if(!snap.exists()) return;
        const jobs = snap.data().value || [];
        const updated = jobs.map(mj=> mj.id===j.mainJobId ? Object.assign({}, mj, { subJobWorker: toWorker }) : mj);
        tx.set(mainRef, { value: updated, updatedAt: Date.now() });
      });
    }catch(err){ console.error('sub-job pointer update failed', err); }
  }

  const movedMainJobs = moving.filter(j=>j.subJobWorker && j.subJobId);
  for(const j of movedMainJobs){
    const subRef = doc(db,'workeriser',`jobs_${j.subJobWorker}_${date}`);
    try{
      await runTransaction(db, async (tx)=>{
        const snap = await tx.get(subRef);
        if(!snap.exists()) return;
        const jobs = snap.data().value || [];
        const updated = jobs.map(sj=> sj.id===j.subJobId ? Object.assign({}, sj, { mainJobWorker: toWorker }) : sj);
        tx.set(subRef, { value: updated, updatedAt: Date.now() });
      });
    }catch(err){ console.error('main-job pointer update failed', err); }
  }
}

// used from Select mode: sends the "front"/main job(s) to targetWorker as normal,
// while a "back" sub-card for each is created and left behind in the sender's own
// list — ready to be selected and sent on to whoever does the back, or just kept
// by the sender if they're doing that part themselves
async function splitAndSendJobs(fromWorker, date, jobIds, targetWorker){
  if(!db){ toast('Not connected to the database'); return; }
  const lookup = await loadCoordLookup();
  const idSet = new Set(jobIds);
  const roundOrder = lookup.roundOrder || [];
  function roundRank(roundName){
    const idx = roundOrder.indexOf(roundName);
    return idx === -1 ? Infinity : idx;
  }

  const fromJobsRef = doc(db,'workeriser',`jobs_${fromWorker}_${date}`);
  const targetJobsRef = doc(db,'workeriser',`jobs_${targetWorker}_${date}`);
  const fromProgRef = doc(db,'workeriser',`progress_${fromWorker}_${date}`);
  const targetProgRef = doc(db,'workeriser',`progress_${targetWorker}_${date}`);

  try{
    await runTransaction(db, async (tx)=>{
      const [fromSnap, targetSnap, fromProgSnap, targetProgSnap] = await Promise.all([
        tx.get(fromJobsRef), tx.get(targetJobsRef), tx.get(fromProgRef), tx.get(targetProgRef)
      ]);
      const source = fromSnap.exists() ? (fromSnap.data().value || []) : [];
      const targetJobs = targetSnap.exists() ? (targetSnap.data().value || []) : [];
      const fromProg = fromProgSnap.exists() ? (fromProgSnap.data().value || {}) : {};
      const targetProg = targetProgSnap.exists() ? (targetProgSnap.data().value || {}) : {};

      const splitting = source.filter(j=>idSet.has(j.id));
      const remaining = source.filter(j=>!idSet.has(j.id));
      const newSubJobs = [];

      splitting.forEach(mainJob=>{
        const subJob = Object.assign({}, mainJob, {
          id: 'sub_' + mainJob.id + '_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
          isSubJob: true,
          mainJobWorker: targetWorker,
          mainJobId: mainJob.id,
          lastAssignedBy: fromWorker
        });
        delete subJob.subJobWorker;
        delete subJob.subJobId;
        newSubJobs.push(subJob);

        const updatedMain = Object.assign({}, mainJob, {
          subJobWorker: fromWorker,
          subJobId: subJob.id,
          lastAssignedBy: fromWorker
        });
        targetJobs.push(updatedMain);
        if(fromProg[mainJob.id]){
          targetProg[mainJob.id] = fromProg[mainJob.id];
          delete fromProg[mainJob.id];
        }
      });

      const senderList = remaining.concat(newSubJobs);
      senderList.sort((a,b)=> roundRank(a.round) - roundRank(b.round));
      senderList.forEach((j,idx)=>{ j.order = idx; });
      targetJobs.sort((a,b)=> roundRank(a.round) - roundRank(b.round));
      targetJobs.forEach((j,idx)=>{ j.order = idx; });

      tx.set(fromJobsRef, { value: senderList, updatedAt: Date.now() });
      tx.set(targetJobsRef, { value: targetJobs, updatedAt: Date.now() });
      tx.set(fromProgRef, { value: fromProg, updatedAt: Date.now() });
      tx.set(targetProgRef, { value: targetProg, updatedAt: Date.now() });
    });
  }catch(err){
    console.error('splitAndSendJobs transaction failed', err);
    toast('Connection problem splitting the job — please try again');
  }
}

// the mirror of splitAndSendJobs — used when the sender wants to do the FRONT
// themselves and send the BACK to someone else instead, without needing to pass
// the whole job away and back again. The main job stays exactly where it is; a
// new "back" sub-card is created and sent straight to the chosen worker.
async function splitAndKeepFront(fromWorker, date, jobIds, targetWorker){
  if(!db){ toast('Not connected to the database'); return; }
  const lookup = await loadCoordLookup();
  const idSet = new Set(jobIds);
  const roundOrder = lookup.roundOrder || [];
  function roundRank(roundName){
    const idx = roundOrder.indexOf(roundName);
    return idx === -1 ? Infinity : idx;
  }

  const fromJobsRef = doc(db,'workeriser',`jobs_${fromWorker}_${date}`);
  const targetJobsRef = doc(db,'workeriser',`jobs_${targetWorker}_${date}`);

  try{
    await runTransaction(db, async (tx)=>{
      const [fromSnap, targetSnap] = await Promise.all([tx.get(fromJobsRef), tx.get(targetJobsRef)]);
      const source = fromSnap.exists() ? (fromSnap.data().value || []) : [];
      const targetJobs = targetSnap.exists() ? (targetSnap.data().value || []) : [];
      const newSubJobs = [];

      const updatedSource = source.map(mainJob=>{
        if(!idSet.has(mainJob.id)) return mainJob;
        const subJob = Object.assign({}, mainJob, {
          id: 'sub_' + mainJob.id + '_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
          isSubJob: true,
          mainJobWorker: fromWorker,
          mainJobId: mainJob.id,
          lastAssignedBy: fromWorker
        });
        delete subJob.subJobWorker;
        delete subJob.subJobId;
        newSubJobs.push(subJob);
        return Object.assign({}, mainJob, { subJobWorker: targetWorker, subJobId: subJob.id });
      });

      targetJobs.push(...newSubJobs);
      targetJobs.sort((a,b)=> roundRank(a.round) - roundRank(b.round));
      targetJobs.forEach((j,idx)=>{ j.order = idx; });

      tx.set(fromJobsRef, { value: updatedSource, updatedAt: Date.now() });
      tx.set(targetJobsRef, { value: targetJobs, updatedAt: Date.now() });
    });
  }catch(err){
    console.error('splitAndKeepFront transaction failed', err);
    toast('Connection problem splitting the job — please try again');
  }
}

// if the main job turns out to be Skipped or Cancelled, the "back" sub-card is no
// longer relevant for today — send it back the same way Reject does, rather than
// leaving the second worker with a stray card for a job that isn't happening
async function rejectSubJobForMainStatus(mainWorker, mainJob, date){
  if(!mainJob.subJobWorker || !mainJob.subJobId) return;
  const subWorker = mainJob.subJobWorker, subJobId = mainJob.subJobId;
  const superUsers = await loadSuperUsers();
  const target = mainJob.lastAssignedBy || superUsers[0] || 'Simon';
  await moveJobsToWorker(subWorker, target, date, [subJobId]);
  if(!db) return;
  const mainJobsRef = doc(db,'workeriser',`jobs_${mainWorker}_${date}`);
  try{
    await runTransaction(db, async (tx)=>{
      const snap = await tx.get(mainJobsRef);
      if(!snap.exists()) return;
      const jobs = snap.data().value || [];
      const updated = jobs.map(j=> j.id===mainJob.id ? (({subJobWorker,subJobId,...rest})=>rest)(j) : j);
      tx.set(mainJobsRef, { value: updated, updatedAt: Date.now() });
    });
  }catch(err){ console.error('rejectSubJobForMainStatus transaction failed', err); }
}

// pressed from the sub-card's own Reject button, by whoever currently holds it —
// e.g. "oh, you can do the back as well" — deletes the sub-card outright and
// reverts the main job back to a plain, unsplit job card. Works no matter who
// currently has the sub-card, unlike a normal Reject which sends a job back to
// its sender; here there's nowhere sensible to send it back TO, since it only
// exists because of the split in the first place.
async function rejectSubJobEntirely(subWorker, subJob, date){
  if(!db){ toast('Not connected to the database'); return; }
  const subJobsRef = doc(db,'workeriser',`jobs_${subWorker}_${date}`);
  const subProgRef = doc(db,'workeriser',`progress_${subWorker}_${date}`);

  if(subWorker === subJob.mainJobWorker){
    // both halves happen to be held by the same person right now (e.g. mid-undo of
    // a front split, just after the main job's been moved back) — one transaction
    // covers both changes at once, since they're the same document
    try{
      await runTransaction(db, async (tx)=>{
        const [jobsSnap, progSnap] = await Promise.all([tx.get(subJobsRef), tx.get(subProgRef)]);
        const jobs = jobsSnap.exists() ? (jobsSnap.data().value || []) : [];
        const prog = progSnap.exists() ? (progSnap.data().value || {}) : {};
        const updated = jobs
          .filter(j=>j.id!==subJob.id)
          .map(j=> j.id===subJob.mainJobId ? (({subJobWorker,subJobId,...rest})=>rest)(j) : j);
        const updatedProg = Object.assign({}, prog);
        delete updatedProg[subJob.id];
        tx.set(subJobsRef, { value: updated, updatedAt: Date.now() });
        tx.set(subProgRef, { value: updatedProg, updatedAt: Date.now() });
      });
    }catch(err){
      console.error('rejectSubJobEntirely (same worker) transaction failed', err);
      toast('Connection problem — please try again');
    }
    return;
  }

  const mainJobsRef = doc(db,'workeriser',`jobs_${subJob.mainJobWorker}_${date}`);
  try{
    await runTransaction(db, async (tx)=>{
      const [subJobsSnap, subProgSnap, mainJobsSnap] = await Promise.all([
        tx.get(subJobsRef), tx.get(subProgRef), tx.get(mainJobsRef)
      ]);
      const subJobsList = subJobsSnap.exists() ? (subJobsSnap.data().value || []) : [];
      const subProg = subProgSnap.exists() ? (subProgSnap.data().value || {}) : {};
      const mainJobs = mainJobsSnap.exists() ? (mainJobsSnap.data().value || []) : [];

      const remainingSub = subJobsList.filter(j=>j.id!==subJob.id);
      const remainingSubProg = Object.assign({}, subProg);
      delete remainingSubProg[subJob.id];
      const updatedMain = mainJobs.map(j=> j.id===subJob.mainJobId ? (({subJobWorker,subJobId,...rest})=>rest)(j) : j);

      tx.set(subJobsRef, { value: remainingSub, updatedAt: Date.now() });
      tx.set(subProgRef, { value: remainingSubProg, updatedAt: Date.now() });
      tx.set(mainJobsRef, { value: updatedMain, updatedAt: Date.now() });
    });
  }catch(err){
    console.error('rejectSubJobEntirely transaction failed', err);
    toast('Connection problem — please try again');
  }
}

// reverses a split entirely, for the Undo banner. For a front split (F), the main
// job currently lives with targetWorker and needs moving back first; for a back
// split (B), the main job never moved. Either way, once the main job is back with
// the sender, the linked sub-card just needs deleting and the link cleared —
// exactly what rejectSubJobEntirely already does.
async function undoSplit(senderWorker, date, mainJobId, targetWorker, wasFront){
  if(wasFront){
    await moveJobsToWorker(targetWorker, senderWorker, date, [mainJobId]);
  }
  const senderJobs = await loadJobs(senderWorker, date);
  const mainJob = (senderJobs||[]).find(j=>j.id===mainJobId);
  if(mainJob && mainJob.subJobWorker && mainJob.subJobId){
    const subWorkerJobs = await loadJobs(mainJob.subJobWorker, date);
    const subJob = (subWorkerJobs||[]).find(j=>j.id===mainJob.subJobId);
    if(subJob) await rejectSubJobEntirely(mainJob.subJobWorker, subJob, date);
  }
}

// Day Management's Assigned-to checkboxes call this once "Apply" is pressed. Rather
// than trying to compute a minimal diff for every possible before/after combination,
// this always dissolves any existing split on the job first, then rebuilds the
// desired state from scratch (move to the new front if needed, then split to the
// new back if one's specified) — simpler to reason about and just as safe, since
// every step it calls is already transaction-hardened. currentJob is the job as it
// currently sits on currentWorker's list; newAssignment is [front] or [front, back].
async function applyFrontBackAssignment(cardWorker, cardJob, date, newAssignment){
  const newFront = newAssignment[0];
  const newBack = newAssignment[1] || null;

  if(cardJob.isSubJob){
    // viewing from the back card. Its own existence is certain (we're looking at
    // it), but the main job it claims to link to might not be — that's exactly the
    // kind of error this tool exists to correct. So check first, and never delete
    // this sub-card on the assumption a valid main is waiting on the other end.
    const currentFront = cardJob.mainJobWorker;
    const currentBack = cardWorker;
    if(newFront === currentFront && newBack === currentBack) return;

    const mainJobsList = await loadJobs(cardJob.mainJobWorker, date);
    const mainJob = (mainJobsList||[]).find(j=>j.id===cardJob.mainJobId && j.subJobId===cardJob.id);

    if(mainJob){
      // link confirmed valid both ways — safe to dissolve and rebuild as normal
      await rejectSubJobEntirely(cardWorker, cardJob, date);
      if(newFront !== currentFront){
        await moveJobsToWorker(currentFront, newFront, date, [mainJob.id]);
      }
      if(newBack){
        await splitAndKeepFront(newFront, date, [mainJob.id], newBack);
      }
    } else {
      // the link is stale or broken — this sub-card is the only confirmed-real copy
      // of the job, so convert it in place rather than risk losing it entirely
      if(!db){ toast('Not connected to the database'); return; }
      const backJobsRef = doc(db,'workeriser',`jobs_${cardWorker}_${date}`);
      try{
        await runTransaction(db, async (tx)=>{
          const snap = await tx.get(backJobsRef);
          const jobs = snap.exists() ? (snap.data().value || []) : [];
          const updated = jobs.map(j=> j.id===cardJob.id ? (({isSubJob, mainJobWorker, mainJobId, ...rest})=>rest)(j) : j);
          tx.set(backJobsRef, { value: updated, updatedAt: Date.now() });
        });
      }catch(err){
        console.error('applyFrontBackAssignment (stale link recovery) failed', err);
        toast('Connection problem — please try again');
        return;
      }
      if(newFront !== cardWorker){
        await moveJobsToWorker(cardWorker, newFront, date, [cardJob.id]);
      }
      if(newBack){
        await splitAndKeepFront(newFront, date, [cardJob.id], newBack);
      }
    }
    return;
  }

  // viewing from the front — a normal job, or a main job with a linked sub. cardJob
  // is confirmed to exist here (we're looking at it), so this direction has no
  // equivalent risk: the job we might move is the one right in front of us.
  const currentFront = cardWorker;
  const currentBack = cardJob.subJobWorker || null;
  if(newFront === currentFront && newBack === currentBack) return;

  if(currentBack && cardJob.subJobId){
    const backJobs = await loadJobs(currentBack, date);
    const subJob = (backJobs||[]).find(j=>j.id===cardJob.subJobId);
    if(subJob) await rejectSubJobEntirely(currentBack, subJob, date);
  }
  if(newFront !== currentFront){
    await moveJobsToWorker(currentFront, newFront, date, [cardJob.id]);
  }
  if(newBack){
    await splitAndKeepFront(newFront, date, [cardJob.id], newBack);
  }
}

// scans every worker's list for a split half whose counterpart is missing (e.g. from
// an old data problem, or a job deleted from one side without the link being cleared
// on the other) and recreates the missing half in the worker it's supposed to belong
// to, using the surviving half's own data as the template — landing it as a normal,
// reassignable job there, ready to correct with the Assigned-to checkboxes if the
// worker it lands on isn't right. Returns how many it fixed, so the caller can let
// the person know something needed healing rather than fixing it invisibly.
async function healBrokenSplitLinks(date){
  const results = await Promise.all(WORKERS.map(async w=> ({ w, jobs: (await loadJobs(w, date)) || [] })));
  const jobsByWorker = new Map();
  results.forEach(({w, jobs})=>{
    const m = new Map();
    jobs.forEach(j=>m.set(j.id, j));
    jobsByWorker.set(w, m);
  });

  let healedCount = 0;

  for(const {w, jobs} of results){
    for(const job of jobs){
      if(job.isSubJob && job.mainJobWorker && job.mainJobId){
        const mainJob = jobsByWorker.get(job.mainJobWorker)?.get(job.mainJobId);
        if(mainJob) continue; // link is valid, nothing to heal

        const targetWorker = job.mainJobWorker;
        const newMainId = 'healed_' + job.mainJobId + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,7);
        const newMain = (({isSubJob, mainJobWorker, mainJobId, ...rest})=>rest)(job);
        newMain.id = newMainId;
        newMain.subJobWorker = w;
        newMain.subJobId = job.id;

        const targetJobsList = jobsByWorker.get(targetWorker) ? Array.from(jobsByWorker.get(targetWorker).values()) : [];
        targetJobsList.push(newMain);
        await saveJobs(targetWorker, date, targetJobsList);

        const ownJobsList = Array.from(jobsByWorker.get(w).values());
        const updatedOwn = ownJobsList.map(j=> j.id===job.id ? Object.assign({}, j, { mainJobId: newMainId }) : j);
        await saveJobs(w, date, updatedOwn);

        if(!jobsByWorker.has(targetWorker)) jobsByWorker.set(targetWorker, new Map());
        jobsByWorker.get(targetWorker).set(newMainId, newMain);
        jobsByWorker.get(w).set(job.id, Object.assign({}, job, { mainJobId: newMainId }));

        healedCount++;
      } else if(job.subJobWorker && job.subJobId){
        const subJob = jobsByWorker.get(job.subJobWorker)?.get(job.subJobId);
        if(subJob) continue; // link is valid, nothing to heal

        const targetWorker = job.subJobWorker;
        const newSubId = 'healed_sub_' + job.id + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,7);
        const newSub = Object.assign({}, job, {
          id: newSubId,
          isSubJob: true,
          mainJobWorker: w,
          mainJobId: job.id
        });
        delete newSub.subJobWorker;
        delete newSub.subJobId;

        const targetJobsList = jobsByWorker.get(targetWorker) ? Array.from(jobsByWorker.get(targetWorker).values()) : [];
        targetJobsList.push(newSub);
        await saveJobs(targetWorker, date, targetJobsList);

        const ownJobsList = Array.from(jobsByWorker.get(w).values());
        const updatedOwn = ownJobsList.map(j=> j.id===job.id ? Object.assign({}, j, { subJobId: newSubId }) : j);
        await saveJobs(w, date, updatedOwn);

        if(!jobsByWorker.has(targetWorker)) jobsByWorker.set(targetWorker, new Map());
        jobsByWorker.get(targetWorker).set(newSubId, newSub);
        jobsByWorker.get(w).set(job.id, Object.assign({}, job, { subJobId: newSubId }));

        healedCount++;
      }
    }
  }

  return healedCount;
}

/* ================= CSV PARSING ================= */
function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c === '\r'){ /* skip */ }
      else field += c;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  if(!rows.length) return [];
  const headers = rows[0].map(h=>h.trim());
  return rows.slice(1).filter(r=>r.length>1 || r[0] !== '').map(r=>{
    const obj = {};
    headers.forEach((h,idx)=>{ obj[h] = (r[idx] !== undefined ? r[idx] : '').trim(); });
    return obj;
  });
}

function pick(row, candidates){
  for(const c of candidates){
    if(row[c] !== undefined && String(row[c]).trim() !== '') return row[c];
  }
  return '';
}

function rowsToJobs(rows){
  return rows.map((r,idx)=>{
    const price = parseFloat(pick(r,['Price'])) || 0;
    const balance = parseFloat(pick(r,['Balance'])) || 0;
    const frontPrice = Math.ceil(price/2 + 1);
    const lat = parseFloat(pick(r,['Job Latitude','Customer Latitude']));
    const lon = parseFloat(pick(r,['Job Longitude','Customer Longitude']));
    const address = pick(r,['Job Address','Customer Address','Address']);
    const postcode = pick(r,['Job Postcode','Customer Postcode']);
    const phone = pick(r,['Job Phone 1','Customer Phone 1','Phone 1']);
    const csvStatus = (pick(r,['Status']) || '').trim().toLowerCase();
    return {
      id: pick(r,['Aworka Job ID','Aworka ID','Job Ref']) || ('row'+idx),
      order: idx,
      customer: (pick(r,['Customer Name','Customer']) || '').trim() || '(no name on file)',
      address: address,
      postcode: postcode,
      phone: phone,
      lat: isFinite(lat) ? lat : null,
      lon: isFinite(lon) ? lon : null,
      round: pick(r,['Round']) || '',
      roundIndex: pick(r,['Round Index']) || null,
      price: price,
      frontPrice: frontPrice,
      balance: balance,
      notes: pick(r,['Job Day Notes','Notes','Description','Job Notes']),
      timeRequired: pick(r,['Time Required']),
      frequency: pick(r,['Frequency']),
      initialStatus: csvStatus === 'skip' ? 'skipped' : null
    };
  });
}

function navUrl(job){
  if(job.lat != null && job.lon != null){
    return `https://www.google.com/maps/dir/?api=1&destination=${job.lat},${job.lon}`;
  }
  const q = [job.address, job.postcode].filter(Boolean).join(', ');
  return `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(q)}`;
}

// rounds ending in a standalone "v" (e.g. "R) Ryhill 12 v") need a different completion
// slip through the door — flagged visually on the job card regardless of who it's assigned to
function isVRound(round){
  if(!round) return false;
  const parts = round.trim().split(/\s+/);
  return parts.length > 0 && parts[parts.length-1].toLowerCase() === 'v';
}

/* ---- coordinate reference lookup (address -> lat/lon), updated occasionally ---- */
async function loadCoordLookup(){ return (await fsGet('coord_lookup')) || { updatedAt:null, addresses:{}, roundOrder:[], roundPosition:{}, roundIndexOrder:{} }; }
async function saveCoordLookup(lookup){ await fsSet('coord_lookup', lookup); }

function normAddr(a){
  return (a||'').toLowerCase().replace(/[^a-z0-9, ]/g,'').replace(/\s+/g,' ').trim();
}

function buildCoordAddresses(rows){
  const addresses = {};
  rows.forEach(r=>{
    const addr = pick(r,['Job Address','Customer Address','Address']);
    const lat = parseFloat(pick(r,['Job Latitude','Customer Latitude']));
    const lon = parseFloat(pick(r,['Job Longitude','Customer Longitude']));
    const n = normAddr(addr);
    if(n && isFinite(lat) && isFinite(lon)){
      addresses[n] = { lat, lon, raw: addr };
    }
  });
  return addresses;
}

// the order rounds first appear in the reference CSV is treated as the canonical round sequence
function buildRoundOrder(rows){
  const order = [];
  const seen = new Set();
  rows.forEach(r=>{
    const round = pick(r,['Round']);
    if(round && !seen.has(round)){
      seen.add(round);
      order.push(round);
    }
  });
  return order;
}

// each round's first row position in the reference file — used as a fallback for
// jobs that never had a Round Index at all (e.g. a New Customer added directly in
// the app, rather than coming from an Aworka export)
function buildRoundPosition(rows){
  const pos = {};
  rows.forEach((r,idx)=>{
    const round = pick(r,['Round']);
    if(round && !(round in pos)) pos[round] = idx;
  });
  return pos;
}

// Round + Round Index together uniquely identify a job in Aworka's own data —
// no text matching needed at all, so this is the most reliable identifier
// available and works even for customers whose name and address are both hidden
function buildRoundIndexOrder(rows){
  const order = {};
  rows.forEach((r,idx)=>{
    const round = pick(r,['Round']);
    const roundIndex = pick(r,['Round Index']);
    if(!round || !roundIndex) return;
    const key = round + '||' + roundIndex;
    if(!(key in order)) order[key] = idx;
  });
  return order;
}

function findRoundIndexRank(round, roundIndex, roundIndexOrder){
  if(!round || !roundIndex) return null;
  const key = round + '||' + roundIndex;
  return (key in roundIndexOrder) ? roundIndexOrder[key] : null;
}

function findCoordsForAddress(address, lookup){
  const n = normAddr(address);
  if(!n) return null;
  if(lookup.addresses[n]) return lookup.addresses[n];
  let best = null, bestLen = 0;
  for(const key in lookup.addresses){
    if((key.includes(n) || n.includes(key)) && key.length > bestLen){
      best = lookup.addresses[key];
      bestLen = key.length;
    }
  }
  return best;
}

// fills in missing coordinates on a set of jobs from the stored lookup; returns list of addresses still missing
async function resolveCoordinates(jobs){
  const lookup = await loadCoordLookup();
  const missing = [];
  jobs.forEach(job=>{
    if(job.lat == null || job.lon == null){
      const found = findCoordsForAddress(job.address, lookup);
      if(found){ job.lat = found.lat; job.lon = found.lon; }
    }
    if(job.lat == null || job.lon == null){
      missing.push(job.address || job.customer);
    }
  });
  return missing;
}

// after a fresh coordinate reference is uploaded, retroactively fill in any already-loaded rounds
async function rescanAllRoundsForCoords(){
  const lookup = await loadCoordLookup();
  const meta = await getMeta();
  let fixed = 0, stillMissing = 0;
  for(const key of meta.rounds){
    const [worker,date] = key.split('|');
    const jobs = await fsGet(`jobs_${worker}_${date}`);
    if(!jobs) continue;
    let changed = false;
    jobs.forEach(job=>{
      if(job.lat == null || job.lon == null){
        const found = findCoordsForAddress(job.address, lookup);
        if(found){ job.lat = found.lat; job.lon = found.lon; changed = true; fixed++; }
        else stillMissing++;
      }
    });
    if(changed) await fsSet(`jobs_${worker}_${date}`, jobs);
  }
  return { fixed, stillMissing };
}



/* ================= APP STATE ================= */
let state = { screen:'login' };
const app = document.getElementById('app');

// Delays a job card's move into/out of the Completed section for 5s after the
// last interaction with that card, so cash/price/note edits can still happen
// without the card jumping away underneath the user.
const cardTimers = new Map();
function scheduleReflow(jobId, worker, date){
  if(cardTimers.has(jobId)) clearTimeout(cardTimers.get(jobId));
  const t = setTimeout(()=>{
    cardTimers.delete(jobId);
    if(state.screen==='worker' && state.worker===worker && state.date===date){
      render();
    }
  }, 5000);
  cardTimers.set(jobId, t);
}

function go(screen, extra){ state = Object.assign({screen}, extra); render(); saveSession(); }

// Mobile browsers frequently unload a backgrounded tab/PWA from memory (e.g. when
// switching to the Phone or WhatsApp) and silently reload it on return, wiping the
// in-memory `state`. Persisting just who's logged in — not the date — lets the app
// quietly resume the right person without them having to reselect, while still
// defaulting to *today* the normal way. Restricted to the worker screen only, so a
// reload can never resume straight into the password-protected admin area.
const SESSION_KEY = 'wjt_session';
const SESSION_MAX_AGE_MS = 8 * 60 * 60 * 1000; // 8 hours — same shift, not the next day
function saveSession(){
  try{
    if(state.screen === 'worker' && state.worker){
      localStorage.setItem(SESSION_KEY, JSON.stringify({ worker: state.worker, savedAt: Date.now() }));
    } else if(state.screen === 'login'){
      localStorage.removeItem(SESSION_KEY);
    }
  }catch(e){ /* localStorage unavailable — fail silently, normal login still works */ }
}
function restoreSession(){
  try{
    const raw = localStorage.getItem(SESSION_KEY);
    if(!raw) return null;
    const saved = JSON.parse(raw);
    const age = Date.now() - (saved.savedAt || 0);
    if(saved.worker && age >= 0 && age < SESSION_MAX_AGE_MS) return saved.worker;
  }catch(e){}
  return null;
}

// If the page was just paused (not reloaded) while backgrounded, JS state survives
// but the data on screen could be stale by the time the user comes back — refresh
// immediately rather than waiting for the next background poll.
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible' && state.screen === 'worker'){
    render();
  }
});

// Quietly checks every 15s for jobs added/removed by someone else (e.g. Simon
// sending or reclaiming jobs) while a worker is sitting on their own list, and
// refreshes automatically if anything's changed — no manual refresh needed.
let workerPollTimer = null;
function jobIdsKey(jobs){ return (jobs||[]).map(j=>j.id).sort().join(','); }
function startWorkerPoll(worker, date, currentJobs){
  if(workerPollTimer) clearInterval(workerPollTimer);
  const knownKey = jobIdsKey(currentJobs);
  const splitJobs = (currentJobs||[]).filter(j=>j.isSubJob || j.subJobWorker);

  async function computeLinkedSignature(){
    if(!splitJobs.length) return '';
    const myProg = await loadProgress(worker, date);
    const parts = await Promise.all(splitJobs.map(async j=>{
      if(j.isSubJob && j.mainJobWorker && j.mainJobId){
        const mProg = await loadProgress(j.mainJobWorker, date);
        const mp = (mProg||{})[j.mainJobId] || {};
        return j.id + ':' + (mp.price||'') + ':' + (mp.status||'') + ':' + (mp.payment||'');
      } else if(j.subJobWorker && j.subJobId){
        const sProg = await loadProgress(j.subJobWorker, date);
        const sp = (sProg||{})[j.subJobId] || {};
        const myPrice = (myProg[j.id]||{}).price || '';
        return j.id + ':' + (sp.payment||'') + ':' + myPrice;
      }
      return '';
    }));
    return parts.join('|');
  }

  let knownLinkedSignature = null;
  workerPollTimer = setInterval(async ()=>{
    if(state.screen!=='worker' || state.worker!==worker || state.date!==date){
      clearInterval(workerPollTimer);
      return;
    }
    const freshJobs = await loadJobs(worker,date);
    if(jobIdsKey(freshJobs) !== knownKey){
      render();
      return;
    }
    if(splitJobs.length){
      if(knownLinkedSignature === null) knownLinkedSignature = await computeLinkedSignature();
      const freshSignature = await computeLinkedSignature();
      if(freshSignature !== knownLinkedSignature){
        knownLinkedSignature = freshSignature;
        render();
      }
    }
  }, 15000);
}

// Invisible full-screen "wake" cover for the worker's own job list, to cut down on
// accidental button presses (phone in a pocket/bag, brushed against something, etc).
// A single tap anywhere dismisses it without triggering whatever's underneath; it
// silently re-arms after 3s with no activity of any kind (taps, scrolling, typing).
let guardEl = null;
let guardTimer = null;
function resetGuardTimer(){
  if(guardTimer) clearTimeout(guardTimer);
  guardTimer = setTimeout(()=>{
    if(state.screen === 'worker' && guardEl) guardEl.style.display = 'block';
  }, 3000);
}
function armScreenGuard(){
  if(!guardEl){
    guardEl = document.createElement('div');
    guardEl.id = 'screenGuard';
    guardEl.style.cssText = 'position:fixed;inset:0;z-index:9999;background:transparent;';
    document.body.appendChild(guardEl);
    guardEl.addEventListener('click', ()=>{ guardEl.style.display = 'none'; resetGuardTimer(); }, {passive:true});
    guardEl.addEventListener('touchstart', ()=>{ guardEl.style.display = 'none'; resetGuardTimer(); }, {passive:true});
    ['click','input','scroll','touchstart','keydown'].forEach(evt=>{
      document.addEventListener(evt, ()=>{
        if(state.screen === 'worker') resetGuardTimer();
      }, {passive:true, capture:true});
    });
  }
  guardEl.style.display = 'none'; // starts open; only arms after 3s of inactivity
  resetGuardTimer();
}
function stopScreenGuard(){
  if(guardTimer) clearTimeout(guardTimer);
  if(guardEl) guardEl.style.display = 'none';
}

function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(()=>t.classList.add('show'));
  setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(),250); }, 1900);
}

function money(n){
  const v = Math.round((n + Number.EPSILON)*100)/100;
  const sign = v < 0 ? '-' : '';
  return sign + '£' + Math.abs(v).toFixed(2);
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}

function resolvedPrice(job, p){
  return (p && p.price !== undefined && p.price !== '' && !isNaN(parseFloat(p.price))) ? parseFloat(p.price) : job.price;
}

// skipped/cancelled jobs weren't actually cleaned, so no charge applies for the day
function chargeForStatus(price, status){
  return status==='skipped' ? 0 : price;
}

// a split job (worked on by two people at once) counts as half a job for EACH
// worker's tallies, not a whole one each — otherwise reports would double-count
// the same piece of work. A job that isn't split counts as a normal whole job.
function jobWeight(job){
  return (job.isSubJob || job.subJobWorker) ? 0.5 : 1;
}

// splits a job's earned value between front and back using the actual front-only
// price on record (the formula, or a worker's real-world correction) rather than a
// blanket 50/50 — the £1 taken off the front-only price accounts for it normally
// including a standalone-visit surcharge that doesn't apply when it's done as one
// combined visit with someone else. A job that isn't currently split earns its
// full price as normal.
function splitEarnedShare(job, fullPrice, customFrontPrices){
  if(!job.isSubJob && !job.subJobWorker) return fullPrice;
  const refId = job.isSubJob ? job.mainJobId : job.id;
  const foPrice = (customFrontPrices[refId] !== undefined && customFrontPrices[refId] !== null)
    ? customFrontPrices[refId]
    : (job.frontPrice || Math.ceil(fullPrice/2 + 1));
  const frontShare = Math.max(0, foPrice - 1);
  return job.isSubJob ? Math.max(0, fullPrice - frontShare) : frontShare;
}

// formats a possibly-fractional job count for display — "3" stays "3", a half-job
// total like 3.5 keeps its one decimal place rather than showing 3.500000001 etc.
function formatJobCount(n){
  const rounded = Math.round(n * 10) / 10;
  return Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(1);
}

// sorts jobs by the canonical round order (from the round-order reference file), falling
// back to each job's own stored order within a round, or to the end if the round isn't
// recognised at all — used to keep reports consistent even if a list's stored order has
// drifted (e.g. after Reverse, or jobs moved in from elsewhere)
// combines exact address position (Aworka's true visiting order, from the reference file)
// with a round-grouped fallback for anything that isn't matched (e.g. brand new customers)
function roundOrderRank(job, lookup){
  const riRank = findRoundIndexRank(job.round, job.roundIndex, lookup.roundIndexOrder || {});
  if(riRank !== null) return riRank;
  // falls back to round position only for jobs that never had a Round Index at all —
  // e.g. a New Customer added directly in the app, never having come from Aworka
  const roundPosition = lookup.roundPosition || {};
  if(job.round in roundPosition){
    return roundPosition[job.round] + (job.order || 0) * 0.0001;
  }
  return Infinity; // round genuinely not recognised at all — nothing sensible to fall back to
}

function sortJobsByRoundOrder(jobs, lookup){
  return jobs.slice().sort((a,b)=> roundOrderRank(a,lookup) - roundOrderRank(b,lookup));
}

// report-table cell for what was actually charged today, flagging front-only prices
function chargedCell(r){
  if(r.status === 'todo') return `<td class="num">-</td>`;
  const charged = chargeForStatus(r.price, r.status);
  const isFront = charged > 0.004 && !!r.frontApplied;
  const isAltered = !isFront && charged > 0.004 && Math.abs(charged - r.job.price) > 0.005;
  const style = isAltered ? ` style="color:var(--blue);font-weight:700;"` : '';
  return `<td class="num"${style}>${isFront ? '<span class="badge badge-front">F</span> ' : ''}${money(charged)}</td>`;
}

// report-table cell for cash paid — red draws the eye to unpaid jobs, green confirms cash in hand
function paidCell(r){
  if(r.status === 'todo') return `<td class="num">-</td>`;
  const paid = r.payment;
  const color = paid > 0.004 ? 'var(--green)' : 'var(--red)';
  return `<td class="num"><b style="color:${color}">${money(paid)}</b></td>`;
}

// report-table cell for the running balance after today — muted, since Paid is the main signal here
function balanceCell(r){
  if(r.status === 'todo') return `<td class="num">-</td>`;
  const bal = r.owedAfter;
  const color = bal > 0.004 ? '#a97b7b' : '#7a9c8c';
  const val = bal > 0.004 ? bal : (bal < -0.004 ? -bal : 0);
  return `<td class="num" style="color:${color}">${money(val)}</td>`;
}

// like chargedCell, but shows the standard price for to-do jobs instead of dashing them out
function priceCell(r){
  if(r.status === 'todo') return `<td class="num">${money(r.price)}</td>`;
  return chargedCell(r);
}

// compact tick/blank cash indicator, used where a full amount would take too much space
function cashCell(r){
  const paid = r.payment > 0.004;
  return `<td class="num" style="text-align:center;">${paid ? '<span style="color:var(--green);font-weight:800;">✓</span>' : ''}</td>`;
}

// what they currently owe overall — includes today's price only if the job was actually
// done today; skipped/cancelled/to-do jobs don't add today's charge to the balance
function currentBalanceCell(r){
  const debt = -r.job.balance;
  const chargeToday = r.status === 'done' ? r.price : 0;
  const bal = debt + chargeToday - r.payment;
  const color = bal > 0.004 ? '#a97b7b' : '#7a9c8c';
  const val = bal > 0.004 ? bal : (bal < -0.004 ? -bal : 0);
  return `<td class="num" style="color:${color}">${money(val)}</td>`;
}

function statusLabel(status){
  return status === 'todo' ? 'Not done' : status;
}

// cancelled is now independent of status, so it needs its own badge alongside the status one
function cancelledBadge(cancelled){
  return cancelled ? ' <span class="badge badge-cancelled">cancelled</span>' : '';
}

// shared "new customers to add to Aworka" summary, used across all report views
function renderNewCustomerSection(rows, useToDoLabel){
  const newRows = rows.filter(r => r.job.isNewCustomer);
  if(!newRows.length) return '';
  return `
    <div class="card pad" style="margin-top:14px;border:1.5px solid var(--blue);">
      <div class="section-title" style="color:var(--blue);">New customers</div>
      ${newRows.map(r=>{
        const j = r.job;
        const name = [j.title, j.firstName, j.lastName].filter(Boolean).join(' ') || '(name not given)';
        const payMethods = [j.gocardless ? 'Gocardless' : '', j.invoice ? 'Invoice' : ''].filter(Boolean).join(', ');
        const label = (useToDoLabel && r.status==='todo') ? 'To do' : statusLabel(r.status);
        const createdByText = j.createdBy || r.worker; // fall back for older entries added before this was tracked
        return `
          <div style="padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.6;">
            <b>${escapeHtml(name)}</b>${createdByText ? ` <span class="muted">(added by ${escapeHtml(createdByText)})</span>` : ''} — ${escapeHtml(j.address)}<br>
            Price: ${money(j.price)} · Frequency: ${escapeHtml(j.frequency||'—')} · Status: ${label}${r.cancelled ? ' · Cancelled' : ''}<br>
            ${j.email ? `Email: ${escapeHtml(j.email)}<br>` : ''}
            ${j.phone ? `Phone: ${escapeHtml(j.phone)}${j.needsGateText ? ' (requires txt night before)' : ''}<br>` : (j.needsGateText ? `Requires txt night before — no phone given<br>` : '')}
            ${payMethods ? `Payment: ${payMethods}<br>` : ''}
            ${j.notes ? `Notes: ${escapeHtml(j.notes)}` : ''}
          </div>
        `;
      }).join('')}
    </div>
  `;
}

/* ================= RENDER ROUTER ================= */
let lastScreenRendered = null;
async function render(){
  if(!configOk){ renderNeedsSetup(); return; }
  const sameScreen = state.screen === lastScreenRendered;
  const savedScroll = sameScreen ? window.scrollY : 0;
  if(!sameScreen){
    app.innerHTML = '<div class="center-screen"><p class="muted">Loading…</p></div>';
  }
  lastScreenRendered = state.screen;
  app.classList.toggle('admin-wide', state.screen==='admin' || state.screen==='adminLogin');
  if(state.screen !== 'worker') stopScreenGuard();
  if(state.screen==='login') await renderLogin();
  else if(state.screen==='worker') await renderWorker();
  else if(state.screen==='daySummary') await renderDaySummary();
  else if(state.screen==='adminLogin') renderAdminLogin();
  else if(state.screen==='admin') await renderAdmin();
  else if(state.screen==='newCustomer') await renderNewCustomer();
  if(sameScreen) window.scrollTo(0, savedScroll);
}

    <h2 style="margin:0 0 8px;">Almost there</h2>
    <p class="muted" style="max-width:340px;line-height:1.5;">This copy of Workeriser isn't connected to a shared database yet, so it can't sync between phones. Open the file and fill in the <b>firebaseConfig</b> values near the top of the &lt;script&gt; section — instructions are in the comment right above it.</p>
  </div>`;
}

    <div class="login-hero">
      <div class="glyph">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M4 4h11l5 5v11H4V4z" stroke="#f0a202" stroke-width="1.6" stroke-linejoin="round"/><path d="M15 4v5h5" stroke="#f0a202" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 13.5l2.2 2.2L16 10" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
